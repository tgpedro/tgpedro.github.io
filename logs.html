<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>logs</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --bg: #050509;
      --surface: rgba(255,255,255,.060);
      --surface-2: rgba(255,255,255,.085);
      --surface-3: rgba(255,255,255,.125);
      --line: rgba(255,255,255,.105);
      --line-2: rgba(255,255,255,.155);
      --text: #f7f7fb;
      --muted: rgba(247,247,251,.58);
      --muted-2: rgba(247,247,251,.38);
      --accent: #60a5fa;
      --accent-2: #67e8f9;
      --accent-soft: rgba(96,165,250,.16);
      --accent-glow: rgba(96,165,250,.24);
      --danger: #ff6b81;
      --danger-soft: rgba(255,107,129,.13);
      --success: #7bed9f;
      --success-soft: rgba(126,237,159,.11);
      --purple: #c4b5fd;
      --shadow: 0 26px 90px rgba(0,0,0,.42);
      --sidebar: 390px;
    }

    body.day-0 { --accent: #34d399; --accent-2: #67e8f9; --accent-soft: rgba(52,211,153,.16); --accent-glow: rgba(103,232,249,.20); }
    body.day-1 { --accent: #60a5fa; --accent-2: #93c5fd; --accent-soft: rgba(96,165,250,.16); --accent-glow: rgba(96,165,250,.28); }
    body.day-2 { --accent: #a78bfa; --accent-2: #c4b5fd; --accent-soft: rgba(167,139,250,.16); --accent-glow: rgba(167,139,250,.28); }
    body.day-3 { --accent: #22c55e; --accent-2: #86efac; --accent-soft: rgba(34,197,94,.15); --accent-glow: rgba(34,197,94,.24); }
    body.day-4 { --accent: #f59e0b; --accent-2: #fde68a; --accent-soft: rgba(245,158,11,.15); --accent-glow: rgba(245,158,11,.24); }
    body.day-5 { --accent: #f472b6; --accent-2: #f0abfc; --accent-soft: rgba(244,114,182,.15); --accent-glow: rgba(244,114,182,.24); }
    body.day-6 { --accent: #fb7185; --accent-2: #fdba74; --accent-soft: rgba(251,113,133,.14); --accent-glow: rgba(253,186,116,.22); }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      min-height: 100%;
      overflow: hidden;
      color: var(--text);
      background:
        radial-gradient(circle at 16% 10%, var(--accent-glow), transparent 28%),
        radial-gradient(circle at 88% 4%, rgba(255,255,255,.075), transparent 24%),
        radial-gradient(circle at 65% 108%, var(--accent-soft), transparent 32%),
        linear-gradient(180deg, #0b0b10, #050509 58%, #030305);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    }

    button, input, textarea, select { font: inherit; }
    button { border: 0; color: inherit; cursor: pointer; }
    a { color: inherit; text-decoration: none; }

    .app {
      width: min(1440px, calc(100vw - 28px));
      height: calc(100vh - 28px);
      margin: 14px auto;
      display: grid;
      grid-template-columns: var(--sidebar) minmax(0, 1fr);
      border: 1px solid rgba(255,255,255,.11);
      border-radius: 34px;
      background: rgba(13,13,18,.68);
      backdrop-filter: blur(26px);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .sidebar {
      min-width: 0;
      display: grid;
      grid-template-rows: auto auto auto 1fr;
      border-right: 1px solid rgba(255,255,255,.09);
      background:
        linear-gradient(180deg, rgba(255,255,255,.075), rgba(255,255,255,.035)),
        rgba(8,8,12,.68);
      overflow: hidden;
    }

    .sidebar-top {
      padding: 18px 18px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .title-wrap { min-width: 0; }
    .title-wrap h1 {
      margin: 0;
      font-size: 2rem;
      line-height: .95;
      letter-spacing: -.07em;
      text-transform: lowercase;
    }

    .title-wrap p {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: .82rem;
      font-weight: 650;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 7px;
      flex: 0 0 auto;
    }

    .icon-btn,
    .pill,
    .primary,
    .chip,
    .menu-trigger {
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.075);
      border-radius: 999px;
      color: var(--text);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.08);
      transition: transform .18s ease, background .18s ease, border .18s ease, opacity .18s ease;
    }

    .icon-btn {
      width: 39px;
      height: 39px;
      display: grid;
      place-items: center;
      padding: 0;
    }

    .icon-btn svg { width: 18px; height: 18px; }

    .pill,
    .primary,
    .chip,
    .menu-trigger {
      min-height: 39px;
      padding: 9px 13px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-size: .82rem;
      font-weight: 750;
    }

    .primary {
      border: 0;
      color: #17130a;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 18px 38px var(--accent-glow);
    }

    .ghost {
      background: transparent;
      border-color: transparent;
      color: var(--muted);
      box-shadow: none;
    }

    .danger {
      color: #ffd1d8;
      background: var(--danger-soft);
      border-color: rgba(255,107,129,.22);
    }

    .success {
      color: #d8ffe3;
      background: var(--success-soft);
      border-color: rgba(126,237,159,.22);
    }

    .icon-btn:hover,
    .pill:hover,
    .primary:hover,
    .chip:hover,
    .menu-trigger:hover {
      transform: translateY(-1px);
      background: rgba(255,255,255,.12);
      border-color: rgba(255,255,255,.20);
    }

    .primary:hover {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
    }

    .tabbar {
      margin: 0 18px 12px;
      padding: 5px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px;
      border-radius: 999px;
      background: rgba(255,255,255,.050);
      border: 1px solid rgba(255,255,255,.085);
    }

    .tabbar button {
      min-height: 38px;
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      font-size: .82rem;
      font-weight: 820;
      transition: .18s ease;
    }

    .tabbar button.active {
      color: #17130a;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 14px 30px var(--accent-glow);
    }

    .search-zone {
      padding: 0 18px 14px;
      display: grid;
      gap: 9px;
    }

    .search-box { position: relative; }

    .search-box svg {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      width: 17px;
      height: 17px;
      color: var(--muted);
      pointer-events: none;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid rgba(255,255,255,.105);
      background: rgba(255,255,255,.075);
      color: var(--text);
      outline: none;
      border-radius: 18px;
      padding: 12px 13px;
      transition: border .18s ease, background .18s ease, box-shadow .18s ease;
    }

    input:focus,
    textarea:focus {
      border-color: var(--accent);
      background: rgba(255,255,255,.095);
      box-shadow: 0 0 0 4px var(--accent-soft);
    }

    .search-box input {
      padding-left: 38px;
      min-height: 43px;
    }

    .filter-row {
      display: flex;
      gap: 7px;
      align-items: center;
      min-width: 0;
    }

    .mac-select {
      position: relative;
      min-width: 0;
      flex: 1;
    }

    .mac-select.compact { flex: 0 0 auto; }

    .menu-trigger {
      width: 100%;
      justify-content: space-between;
      color: rgba(247,247,251,.82);
      white-space: nowrap;
    }

    .menu-trigger b {
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 750;
    }

    .menu-trigger svg {
      width: 15px;
      height: 15px;
      color: var(--muted);
      transition: transform .18s ease;
    }

    .mac-select.open .menu-trigger svg { transform: rotate(180deg); }

    .select-menu {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      z-index: 50;
      min-width: 230px;
      max-height: 280px;
      overflow: auto;
      padding: 7px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 18px;
      background: rgba(24,24,31,.90);
      backdrop-filter: blur(22px);
      box-shadow: 0 22px 70px rgba(0,0,0,.42);
      opacity: 0;
      transform: scale(.98) translateY(-4px);
      pointer-events: none;
      transition: opacity .16s ease, transform .16s ease;
      scrollbar-width: none;
    }

    .select-menu::-webkit-scrollbar { display: none; }

    .mac-select.align-right .select-menu {
      left: auto;
      right: 0;
    }

    .mac-select.open .select-menu {
      opacity: 1;
      transform: scale(1) translateY(0);
      pointer-events: auto;
    }

    .select-option {
      width: 100%;
      min-height: 37px;
      padding: 9px 10px;
      display: grid;
      grid-template-columns: 18px 1fr auto;
      align-items: center;
      gap: 8px;
      border-radius: 12px;
      background: transparent;
      color: rgba(247,247,251,.78);
      text-align: left;
      font-size: .82rem;
      font-weight: 720;
    }

    .select-option:hover {
      background: rgba(255,255,255,.08);
      color: white;
    }

    .select-option .checkmark {
      opacity: 0;
      color: var(--accent-2);
    }

    .select-option.active .checkmark { opacity: 1; }

    .select-option small {
      color: var(--muted-2);
      font-weight: 750;
    }

    .list-wrap {
      min-height: 0;
      overflow: auto;
      padding: 0 10px 12px;
      scrollbar-width: none;
    }

    .list-wrap::-webkit-scrollbar,
    .editor-body::-webkit-scrollbar,
    .modal::-webkit-scrollbar {
      display: none;
    }

    .day-group {
      padding: 12px 8px 7px;
      color: var(--muted);
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .02em;
      text-transform: lowercase;
    }

    .note-card {
      position: relative;
      display: grid;
      gap: 7px;
      padding: 13px 14px;
      margin-bottom: 8px;
      border-radius: 20px;
      border: 1px solid transparent;
      background: transparent;
      cursor: pointer;
      transition: background .18s ease, border .18s ease, transform .18s ease;
      animation: itemIn .22s ease both;
    }

    .note-card:hover {
      background: rgba(255,255,255,.055);
      transform: translateY(-1px);
    }

    .note-card.active {
      background: rgba(255,255,255,.102);
      border-color: rgba(255,255,255,.12);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.075);
    }

    .note-card.review-due::before {
      content: "";
      position: absolute;
      left: 0;
      top: 12px;
      bottom: 12px;
      width: 4px;
      border-radius: 999px;
      background: var(--danger);
    }

    .note-card.review-soon::before {
      content: "";
      position: absolute;
      left: 0;
      top: 12px;
      bottom: 12px;
      width: 4px;
      border-radius: 999px;
      background: var(--accent);
    }

    .note-card h3 {
      margin: 0;
      font-size: .98rem;
      letter-spacing: -.025em;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .note-card p {
      margin: 0;
      color: var(--muted);
      font-size: .80rem;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .note-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      color: var(--muted-2);
      font-size: .72rem;
      font-weight: 800;
    }

    .note-pill {
      max-width: 112px;
      padding: 4px 7px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent-2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .note-pill.due {
      background: rgba(255,107,129,.13);
      color: #ffd1d8;
    }

    .note-pill.done {
      background: rgba(126,237,159,.11);
      color: #d8ffe3;
    }

    .content {
      min-width: 0;
      display: grid;
      grid-template-rows: auto 1fr;
      background:
        radial-gradient(circle at 82% 8%, rgba(247,183,49,.09), transparent 28%),
        rgba(255,255,255,.018);
      overflow: hidden;
    }

    .content-top {
      min-height: 64px;
      padding: 14px 18px;
      border-bottom: 1px solid rgba(255,255,255,.075);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      background: rgba(10,10,15,.42);
      backdrop-filter: blur(20px);
    }

    .mobile-back { display: none; }

    .content-status { min-width: 0; }

    .content-status span {
      display: block;
      color: var(--muted);
      font-size: .78rem;
      font-weight: 750;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .content-status b {
      display: block;
      margin-top: 3px;
      font-size: .86rem;
      letter-spacing: -.02em;
      color: rgba(247,247,251,.80);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .content-actions {
      display: flex;
      align-items: center;
      gap: 7px;
      flex: 0 0 auto;
    }

    .sync-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--muted-2);
      box-shadow: 0 0 18px rgba(255,255,255,.15);
    }

    .sync-dot.online {
      background: var(--success);
      box-shadow: 0 0 18px rgba(126,237,159,.35);
    }

    .sync-dot.offline {
      background: var(--danger);
      box-shadow: 0 0 18px rgba(255,107,129,.35);
    }

    .editor-body {
      min-height: 0;
      overflow: auto;
      scrollbar-width: none;
    }

    .empty-state {
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 30px;
      text-align: center;
    }

    .empty-card {
      width: min(480px, 100%);
      padding: 34px;
      border-radius: 34px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.052);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.06);
      animation: softFadeUp .34s ease both;
    }

    .empty-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      display: grid;
      place-items: center;
      border-radius: 22px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #17130a;
      box-shadow: 0 18px 42px var(--accent-glow);
    }

    .empty-card h2 {
      margin: 0;
      font-size: 1.8rem;
      line-height: 1;
      letter-spacing: -.06em;
      text-transform: lowercase;
    }

    .empty-card p {
      margin: 12px 0 18px;
      color: var(--muted);
      line-height: 1.45;
      font-size: .94rem;
    }

    .reader,
    .editor-form {
      width: min(860px, 100%);
      margin: 0 auto;
      padding: 42px 34px 80px;
      animation: softFadeUp .28s ease both;
    }

    .reader-date {
      color: var(--muted);
      font-size: .84rem;
      font-weight: 750;
      margin-bottom: 15px;
    }

    .reader h2,
    .edit-title {
      margin: 0;
      width: 100%;
      font-size: clamp(2.3rem, 6vw, 4.6rem);
      line-height: .92;
      letter-spacing: -.075em;
      text-transform: lowercase;
    }

    .edit-title {
      border: 0;
      padding: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      font-weight: 750;
    }

    .edit-title:focus {
      box-shadow: none;
      background: transparent;
      border: 0;
    }

    .reader-sub {
      margin: 12px 0 0;
      color: rgba(247,247,251,.68);
      font-size: 1rem;
      font-weight: 650;
    }

    .reader-chips,
    .edit-meta,
    .type-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 18px;
    }

    .reader-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 32px;
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.070);
      border: 1px solid rgba(255,255,255,.095);
      color: rgba(247,247,251,.78);
      font-size: .78rem;
      font-weight: 800;
    }

    .reader-chip.accent {
      background: var(--accent-soft);
      color: var(--accent-2);
      border-color: var(--accent-glow);
    }

    .reader-chip.success {
      background: var(--success-soft);
      color: #d8ffe3;
      border-color: rgba(126,237,159,.22);
    }

    .reader-chip.danger {
      background: var(--danger-soft);
      color: #ffd1d8;
      border-color: rgba(255,107,129,.22);
    }

    .reader-note {
      margin-top: 30px;
      padding-top: 26px;
      border-top: 1px solid rgba(255,255,255,.085);
      color: rgba(247,247,251,.82);
      font-size: 1.05rem;
      line-height: 1.68;
      white-space: pre-wrap;
    }

    .reader-link {
      margin-top: 18px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--accent-2);
      font-weight: 800;
      font-size: .92rem;
    }

    .edit-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 20px;
    }

    .field { display: grid; gap: 7px; }
    .field.full { grid-column: 1 / -1; }

    label {
      color: rgba(247,247,251,.62);
      font-size: .76rem;
      font-weight: 850;
      text-transform: lowercase;
    }

    .notes-area {
      margin-top: 24px;
      min-height: 300px;
      border: 0;
      border-radius: 0;
      background: transparent;
      padding: 0;
      resize: none;
      font-size: 1.05rem;
      line-height: 1.68;
    }

    .notes-area:focus {
      border: 0;
      background: transparent;
      box-shadow: none;
    }

    .questions-grid,
    .review-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .type-option {
      position: relative;
    }

    .type-option input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .type-option span {
      min-height: 36px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 11px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.060);
      color: rgba(247,247,251,.70);
      font-size: .80rem;
      font-weight: 800;
      transition: transform .18s ease, background .18s ease, border .18s ease;
    }

    .type-option input:checked + span {
      color: var(--accent-2);
      background: var(--accent-soft);
      border-color: var(--accent-glow);
    }

    .type-option span:hover {
      transform: translateY(-1px);
      background: rgba(255,255,255,.095);
    }

    .editor-actions {
      display: flex;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid rgba(255,255,255,.085);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(0,0,0,.52);
      backdrop-filter: blur(18px);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity .22s ease, visibility .22s ease;
    }

    .modal-backdrop.show {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .modal-backdrop.closing {
      opacity: 0;
      visibility: visible;
      pointer-events: none;
    }

    .modal {
      width: min(640px, 100%);
      max-height: min(760px, 90vh);
      overflow: auto;
      padding: 18px;
      border-radius: 34px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(20,20,28,.88);
      backdrop-filter: blur(24px);
      box-shadow: 0 28px 90px rgba(0,0,0,.45);
      scrollbar-width: none;
      transform: scale(.96) translateY(10px);
      opacity: 0;
      transition: transform .22s ease, opacity .22s ease;
    }

    .modal-backdrop.show .modal {
      transform: scale(1) translateY(0);
      opacity: 1;
    }

    .modal-backdrop.closing .modal {
      transform: scale(.96) translateY(10px);
      opacity: 0;
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: 14px;
    }

    .modal-head h2 {
      margin: 0;
      font-size: 1.32rem;
      letter-spacing: -.045em;
      text-transform: lowercase;
    }

    .modal-head p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: .84rem;
    }

    .calendar-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 9px;
      margin-bottom: 10px;
      border-radius: 22px;
      border: 1px solid rgba(255,255,255,.10);
      background: linear-gradient(135deg, rgba(255,255,255,.085), rgba(255,255,255,.045));
    }

    .calendar-head h3 {
      margin: 0;
      font-size: 1.02rem;
      letter-spacing: -.035em;
      text-transform: lowercase;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      padding: 7px;
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 24px;
      background: rgba(255,255,255,.035);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.05);
    }

    .weekday {
      padding: 6px 3px;
      border-radius: 999px;
      background: rgba(255,255,255,.045);
      color: var(--muted);
      font-size: .66rem;
      text-align: center;
      font-weight: 800;
      text-transform: lowercase;
    }

    .day {
      min-height: 48px;
      padding: 5px;
      border-radius: 13px;
      border: 1px solid rgba(255,255,255,.08);
      background: linear-gradient(180deg, rgba(255,255,255,.070), rgba(255,255,255,.035));
      color: rgba(247,247,251,.78);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform .18s ease, background .18s ease, border .18s ease;
    }

    .day:hover {
      transform: translateY(-1px);
      background: rgba(255,255,255,.095);
      border-color: rgba(255,255,255,.15);
    }

    .day.muted { opacity: .30; }

    .day.today {
      border-color: var(--accent-glow);
      box-shadow: inset 0 0 0 1px var(--accent-soft);
    }

    .day.selected {
      background: radial-gradient(circle at top right, var(--accent-glow), transparent 55%), rgba(255,255,255,.075);
      border-color: var(--accent);
    }

    .day-number {
      font-size: .78rem;
      font-weight: 800;
    }

    .dots {
      display: flex;
      gap: 3px;
      flex-wrap: wrap;
    }

    .dot {
      width: 5px;
      height: 5px;
      border-radius: 999px;
      background: var(--accent);
    }

    .dot.review { background: var(--purple); }
    .dot.questions { background: var(--success); }
    .dot.due { background: var(--danger); }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 18px;
      z-index: 120;
      transform: translateX(-50%) translateY(16px);
      opacity: 0;
      pointer-events: none;
      padding: 11px 14px;
      border-radius: 999px;
      background: rgba(14,14,24,.88);
      border: 1px solid rgba(255,255,255,.12);
      backdrop-filter: blur(18px);
      box-shadow: 0 22px 70px rgba(0,0,0,.42);
      color: rgba(247,247,251,.86);
      font-weight: 800;
      font-size: .82rem;
      transition: .22s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }


    @keyframes softFadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes itemIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 980px) {
      :root { --sidebar: 340px; }
      .reader, .editor-form { padding-inline: 24px; }
    }

    @media (max-width: 760px) {
      html, body { overflow: hidden; }

      .app {
        width: 100vw;
        height: 100vh;
        margin: 0;
        border: 0;
        border-radius: 0;
        display: block;
      }

      .sidebar {
        width: 100%;
        height: 100%;
        border-right: 0;
      }

      .content {
        position: fixed;
        inset: 0;
        z-index: 45;
        transform: translateX(100%);
        transition: transform .24s ease;
        background:
          radial-gradient(circle at 82% 8%, rgba(247,183,49,.09), transparent 28%),
          linear-gradient(180deg, #111119, #050509);
      }

      body.mobile-editor-open .content {
        transform: translateX(0);
      }

      .mobile-back { display: grid; }

      .content-top {
        min-height: 60px;
        padding: 10px 12px;
      }

      .reader, .editor-form {
        padding: 28px 20px 80px;
      }

      .edit-grid,
      .questions-grid,
      .review-grid {
        grid-template-columns: 1fr;
      }

      .edit-title,
      .reader h2 {
        font-size: clamp(2rem, 15vw, 3.1rem);
      }

      .modal-backdrop {
        align-items: flex-end;
        padding: 10px;
      }

      .modal {
        border-radius: 30px 30px 20px 20px;
        max-height: 86vh;
      }

      .day {
        min-height: 42px;
        border-radius: 12px;
      }
    }

    @media (max-width: 430px) {
      .title-wrap h1 { font-size: 1.72rem; }
      .title-wrap p { max-width: 210px; }

      .filter-row { flex-wrap: wrap; }

      .mac-select { flex: 1 1 100%; }

      .type-bar { gap: 6px; }

      .type-option span {
        font-size: .76rem;
        padding-inline: 9px;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <aside class="sidebar">

<div class="toast" id="toast">salvo</div>

  <script>

    function applyDayTheme() {
      document.body.classList.remove("day-0", "day-1", "day-2", "day-3", "day-4", "day-5", "day-6");
      document.body.classList.add(`day-${new Date().getDay()}`);
    }

    const STORAGE_KEY = "tgpedro.logs.notes.reviews.v1";

    const SUPABASE_URL = "https://aelsvgfmijreuhpoccmt.supabase.co";
    const SUPABASE_KEY = "sb_publishable_P_R1Rz3zhO927yFyTaeakQ_fGGyoqMu";
    const MAIN_DATA_ID = "main";
    const LOGS_DATA_ID = "study_logs";
    const MAIN_TABLE = "app_data";
    const MAIN_LOCAL_KEY = "routineSupabaseBackup";

    const supabaseClient = window.supabase
      ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)
      : null;

    const defaultSubjects = [
      { name: "Redação", priority: "alta", note: "" },
      { name: "Matemática", priority: "alta", note: "" },
      { name: "Natureza", priority: "media", note: "" },
      { name: "Humanas", priority: "media", note: "" },
      { name: "Linguagens", priority: "media", note: "" },
      { name: "Escrita criativa", priority: "baixa", note: "" }
    ];

    const $ = selector => document.querySelector(selector);
    const $$ = selector => Array.from(document.querySelectorAll(selector));

    const els = {
      viewTitle: $("#viewTitle"),
      subtitle: $("#subtitle"),
      listWrap: $("#listWrap"),
      editorBody: $("#editorBody"),
      searchInput: $("#searchInput"),
      typeLabel: $("#typeLabel"),
      sortLabel: $("#sortLabel"),
      statusLine: $("#statusLine"),
      statusTitle: $("#statusTitle"),
      editBtn: $("#editBtn"),
      saveBtn: $("#saveBtn"),
      toast: $("#toast"),
      calendarModal: $("#calendarModal"),
      calendarGrid: $("#calendarGrid"),
      monthTitle: $("#monthTitle"),
      calendarSubtitle: $("#calendarSubtitle"),
      deleteModal: $("#deleteModal"),
      syncDot: $("#syncDot")
    };

    let logs = [];
    let subjects = defaultSubjects.slice();
    let selectedId = null;
    let mode = "read";
    let currentView = "logs";
    let typeFilter = "todos";
    let sortMode = "recentes";
    let dateFilter = null;
    let calendarCursor = new Date();
    let pendingDeleteId = null;

    function todayISO() {
      const now = new Date();
      const offset = now.getTimezoneOffset();
      return new Date(now.getTime() - offset * 60000).toISOString().slice(0, 10);
    }

    function parseDate(value) {
      const [year, month, day] = String(value || todayISO()).split("-").map(Number);
      return new Date(year, month - 1, day);
    }

    function isoFromDate(date) {
      const local = new Date(date.getTime() - date.getTimezoneOffset() * 60000);
      return local.toISOString().slice(0, 10);
    }

    function addDaysISO(value, days) {
      const date = parseDate(value || todayISO());
      date.setDate(date.getDate() + Number(days || 0));
      return isoFromDate(date);
    }

    function diffDays(fromISO, toISO) {
      const from = parseDate(fromISO);
      const to = parseDate(toISO);
      from.setHours(0,0,0,0);
      to.setHours(0,0,0,0);
      return Math.round((to - from) / 86400000);
    }

    function formatDate(value, short = false) {
      return parseDate(value).toLocaleDateString("pt-BR", short
        ? { day: "2-digit", month: "2-digit", year: "numeric" }
        : { weekday: "long", day: "numeric", month: "long", year: "numeric" }
      );
    }

    function normalize(value) {
      return String(value || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");
    }

    function escapeHTML(value) {
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function escapeAttr(value) {
      return escapeHTML(value).replaceAll("`", "&#096;");
    }

    function showToast(message) {
      els.toast.textContent = message;
      els.toast.classList.add("show");

      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => els.toast.classList.remove("show"), 1700);
    }

    function openModal(modal) {
      modal.classList.remove("closing");
      modal.classList.add("show");
      lucide.createIcons();
    }

    function closeModal(modal) {
      modal.classList.add("closing");
      modal.classList.remove("show");

      setTimeout(() => modal.classList.remove("closing"), 220);
    }

    function setSyncStatus(status) {
      els.syncDot.classList.remove("online", "offline");
      if (status) els.syncDot.classList.add(status);
    }

    function loadLocal() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        logs = raw ? JSON.parse(raw) : [];
        if (!Array.isArray(logs)) logs = [];
      } catch {
        logs = [];
      }
    }

    function saveLocal() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(logs));
    }

    async function loadLogsFromSupabase(silent = false) {
      if (!supabaseClient) {
        setSyncStatus("offline");
        return false;
      }

      try {
        setSyncStatus("");

        const { data, error } = await supabaseClient
          .from(MAIN_TABLE)
          .select("data, updated_at")
          .eq("id", LOGS_DATA_ID)
          .maybeSingle();

        if (error) throw error;

        const remoteLogs = data?.data?.logs;

        if (Array.isArray(remoteLogs)) {
          const localUpdated = Number(localStorage.getItem(STORAGE_KEY + ".updated") || 0);
          const remoteUpdated = data?.data?.updatedAt ? new Date(data.data.updatedAt).getTime() : 0;

          if (!logs.length || remoteUpdated >= localUpdated) {
            logs = remoteLogs;
            saveLogsToSupabase();
            localStorage.setItem(STORAGE_KEY + ".updated", String(remoteUpdated || Date.now()));
          }

          setSyncStatus("online");
          if (!silent) showToast("logs sincronizados");
          render();
          return true;
        }

        setSyncStatus("online");
        return false;
      } catch (error) {
        console.warn("Erro ao carregar logs:", error);
        setSyncStatus("offline");
        if (!silent) showToast("logs só locais");
        return false;
      }
    }

    async function saveLogsToSupabase(silent = true) {
      saveLocal();
      localStorage.setItem(STORAGE_KEY + ".updated", String(Date.now()));

      if (!supabaseClient) {
        setSyncStatus("offline");
        return false;
      }

      try {
        const payload = {
          id: LOGS_DATA_ID,
          data: {
            logs,
            updatedAt: new Date().toISOString()
          }
        };

        const { error } = await supabaseClient
          .from(MAIN_TABLE)
          .upsert(payload, { onConflict: "id" });

        if (error) throw error;

        setSyncStatus("online");
        if (!silent) showToast("salvo no supabase");
        return true;
      } catch (error) {
        console.warn("Erro ao salvar logs:", error);
        setSyncStatus("offline");
        if (!silent) showToast("salvo só neste navegador");
        return false;
      }
    }

    function loadSubjectsFromLocalBackup() {
      try {
        const raw = localStorage.getItem(MAIN_LOCAL_KEY);
        if (!raw) return false;

        const data = JSON.parse(raw);
        const maybeSubjects = data?.subjects || data?.data?.subjects;

        if (Array.isArray(maybeSubjects) && maybeSubjects.length) {
          subjects = sanitizeSubjects(maybeSubjects);
          return true;
        }
      } catch {}

      return false;
    }

    function sanitizeSubjects(items) {
      const used = new Set();

      return items
        .map(item => typeof item === "string" ? { name: item } : item)
        .filter(item => item && item.name)
        .map(item => ({
          name: String(item.name).trim(),
          priority: item.priority || "media",
          note: item.note || ""
        }))
        .filter(item => {
          const key = normalize(item.name);
          if (!key || used.has(key)) return false;
          used.add(key);
          return true;
        });
    }

    async function syncSubjectsFromSupabase(silent = false) {
      if (!supabaseClient) {
        setSyncStatus("offline");
        if (!silent) showToast("supabase indisponível");
        return;
      }

      try {
        setSyncStatus("");

        const { data, error } = await supabaseClient
          .from(MAIN_TABLE)
          .select("data")
          .eq("id", MAIN_DATA_ID)
          .maybeSingle();

        if (error) throw error;

        const remoteSubjects = data?.data?.subjects;

        if (Array.isArray(remoteSubjects) && remoteSubjects.length) {
          subjects = sanitizeSubjects(remoteSubjects);
          setSyncStatus("online");
          if (!silent) showToast("matérias sincronizadas");
          render();
          return;
        }

        throw new Error("sem matérias no app_data");
      } catch (error) {
        console.warn("Erro ao carregar matérias:", error);
        const hadLocal = loadSubjectsFromLocalBackup();
        setSyncStatus(hadLocal ? "online" : "offline");
        if (!silent) showToast(hadLocal ? "matérias locais carregadas" : "não carregou matérias");
        render();
      }
    }

    function selectedLog() {
      return logs.find(log => log.id === selectedId) || null;
    }

    function setSelected(id, nextMode = "read") {
      selectedId = id;
      mode = nextMode;

      if (window.innerWidth <= 760) {
        document.body.classList.add("mobile-editor-open");
      }

      render();
    }

    function setView(view) {
      currentView = view;
      $("#logsTab").classList.toggle("active", view === "logs");
      $("#reviewTab").classList.toggle("active", view === "reviews");

      if (view === "reviews") {
        typeFilter = "todos";
        setSelectVisual("type", "todos");
      }

      render();
    }

    function hasReview(log) {
      return Boolean(log.reviewDate && !log.reviewDisabled);
    }

    function isReviewDone(log) {
      return Boolean(log.reviewedAt);
    }

    function reviewState(log) {
      if (!hasReview(log)) return "none";
      if (isReviewDone(log)) return "done";

      const d = diffDays(todayISO(), log.reviewDate);
      if (d < 0) return "late";
      if (d === 0) return "today";
      return "soon";
    }

    function reviewLabel(log) {
      const state = reviewState(log);

      if (state === "done") return "revisado";
      if (state === "late") return `atrasado ${Math.abs(diffDays(todayISO(), log.reviewDate))}d`;
      if (state === "today") return "revisar hoje";
      if (state === "soon") return `em ${diffDays(todayISO(), log.reviewDate)}d`;
      return "";
    }

    function filteredLogs() {
      const query = normalize(els.searchInput.value);

      let items = logs.filter(log => {
        const text = normalize(`${log.title} ${log.subject} ${log.type} ${log.notes}`);
        const matchesSearch = !query || text.includes(query);
        const matchesType = typeFilter === "todos" || log.type === typeFilter;
        const matchesDate = !dateFilter || log.date === dateFilter;

        if (currentView === "reviews") {
          return hasReview(log) && matchesSearch && matchesDate;
        }

        return matchesSearch && matchesType && matchesDate;
      });

      items.sort((a, b) => {
        if (currentView === "reviews") {
          if (isReviewDone(a) !== isReviewDone(b)) return isReviewDone(a) ? 1 : -1;
          return String(a.reviewDate || "").localeCompare(String(b.reviewDate || ""));
        }

        if (sortMode === "antigos") return String(a.date).localeCompare(String(b.date));
        if (sortMode === "matéria") return normalize(a.subject).localeCompare(normalize(b.subject));
        return String(b.date).localeCompare(String(a.date));
      });

      return items;
    }

    function groupKey(log) {
      if (currentView === "reviews") {
        const state = reviewState(log);

        if (state === "late") return "atrasadas";
        if (state === "today") return "hoje";
        if (state === "soon") return "próximas";
        if (state === "done") return "revisadas";
      }

      return log.date || todayISO();
    }

    function renderList() {
      const items = filteredLogs();
      const totalText = `${items.length} ${items.length === 1 ? "registro" : "registros"}`;

      els.viewTitle.textContent = currentView === "reviews" ? "revisar" : "logs";
      els.subtitle.textContent = dateFilter ? `${formatDate(dateFilter, true)} • ${totalText}` : totalText;

      if (!items.length) {
        els.listWrap.innerHTML = `
          <div class="empty-card" style="margin:16px 8px;padding:24px;border-radius:24px">
            <div class="empty-icon" style="width:48px;height:48px;border-radius:18px">
              <i data-lucide="${currentView === "reviews" ? "rotate-ccw" : "search-x"}"></i>
            </div>
            <h2 style="font-size:1.35rem">${currentView === "reviews" ? "sem revisões" : "nada aqui"}</h2>
            <p>${currentView === "reviews" ? "adicione prazo de revisão em algum log." : "mude o filtro ou crie um log novo."}</p>
            <button class="primary" onclick="createLog()">novo log</button>
          </div>
        `;
        return;
      }

      const groups = items.reduce((acc, log) => {
        const key = groupKey(log);
        if (!acc[key]) acc[key] = [];
        acc[key].push(log);
        return acc;
      }, {});

      let orderedKeys = Object.keys(groups);

      if (currentView === "reviews") {
        const order = ["atrasadas", "hoje", "próximas", "revisadas"];
        orderedKeys.sort((a, b) => order.indexOf(a) - order.indexOf(b));
      } else {
        orderedKeys.sort((a, b) => {
          if (sortMode === "antigos") return String(a).localeCompare(String(b));
          return String(b).localeCompare(String(a));
        });
      }

      els.listWrap.innerHTML = orderedKeys.map(key => `
        <div class="day-group">${currentView === "reviews" ? key : formatDate(key)}</div>
        ${groups[key].map((log, index) => renderListItem(log, index)).join("")}
      `).join("");
    }

    function renderListItem(log, index) {
      const summary = log.notes || log.link || "sem anotação";
      const active = log.id === selectedId ? "active" : "";
      const q = Number(log.questions || 0);
      const countInfo = q ? ` • ${q} questões` : "";
      const review = reviewState(log);
      const reviewClass = review === "late" || review === "today" ? "review-due" : review === "soon" ? "review-soon" : "";
      const reviewPill = hasReview(log)
        ? `<span class="note-pill ${isReviewDone(log) ? "done" : review === "late" || review === "today" ? "due" : ""}">${reviewLabel(log)}</span>`
        : `<span class="note-pill">${escapeHTML(log.type || "aula")}</span>`;

      return `
        <article class="note-card ${active} ${reviewClass}" onclick="setSelected('${log.id}')" style="animation-delay:${Math.min(index * .025, .16)}s">
          <h3>${escapeHTML(log.title || "sem título")}</h3>
          <p>${escapeHTML(summary)}</p>
          <div class="note-meta">
            ${reviewPill}
            <span>${escapeHTML(log.subject || "sem matéria")}${countInfo}</span>
          </div>
        </article>
      `;
    }

    function renderContent() {
      const log = selectedLog();

      if (!log) {
        renderEmpty();
        return;
      }

      if (mode === "edit") renderEditor(log);
      else renderReader(log);
    }

    function renderEmpty() {
      els.statusLine.textContent = "nenhum log selecionado";
      els.statusTitle.textContent = "crie ou escolha um registro";
      els.editBtn.style.display = "none";
      els.saveBtn.style.display = "none";

      els.editorBody.innerHTML = `
        <section class="empty-state">
          <div class="empty-card">
            <div class="empty-icon">
              <i data-lucide="square-pen"></i>
            </div>
            <h2>novo log</h2>
            <p>registre aulas, revisões, links e listas de questões. também dá para marcar quando revisar.</p>
            <button class="primary" onclick="createLog()">criar log</button>
          </div>
        </section>
      `;
    }

    function renderReader(log) {
      const total = Number(log.questions || 0);
      const correct = Number(log.correct || 0);
      const accuracy = total ? Math.round((correct / total) * 100) : null;
      const hasLink = log.link && /^https?:\/\//i.test(log.link);
      const review = reviewState(log);

      els.statusLine.textContent = formatDate(log.date);
      els.statusTitle.textContent = `${log.subject || "sem matéria"} • ${log.type || "aula"}`;
      els.editBtn.style.display = "inline-flex";
      els.saveBtn.style.display = "none";

      els.editorBody.innerHTML = `
        <article class="reader">
          <div class="reader-date">${formatDate(log.date)}</div>

          <h2>${escapeHTML(log.title || "sem título")}</h2>

          <div class="reader-sub">${escapeHTML(log.subject || "sem matéria")}</div>

          <div class="reader-chips">
            <span class="reader-chip accent"><i data-lucide="tag" width="15" height="15"></i>${escapeHTML(log.type || "aula")}</span>
            ${total ? `<span class="reader-chip"><i data-lucide="list-checks" width="15" height="15"></i>${total} questões</span>` : ""}
            ${total ? `<span class="reader-chip success"><i data-lucide="target" width="15" height="15"></i>${correct} acertos • ${accuracy}%</span>` : ""}
            ${hasReview(log) ? `<span class="reader-chip ${review === "done" ? "success" : review === "late" || review === "today" ? "danger" : "accent"}"><i data-lucide="rotate-ccw" width="15" height="15"></i>${reviewLabel(log)} • ${formatDate(log.reviewDate, true)}</span>` : ""}
          </div>

          ${hasLink ? `<a class="reader-link" href="${escapeAttr(log.link)}" target="_blank" rel="noopener noreferrer"><i data-lucide="external-link" width="17" height="17"></i>abrir aula ou lista</a>` : ""}

          <div class="reader-note">${escapeHTML(log.notes || "sem anotações ainda.")}</div>

          <div class="editor-actions">
            ${hasReview(log) && !isReviewDone(log) ? `<button class="pill success" onclick="markReviewed('${log.id}')">marcar revisado</button>` : ""}
            ${hasReview(log) && !isReviewDone(log) ? `<button class="pill" onclick="postponeReview('${log.id}', 2)">adiar 2 dias</button>` : ""}
            <button class="pill danger" onclick="askDelete('${log.id}')">apagar</button>
            <button class="primary" onclick="setSelected('${log.id}', 'edit')">editar</button>
          </div>
        </article>
      `;
    }

    function subjectOptionsHTML(currentSubject) {
      const all = subjects.length ? subjects : defaultSubjects;

      return all.map(subject => {
        const active = normalize(subject.name) === normalize(currentSubject);
        return `
          <button class="select-option ${active ? "active" : ""}" data-subject="${escapeAttr(subject.name)}" type="button">
            <span class="checkmark">✓</span>
            <span>${escapeHTML(subject.name)}</span>
            <small>${escapeHTML(subject.priority || "")}</small>
          </button>
        `;
      }).join("");
    }

    function renderEditor(log) {
      els.statusLine.textContent = "editando";
      els.statusTitle.textContent = log.title || "novo log";
      els.editBtn.style.display = "none";
      els.saveBtn.style.display = "inline-flex";

      const reviewDays = log.reviewDays ?? 3;
      const reviewDate = log.reviewDate || addDaysISO(log.date || todayISO(), reviewDays);
      const reviewEnabled = hasReview(log) || log.reviewEnabled || false;

      els.editorBody.innerHTML = `
        <form class="editor-form" id="editorForm">
          <div class="edit-meta">
            <span class="chip">${formatDate(log.date || todayISO(), true)}</span>
            <span class="chip">${escapeHTML(log.type || "aula")}</span>
            <span class="chip">${subjects.length} matérias</span>
          </div>

          <input class="edit-title" id="titleInput" placeholder="título" value="${escapeAttr(log.title || "")}" required />

          <div class="type-bar">
            ${["aula", "revisão", "questões", "simulado", "leitura", "outro"].map(type => `
              <label class="type-option">
                <input type="radio" name="typeInput" value="${type}" ${log.type === type ? "checked" : ""} />
                <span>${type}</span>
              </label>
            `).join("")}
          </div>

          <div class="edit-grid">
            <div class="field">
              <label>data</label>
              <input id="dateInput" type="date" value="${escapeAttr(log.date || todayISO())}" required />
            </div>

            <div class="field">
              <label>matéria</label>
              <div class="mac-select" id="subjectSelect">
                <button class="menu-trigger" type="button">
                  <b id="subjectLabel">${escapeHTML(log.subject || "selecionar")}</b>
                  <i data-lucide="chevron-down"></i>
                </button>
                <div class="select-menu" id="subjectMenu">
                  ${subjectOptionsHTML(log.subject)}
                </div>
              </div>
              <input id="subjectInput" value="${escapeAttr(log.subject || "")}" type="hidden" required />
            </div>

            <div class="field full">
              <label>link da aula ou lista</label>
              <input id="linkInput" type="url" value="${escapeAttr(log.link || "")}" placeholder="https://..." />
            </div>

            <div class="field full">
              <label>questões</label>
              <div class="questions-grid">
                <input id="questionsInput" type="number" min="0" value="${Number(log.questions || 0) || ""}" placeholder="total" />
                <input id="correctInput" type="number" min="0" value="${Number(log.correct || 0) || ""}" placeholder="acertos" />
              </div>
            </div>

            <div class="field full">
              <label>revisão</label>
              <div class="review-grid">
                <input id="reviewDaysInput" type="number" min="0" value="${reviewEnabled ? reviewDays : ""}" placeholder="revisar em X dias" />
                <input id="reviewDateInput" type="date" value="${reviewEnabled ? escapeAttr(reviewDate) : ""}" />
              </div>
            </div>
          </div>

          <textarea class="notes-area" id="notesInput" placeholder="escreva suas anotações...">${escapeHTML(log.notes || "")}</textarea>

          <div class="editor-actions">
            <button type="button" class="pill ghost" onclick="setSelected('${log.id}', 'read')">cancelar</button>
            <button type="button" class="pill danger" onclick="askDelete('${log.id}')">apagar</button>
            <button type="submit" class="primary">salvar</button>
          </div>
        </form>
      `;

      $("#editorForm").addEventListener("submit", event => {
        event.preventDefault();
        saveEditor();
      });

      $("#dateInput").addEventListener("change", updateReviewDatePreview);
      $("#reviewDaysInput").addEventListener("input", updateReviewDatePreview);
      $("#reviewDateInput").addEventListener("change", updateReviewDaysPreview);

      bindSubjectSelect();
    }

    function bindSubjectSelect() {
      const root = $("#subjectSelect");
      if (!root) return;

      const trigger = root.querySelector(".menu-trigger");
      const label = $("#subjectLabel");
      const input = $("#subjectInput");

      trigger.addEventListener("click", event => {
        event.stopPropagation();
        $$(".mac-select").forEach(select => {
          if (select !== root) select.classList.remove("open");
        });
        root.classList.toggle("open");
      });

      root.querySelectorAll(".select-option").forEach(option => {
        option.addEventListener("click", event => {
          event.stopPropagation();
          const value = option.dataset.subject || "";
          input.value = value;
          label.textContent = value || "selecionar";

          root.querySelectorAll(".select-option").forEach(item => item.classList.remove("active"));
          option.classList.add("active");
          root.classList.remove("open");
        });
      });
    }

    function updateReviewDatePreview() {
      const days = Number($("#reviewDaysInput")?.value || 0);
      const date = $("#dateInput")?.value || todayISO();
      const reviewDateInput = $("#reviewDateInput");

      if (!reviewDateInput) return;

      if ($("#reviewDaysInput").value === "") {
        reviewDateInput.value = "";
        return;
      }

      reviewDateInput.value = addDaysISO(date, days);
    }

    function updateReviewDaysPreview() {
      const date = $("#dateInput")?.value || todayISO();
      const reviewDate = $("#reviewDateInput")?.value;
      const daysInput = $("#reviewDaysInput");

      if (!daysInput || !reviewDate) return;

      daysInput.value = Math.max(0, diffDays(date, reviewDate));
    }

    function createLog() {
      const newLog = {
        id: crypto.randomUUID(),
        date: todayISO(),
        type: "aula",
        subject: subjects[0]?.name || "",
        title: "",
        link: "",
        questions: 0,
        correct: 0,
        notes: "",
        reviewDays: "",
        reviewDate: "",
        reviewedAt: "",
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString()
      };

      logs.unshift(newLog);
      selectedId = newLog.id;
      mode = "edit";
      currentView = "logs";
      saveLogsToSupabase();

      if (window.innerWidth <= 760) document.body.classList.add("mobile-editor-open");

      render();
      setTimeout(() => $("#titleInput")?.focus(), 80);
    }

    function saveEditor() {
      const log = selectedLog();
      if (!log) return;

      const title = $("#titleInput").value.trim();
      const subject = $("#subjectInput").value.trim();

      if (!title || !subject) {
        showToast("preencha título e selecione uma matéria");
        return;
      }

      const total = Number($("#questionsInput").value || 0);
      const correct = Number($("#correctInput").value || 0);
      const selectedType = document.querySelector('input[name="typeInput"]:checked');

      const reviewDaysRaw = $("#reviewDaysInput").value;
      const reviewDate = $("#reviewDateInput").value;
      const reviewEnabled = reviewDaysRaw !== "" || reviewDate !== "";

      const updated = {
        ...log,
        title,
        subject,
        date: $("#dateInput").value || todayISO(),
        type: selectedType ? selectedType.value : "aula",
        link: $("#linkInput").value.trim(),
        questions: Math.max(0, total),
        correct: Math.max(0, Math.min(correct, total || correct)),
        notes: $("#notesInput").value.trim(),
        reviewDays: reviewEnabled ? Number(reviewDaysRaw || diffDays($("#dateInput").value || todayISO(), reviewDate || todayISO())) : "",
        reviewDate: reviewEnabled ? (reviewDate || addDaysISO($("#dateInput").value || todayISO(), Number(reviewDaysRaw || 0))) : "",
        reviewedAt: reviewEnabled ? (log.reviewedAt || "") : "",
        updatedAt: new Date().toISOString()
      };

      logs = logs.map(item => item.id === log.id ? updated : item);
      selectedId = updated.id;
      mode = "read";

      saveLogsToSupabase();
      render();
      showToast("salvo");
    }

    function markReviewed(id) {
      logs = logs.map(log => log.id === id ? { ...log, reviewedAt: new Date().toISOString(), updatedAt: new Date().toISOString() } : log);
      saveLogsToSupabase();
      render();
      showToast("revisado");
    }

    function postponeReview(id, days) {
      logs = logs.map(log => {
        if (log.id !== id) return log;
        const base = log.reviewDate || todayISO();
        return { ...log, reviewDate: addDaysISO(base, days), reviewedAt: "", updatedAt: new Date().toISOString() };
      });
      saveLogsToSupabase();
      render();
      showToast("revisão adiada");
    }

    function askDelete(id) {
      pendingDeleteId = id;
      openModal(els.deleteModal);
    }

    function deleteLog() {
      if (!pendingDeleteId) return;

      const deletedId = pendingDeleteId;
      logs = logs.filter(log => log.id !== deletedId);

      if (selectedId === deletedId) {
        selectedId = logs[0]?.id || null;
        mode = "read";
      }

      pendingDeleteId = null;

      saveLogsToSupabase();
      closeModal(els.deleteModal);
      render();
      showToast("apagado");
    }

    function setSelectVisual(name, value) {
      const root = document.querySelector(`.mac-select[data-select="${name}"]`);
      if (!root) return;

      root.querySelectorAll(".select-option").forEach(option => {
        option.classList.toggle("active", option.dataset.value === value);
      });

      const label = name === "type" ? els.typeLabel : els.sortLabel;
      label.textContent = value;
    }

    function setSelect(name, value) {
      if (name === "type") typeFilter = value;
      if (name === "sort") sortMode = value;

      setSelectVisual(name, value);

      const root = document.querySelector(`.mac-select[data-select="${name}"]`);
      if (root) root.classList.remove("open");

      render();
    }

    function renderCalendar() {
      const year = calendarCursor.getFullYear();
      const month = calendarCursor.getMonth();
      const start = new Date(year, month, 1);
      const end = new Date(year, month + 1, 0);
      const firstDay = start.getDay();
      const totalDays = end.getDate();
      const today = todayISO();

      els.monthTitle.textContent = calendarCursor.toLocaleDateString("pt-BR", {
        month: "long",
        year: "numeric"
      });

      els.calendarSubtitle.textContent = dateFilter
        ? `filtrando ${formatDate(dateFilter, true)}`
        : "selecione uma data para filtrar";

      const weekdays = ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"];
      const cells = [];

      weekdays.forEach(day => {
        cells.push(`<div class="weekday">${day}</div>`);
      });

      const prevMonthEnd = new Date(year, month, 0).getDate();

      for (let i = firstDay - 1; i >= 0; i--) {
        const day = prevMonthEnd - i;
        cells.push(`<button class="day muted" type="button"><span class="day-number">${day}</span></button>`);
      }

      for (let day = 1; day <= totalDays; day++) {
        const current = new Date(year, month, day);
        const iso = isoFromDate(current);
        const dayLogs = logs.filter(log => log.date === iso);
        const dayReviews = logs.filter(log => log.reviewDate === iso && !isReviewDone(log));
        const hasReview = dayLogs.some(log => log.type === "revisão") || dayReviews.length;
        const hasQuestions = dayLogs.some(log => log.type === "questões" || Number(log.questions || 0) > 0);
        const hasDue = dayReviews.some(log => diffDays(todayISO(), log.reviewDate) <= 0);

        cells.push(`
          <button class="day ${iso === today ? "today" : ""} ${iso === dateFilter ? "selected" : ""}" type="button" onclick="filterByDate('${iso}')">
            <span class="day-number">${day}</span>
            <span class="dots">
              ${dayLogs.length ? `<span class="dot"></span>` : ""}
              ${hasReview ? `<span class="dot review"></span>` : ""}
              ${hasQuestions ? `<span class="dot questions"></span>` : ""}
              ${hasDue ? `<span class="dot due"></span>` : ""}
            </span>
          </button>
        `);
      }

      const used = firstDay + totalDays;
      const nextCells = (7 - (used % 7)) % 7;

      for (let day = 1; day <= nextCells; day++) {
        cells.push(`<button class="day muted" type="button"><span class="day-number">${day}</span></button>`);
      }

      els.calendarGrid.innerHTML = cells.join("");
      lucide.createIcons();
    }

    function filterByDate(iso) {
      dateFilter = iso;
      closeModal(els.calendarModal);
      render();
      showToast("calendário filtrado");
    }

    function clearDateFilter() {
      dateFilter = null;
      renderCalendar();
      render();
      showToast("filtro removido");
    }


    function render() {
      renderList();
      renderContent();
      renderCalendar();

      if (!selectedId && logs[0]) {
        selectedId = logs[0].id;
        renderList();
        renderContent();
      }

      lucide.createIcons();
    }

    function bind() {
      $("#backBtn").addEventListener("click", () => {
        window.location.href = "index.html";
      });

      $("#newBtn").addEventListener("click", createLog);
      $("#editBtn").addEventListener("click", () => {
        if (selectedId) setSelected(selectedId, "edit");
      });
      $("#saveBtn").addEventListener("click", saveEditor);

      $("#syncBtn").addEventListener("click", async () => {
        await syncSubjectsFromSupabase(false);
        await loadLogsFromSupabase(false);
      });

      $("#logsTab").addEventListener("click", () => setView("logs"));
      $("#reviewTab").addEventListener("click", () => setView("reviews"));

      $("#mobileBack").addEventListener("click", () => {
        document.body.classList.remove("mobile-editor-open");
      });

      els.searchInput.addEventListener("input", render);

      $$(".mac-select .menu-trigger").forEach(trigger => {
        trigger.addEventListener("click", event => {
          event.stopPropagation();

          const root = trigger.closest(".mac-select");
          const isOpen = root.classList.contains("open");

          $$(".mac-select").forEach(select => select.classList.remove("open"));

          if (!isOpen) root.classList.add("open");
        });
      });

      $$(".select-option").forEach(option => {
        option.addEventListener("click", event => {
          event.stopPropagation();

          const root = option.closest(".mac-select");
          setSelect(root.dataset.select, option.dataset.value);
        });
      });

      document.addEventListener("click", () => {
        $$(".mac-select").forEach(select => select.classList.remove("open"));
      });

      $("#calendarBtn").addEventListener("click", () => {
        calendarCursor = dateFilter ? parseDate(dateFilter) : new Date();
        renderCalendar();
        openModal(els.calendarModal);
      });

      $("#closeCalendar").addEventListener("click", () => closeModal(els.calendarModal));

      $("#prevMonth").addEventListener("click", () => {
        calendarCursor.setMonth(calendarCursor.getMonth() - 1);
        renderCalendar();
      });

      $("#nextMonth").addEventListener("click", () => {
        calendarCursor.setMonth(calendarCursor.getMonth() + 1);
        renderCalendar();
      });

      $("#todayCalendar").addEventListener("click", () => {
        calendarCursor = new Date();
        filterByDate(todayISO());
      });

      $("#clearDateFilter").addEventListener("click", clearDateFilter);
$("#closeDelete").addEventListener("click", () => closeModal(els.deleteModal));
      $("#cancelDelete").addEventListener("click", () => closeModal(els.deleteModal));
      $("#confirmDelete").addEventListener("click", deleteLog);

      document.addEventListener("keydown", event => {
        if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "s") {
          event.preventDefault();
          if (mode === "edit") saveEditor();
        }

        if (event.key === "Escape") {
          if (els.calendarModal.classList.contains("show")) closeModal(els.calendarModal);
          if (els.deleteModal.classList.contains("show")) closeModal(els.deleteModal);

          if (window.innerWidth <= 760) {
            document.body.classList.remove("mobile-editor-open");
          }
        }
      });
    }

    applyDayTheme();
    loadLocal();
    loadSubjectsFromLocalBackup();
    bind();
    render();

    (async () => {
      await syncSubjectsFromSupabase(true);
      await loadLogsFromSupabase(true);

      if (logs.length) {
        selectedId = selectedId || logs[0].id;
        render();
      }
    })();
  </script>
</body>
</html>
