<script>
/* ===== v5: ícones extras ===== */
Object.assign(ICP,{
  shuffle:'<path d="M16 4h4v4M4 20L20 4M20 16v4h-4M15 15l5 5M4 4l5 5"/>',
  trend:'<path d="M3 17l6-6 4 4 8-8M15 7h6v6"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>'
});
const hl=(t,q)=>{t=String(t||"");q=String(q||"").trim();const i=q?t.toLowerCase().indexOf(q.toLowerCase()):-1;return i<0?esc(t):esc(t.slice(0,i))+"<mark>"+esc(t.slice(i,i+q.length))+"</mark>"+esc(t.slice(i+q.length))};
const TRENDS_FIXO=["Radiohead","Kendrick Lamar","Tame Impala","Frank Ocean","Beyoncé","Daft Punk","Billie Eilish","Tyler, The Creator"];
function saveRecent(q){q=String(q||"").trim();if(q.length<2)return;S.recent=[q,...(S.recent||[]).filter(x=>x.toLowerCase()!==q.toLowerCase())].slice(0,8);salvar()}
function trendList(n){const ch=[...new Set((window.__chart||[]).map(x=>x.artist&&x.artist.name).filter(Boolean))].slice(0,n);return ch.length>=4?ch:TRENDS_FIXO.slice(0,n)}
const queueKeys=()=>Object.entries(S.u).filter(([k,v])=>v.w&&S.meta[k]).map(([k])=>k);

/* ===== v5: seguir / seguir de volta ===== */
SOC.following=function(){return this.s().amigos};
SOC.followers=function(){return this.s().demo?[0,2,4,5].map(i=>({h:DEMOF[i][0],n:DEMOF[i][1]})):[]};
SOC.followsMe=function(h){return this.followers().some(x=>x.h===h)};
SOC.buscar=function(q){
  const nq=norm(q),me=this.me().h.toLowerCase(),s=this.s(),pool=new Map();
  [...s.amigos,...this.followers(),...(s.demo?DEMOF.map(([h,n])=>({h,n})):[])].forEach(a=>{if(a.h!==me&&!pool.has(a.h))pool.set(a.h,a)});
  const out=[...pool.values()].filter(a=>norm(a.h).includes(nq)||norm(a.n).includes(nq));
  const raw=String(q).trim();
  if(raw[0]==="@"){const h=raw.slice(1).toLowerCase();if(/^[a-z0-9._]{3,30}$/.test(h)&&h!==me&&!pool.has(h))out.push({h,n:h})}
  return out.slice(0,20);
};
function fbtnHTML(h,n){
  const on=SOC.isFriend(h),fm=SOC.followsMe(h);
  return `<button class="fbtn${on?" on":""}" data-fo="${esc(h)}" data-fn="${esc(n)}">${on?`<span class="a">${ico("check",13)} Following</span><span class="b">Unfollow</span>`:(fm?"Follow back":"Follow")}</button>`;
}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-fo]");if(!b)return;
  e.preventDefault();
  const h=b.dataset.fo,n=b.dataset.fn||h;
  if(SOC.isFriend(h)){SOC.rmFriend(h);flash("Unfollowed @"+h)}
  else{const s=SOC.s();s.amigos.push({h,n});salvar();flash(SOC.followsMe(h)?"Following back @"+h:"Following @"+h)}
  if(document.querySelector(".pf")){rota();return}
  document.querySelectorAll(`[data-fo="${CSS.escape(h)}"]`).forEach(x=>{x.outerHTML=fbtnHTML(h,n)});
  hdrSync();
});
document.addEventListener("click",e=>{const b=e.target.closest("[data-pp]");if(b)window.__pp=b.dataset.pp},true);
document.addEventListener("click",e=>{const b=e.target.closest("[data-ppt]");if(b){window.__pp=b.dataset.ppt;rota()}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="friendin"){e.preventDefault();const b=document.querySelector('[data-soc="friend-add"]');if(b)b.click()}});

function pfPerson(a){
  const [c1,c2]=cores(a.h),fm=SOC.followsMe(a.h);
  return `<div class="row"><div class="pf-av" style="background:linear-gradient(145deg,${c1},${c2})">${esc(ini(a.n))}</div><div class="grow"><div class="ttl">${esc(a.n)}</div><div class="sm mut">@${esc(a.h)}${fm?`<i class="pp-tag">Follows you</i>`:""}</div></div>${fbtnHTML(a.h,a.n)}</div>`;
}
function pfPessoas(){
  const s=SOC.s(),sub=window.__pp||"seguindo",fo=SOC.following(),fr=SOC.followers();
  const lista=sub==="seguidores"?fr:fo;
  const vazio=sub==="seguidores"?`Nobody follows you yet. Share your profile so people can find you.`:`You're not following anyone yet. Search a username below or in the Search tab (use @username).`;
  const sug=s.demo?DEMOF.map(([h,n])=>({h,n})).filter(a=>!SOC.isFriend(a.h)&&!SOC.followsMe(a.h)):[];
  const back=sub==="seguindo"?[]:fr.filter(a=>!SOC.isFriend(a.h));
  return `<div id="friends"></div>
  <div class="rvtabs" style="margin-top:26px"><button class="${sub==="seguindo"?"on":""}" data-ppt="seguindo">Following · ${fo.length}</button><button class="${sub==="seguidores"?"on":""}" data-ppt="seguidores">Followers · ${fr.length}</button></div>
  ${back.length?`<p class="rvnote" style="margin:0 2px 10px">${back.length} follower${back.length>1?"s":""} you don't follow back yet.</p>`:""}
  <div class="mlist">${lista.length?lista.map(pfPerson).join(""):`<div class="empty" style="border-radius:0;border:0">${vazio}</div>`}
    <div class="pp-find"><input id="friendin" placeholder="Follow by username (e.g. marina.sol)" autocomplete="off" autocapitalize="none" spellcheck="false"><button class="fbtn" data-soc="friend-add">Follow</button></div></div>
  ${sug.length?`<h2>Suggested</h2><div class="mlist">${sug.map(pfPerson).join("")}</div>`:""}
  <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px"><button class="btn ${s.demo?"on":""}" data-soc="demo">${s.demo?"Remove demo people":"Load demo people"}</button></div>
  <p class="rvnote">There is no server yet, so people are stored only in this browser. Demo people are made-up samples: some follow you, so you can try "Follow back". When the database is connected, this will use real accounts.</p>`;
}
function pfOverview(){
  const p=P(),fav=p.fav||[],av=Object.entries(S.u).filter(([k,v])=>v.r&&S.meta[k]);
  const slot=i=>fav[i]?`<a class="fitem" href="#album-${fav[i]}">${capaAlbum(fav[i],(S.meta[fav[i]]||{}).t,null)}<div class="ttl" style="margin-top:8px">${esc((S.meta[fav[i]]||{}).t||"")}</div></a>`:`<div class="fvazio">Empty</div>`;
  const nPag=Math.max(1,Math.ceil(fav.length/4));
  const slots=`<div class="favpages" id="favpages">${Array.from({length:nPag},(_,pg)=>`<div class="favpage">${[0,1,2,3].map(j=>slot(pg*4+j)).join("")}</div>`).join("")}</div>${nPag>1?`<div class="favdots">${Array.from({length:nPag},(_,n)=>`<button class="${n===0?"on":""}" data-favpg="${n}" aria-label="Group ${n+1}"></button>`).join("")}</div>`:""}`;
  const mus=p.musicas.length?`<div class="mlist">${p.musicas.map((m,i)=>`<div class="row"><span class="num">${String(i+1).padStart(2,"0")}</span><div class="ttl grow">${esc(m)}</div></div>`).join("")}</div>`:`<div class="empty">Add favorite songs in Edit.</div>`;
  const recs=av.slice(-5).reverse();
  const rec=recs.length?`<div class="mlist">${recs.map(([k,v])=>{const m=S.meta[k];return `<a class="row" href="#album-${k}">${capaAlbum(k,m.t,46)}<div class="grow"><div class="ttl">${esc(m.t)}</div><div class="sm mut">${esc(m.a)}</div></div>${estrelas(v.r)}</a>`}).join("")}</div>`:`<div class="empty">No ratings yet.</div>`;
  const dist=[.5,1,1.5,2,2.5,3,3.5,4,4.5,5].map(n=>{const c=av.filter(([,v])=>v.r===n).length;return `<div class="hrow"><span>${String(n)}</span><div class="hbar"><i style="width:${av.length?c/av.length*100:0}%"></i></div><span class="mut">${c}</span></div>`}).join("");
  const cont={};av.forEach(([k])=>{const a=S.meta[k].a;cont[a]=(cont[a]||0)+1});
  const topA=Object.entries(cont).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const segA=(S.seguindo||[]);
  return `<div class="pgrid"><div><h3 class="sec">Favorite albums${fav.length>4?` <span style="text-transform:none;letter-spacing:0;font-weight:600">· ${fav.length}</span>`:""}</h3>${slots}<h3 class="sec" style="margin-top:34px">Favorite songs</h3>${mus}</div><aside><h3 class="sec">Recent ratings</h3>${rec}</aside></div>
  ${segA.length?`<h2>Artists you follow</h2><div class="pf-arl">${segA.map(s=>`<a class="pf-a" href="#artist-${s.k}">${capaFoto((S.artists[s.k]||{}).foto||"",s.n,64,true)}<span>${esc(s.n)}</span></a>`).join("")}</div>`:""}
  ${topA.length?`<h2>Top artists</h2><div class="mlist">${topA.map(([n,c],i)=>`<a class="row" href="#artist-${artistKey(n)}"><span class="num">${i+1}</span><div class="grow"><div class="ttl">${esc(n)}</div><div class="sm mut">${c} album${c>1?"s":""} rated</div></div><span class="mut">${ico("chev",16)}</span></a>`).join("")}</div>`:""}
  ${av.length?`<h2>Rating distribution</h2><div class="hist2">${dist}</div>`:""}
  ${backupHTML()}`;
}
function pfRatings(){
  const av=Object.entries(S.u).filter(([,v])=>v.r);
  const faixas=Object.entries(S.tracks||{}).filter(([k])=>S.u[k]&&S.u[k].r).sort((a,b)=>S.u[b[0]].r-S.u[a[0]].r).slice(0,20);
  const alb=av.filter(([k])=>S.meta[k]).length?`<div class="mlist" style="margin-top:24px">${[...av].filter(([k])=>S.meta[k]).reverse().map(([k,v])=>{const m=S.meta[k];return `<a class="row" href="#album-${k}" style="display:block"><div style="display:flex;align-items:center;gap:14px">${capaAlbum(k,m.t,46)}<div class="grow"><div class="ttl">${esc(m.t)}</div><div class="sm mut">${esc(m.a)}</div></div>${estrelas(v.r)}</div>${v.rev?`<div style="font-weight:500;padding:10px 0 0 60px;line-height:1.45">${esc(v.rev)}</div>`:""}</a>`}).join("")}</div>`:`<div class="empty" style="margin-top:24px">You haven't rated any album yet.</div>`;
  return alb+(faixas.length?`<h2>Rated songs</h2><div class="mlist">${faixas.map(([k,v])=>`<div class="row"><div class="grow"><div class="ttl">${esc(v.t)}</div><div class="sm mut">${esc(v.a)}</div></div>${estrelas(S.u[k].r)}</div>`).join("")}</div>`:"");
}
function pfListas(){
  return `<div class="mlist" style="margin-top:24px">${S.listas.map((l,i)=>`<a class="row" href="#lista-${i}"><div class="grow"><div class="ttl">${esc(l.nome)}</div><div class="sm mut">${l.ids.length} album${l.ids.length===1?"":"s"}</div></div><span class="mut">${ico("chev",16)}</span></a>`).join("")||`<div class="empty" style="border-radius:0;border:0">No lists yet.</div>`}<div class="row" style="gap:10px"><input class="field" id="nlNew" placeholder="New list name"><button class="fab" data-lst="nova">Create</button></div></div>`;
}
perfilView=function(){
  const p=P(),fav=p.fav||[];
  const av=Object.entries(S.u).filter(([,v])=>v.r);
  const ouv=Object.values(S.u).filter(v=>v.d).length;
  const media=av.length?av.reduce((s,[,v])=>s+v.r,0)/av.length:0;
  const [c1,c2]=fav[0]?cores(fav[0]):cores(p.handle||"acetato");
  const banner=p.banner?`<div class="pban"><div class="art img" style="background-image:url(${p.banner})"></div></div>`:`<div class="pban"><div class="art" style="background:linear-gradient(135deg,${c1},${c2})"></div></div>`;
  const avatar=p.avatar?`<img src="${p.avatar}" alt="">`:`<div style="width:100%;height:100%;background:linear-gradient(145deg,${c1},${c2});display:grid;place-items:center">${esc(ini(p.nome))}</div>`;
  const cell=(n,l,t,pp)=>`<button class="pf-st" data-aba="${t}"${pp?` data-pp="${pp}"`:""}><strong>${n}</strong><span>${l}</span></button>`;
  const stats=[cell(ouv,"Listened","diario"),cell(av.length,"Ratings","avaliacoes"),cell(media?media.toFixed(1):"—","Average","stats"),cell(S.listas.length,"Lists","listas"),cell(SOC.following().length,"Following","pessoas","seguindo"),cell(SOC.followers().length,"Followers","pessoas","seguidores")].join("");
  const tabs=[["perfil","Overview"],["avaliacoes","Ratings"],["diario","Diary"],["fila","Queue"],["stats","Stats"],["listas","Lists"],["pessoas","People"]];
  let corpo="";
  if(aba==="perfil")corpo=pfOverview();
  else if(aba==="avaliacoes")corpo=pfRatings();
  else if(aba==="diario")corpo=`<div style="margin-top:24px">${diaryList()}</div>`;
  else if(aba==="fila")corpo=filaView();
  else if(aba==="stats")corpo=statsView();
  else if(aba==="pessoas")corpo=pfPessoas();
  else corpo=pfListas();
  return `<div class="pf">${banner}<div class="pf-head"><div class="pav">${avatar}</div>
    <div class="pf-id"><h1>${esc(p.nome)}</h1><div class="phandle">@${esc(p.handle)}${p.local?" · "+esc(p.local):""}</div></div>
    <div class="pf-act"><button class="btn p" data-pact="editar">Edit profile</button><button class="btn" data-pact="cartao">Story</button><button class="shbtn" data-pact="compartilhar" aria-label="Share" title="Share">${ico("share",17)}</button></div></div>
  ${p.bio?`<p class="pbio pf-bio">${esc(p.bio)}</p>`:""}
  <div class="pf-stats">${stats}</div>
  <nav class="ptabs">${tabs.map(([k,l])=>`<button class="${aba===k?"on":""}" data-aba="${k}">${l}</button>`).join("")}</nav>
  <div class="pf-body">${corpo}</div></div>`;
};
</script>

<script>
/* ===== v5: busca profissional (página) ===== */
let SQ_SORT="rel",SQ_TYPE="all";
const SQ_LBL={tudo:"All",albuns:"Albums & EPs",musicas:"Songs",artistas:"Artists",pessoas:"People"};
const SQ_ICON='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>';
searchView=function(){
  return `<h1>Search</h1>
  <div class="sp-bar${busca.q?" has":""}" id="spbar">${SQ_ICON}<input class="sp-in" id="q" type="text" enterkeyhint="search" placeholder="Artists, albums, songs, people" autocomplete="off" autocapitalize="none" spellcheck="false" value="${esc(busca.q)}"><button class="sp-x" data-sqx aria-label="Clear">${ico("x",15)}</button></div>
  <div class="chips sp-chips">${Object.entries(SQ_LBL).map(([k,l])=>`<button class="chip ${busca.f===k?"on":""}" data-fl="${k}">${l}</button>`).join("")}</div>
  <div id="res" style="margin-top:20px"></div>`;
};
function sqData(q,coleta){
  const albuns=unirAlbuns(coleta.alb);albuns.forEach(guardarAlbum);
  const artistas=unirArtistas(coleta.art);artistas.forEach(guardarArtista);
  return {albuns,artistas,musicas:dedupMusicas(coleta.mus).slice(0,30),pessoas:SOC.buscar(q)};
}
function sqSong(m,i,q){
  const k=albumKey(m.album.t,m.album.a);
  return `<div class="row"><a class="sq-l" href="#album-${k}">${capaAlbum(k,m.album.t,46)}<span><span class="ttl">${hl(m.titulo,q)}</span><span class="sq-s">${esc(m.artista)} · ${esc(m.album.t)}</span></span></a><span class="mut sm tdur">${tempo(m.ms)}</span><button class="ib" data-sqplay="${i}" aria-label="Preview, video and links" title="Preview, video and links">${ico("play",12)}</button></div>`;
}
function sqPessoa(p){
  const [c1,c2]=cores(p.h),fm=SOC.followsMe(p.h);
  return `<div class="row"><div class="pf-av" style="background:linear-gradient(145deg,${c1},${c2})">${esc(ini(p.n))}</div><div class="grow"><div class="ttl">${hl(p.n,busca.q)}</div><div class="sm mut">@${esc(p.h)}${fm?`<i class="pp-tag">Follows you</i>`:""}</div></div>${fbtnHTML(p.h,p.n)}</div>`;
}
function sqTop(it,q){
  if(it.tipo==="artista"){const a=it.a;return `<a class="sq-top" href="#artist-${a.key}">${capaFoto(a.foto,a.n,104,true)}<div class="grow"><span class="pill">Artist</span><div class="sq-tt">${hl(a.n,q)}</div><div class="sq-ts">${esc([a.genre,a.fas?fmtFas(a.fas)+" fans":""].filter(Boolean).join(" · ")||"Artist")}</div></div><span class="mut">${ico("chev",20)}</span></a>`}
  if(it.tipo==="album"){const u=it.u;return `<a class="sq-top" href="#album-${u.key}">${capaAlbum(u.key,u.t,104)}<div class="grow"><span class="pill">${tipoLabel(u.tipo)}</span><div class="sq-tt">${hl(u.t,q)}</div><div class="sq-ts">${esc(u.a)}${u.y?" · "+u.y:""}</div></div><span class="mut">${ico("chev",20)}</span></a>`}
  const m=it.m,k=albumKey(m.album.t,m.album.a);
  return `<a class="sq-top" href="#album-${k}">${capaAlbum(k,m.album.t,104)}<div class="grow"><span class="pill">Song</span><div class="sq-tt">${hl(m.titulo,q)}</div><div class="sq-ts">${esc(m.artista)} · ${esc(m.album.t)}</div></div><span class="mut">${ico("chev",20)}</span></a>`;
}
function sqSortAlb(list,q){
  const nq=norm(q),y=u=>u.y||"";
  if(SQ_SORT==="new")return [...list].sort((a,b)=>y(b).localeCompare(y(a)));
  if(SQ_SORT==="old")return [...list].sort((a,b)=>y(a).localeCompare(y(b)));
  if(SQ_SORT==="az")return [...list].sort((a,b)=>String(a.t).localeCompare(String(b.t)));
  return [...list].sort((a,b)=>((norm(b.t)===nq)-(norm(a.t)===nq))||(b.fontes.length-a.fontes.length));
}
montarBusca=function(q,coleta,f){
  window.__sq={q,coleta};
  const D=sqData(q,coleta),nq=norm(q);
  window.__sqSongs=D.musicas;
  window.__sqCnt={albuns:D.albuns.length,musicas:D.musicas.length,artistas:D.artistas.length,pessoas:D.pessoas.length};
  const total=D.albuns.length+D.musicas.length+D.artistas.length+D.pessoas.length;
  if(!total)return `<div class="empty">Nothing found for “${esc(q)}”.<br><span class="sm">Check the spelling or try fewer words.</span></div>`;
  const none=t=>`<div class="empty">No ${t} found for “${esc(q)}”.</div>`;
  if(f==="albuns"){
    const tipos=[["all","All types"],["album","Albums"],["ep","EPs"],["single","Singles"]];
    const l=sqSortAlb(D.albuns.filter(u=>SQ_TYPE==="all"||(u.tipo||"album").toLowerCase()===SQ_TYPE),q);
    return `<div class="tbar">${xsel("sqtype",tipos,SQ_TYPE)}${xsel("sqsort",[["rel","Relevance"],["new","Newest"],["old","Oldest"],["az","Title A–Z"]],SQ_SORT)}<span class="mut sm" style="margin-left:auto">${l.length} result${l.length===1?"":"s"}</span></div>${l.length?`<div class="grid">${l.map(u=>cardAlbum(u)).join("")}</div>`:none("albums")}`;
  }
  if(f==="musicas")return D.musicas.length?`<div class="mlist">${D.musicas.map((m,i)=>sqSong(m,i,q)).join("")}</div>`:none("songs");
  if(f==="artistas")return D.artistas.length?`<div class="grid">${D.artistas.map(cardArtista).join("")}</div>`:none("artists");
  if(f==="pessoas")return D.pessoas.length?`<div class="mlist">${D.pessoas.map(sqPessoa).join("")}</div>`:none("people")+`<p class="rvnote">Tip: type <b>@username</b> to follow someone by their exact username.</p>`;
  const sc=(n,b)=>(norm(n)===nq?60:0)+(norm(n).startsWith(nq)?20:0)+(norm(n).includes(nq)?8:0)+b;
  const cand=[];
  D.albuns.slice(0,6).forEach(u=>cand.push({tipo:"album",u,s:sc(u.t,u.fontes.length*10)}));
  D.artistas.slice(0,6).forEach(a=>cand.push({tipo:"artista",a,s:sc(a.n,a.fontes.length*10+6)}));
  D.musicas.slice(0,6).forEach(m=>cand.push({tipo:"musica",m,s:sc(m.titulo,4)}));
  cand.sort((x,y)=>y.s-x.s);
  const songs=D.musicas.slice(0,4);
  return `<div class="sq-two">${cand[0]?`<div><h3 class="sec">Top result</h3>${sqTop(cand[0],q)}</div>`:"<div></div>"}
    ${songs.length?`<div><h3 class="sec">Songs</h3><div class="mlist">${songs.map((m,i)=>sqSong(m,i,q)).join("")}</div>${D.musicas.length>4?`<button class="lnk" data-sqgo="musicas">See all ${D.musicas.length} songs</button>`:""}</div>`:""}</div>
  ${D.artistas.length?`<div class="sec-h"><h2>Artists</h2><button class="lnk" data-sqgo="artistas">See all</button></div><div class="carrossel" data-keep>${D.artistas.slice(0,12).map(cardArtista).join("")}</div>`:""}
  ${D.albuns.length?`<div class="sec-h"><h2>Albums & EPs</h2><button class="lnk" data-sqgo="albuns">See all</button></div><div class="carrossel" data-keep>${D.albuns.slice(0,14).map(u=>cardAlbum(u)).join("")}</div>`:""}
  ${D.pessoas.length?`<div class="sec-h"><h2>People</h2><button class="lnk" data-sqgo="pessoas">See all</button></div><div class="mlist">${D.pessoas.slice(0,3).map(sqPessoa).join("")}</div>`:""}`;
}
function sqEmpty(){
  const rec=S.recent||[],trend=trendList(10);
  const diario=Object.entries(S.u).filter(([k,v])=>v.d&&S.meta[k]).sort((a,b)=>b[1].d.localeCompare(a[1].d)).slice(0,10);
  return `${rec.length?`<div class="sec-h" style="margin-top:6px"><h2>Recent</h2><button class="lnk" data-sqclr>Clear</button></div><div class="sq-chips">${rec.map((t,i)=>`<span class="sq-c"><button data-sq="${esc(t)}">${ico("clock",14)} ${esc(t)}</button><button class="x" data-sqrm="${i}" aria-label="Remove">${ico("x",12)}</button></span>`).join("")}</div>`:""}
  <div class="sec-h"><h2>Trending searches</h2></div><div class="sq-chips">${trend.map(t=>`<span class="sq-c"><button data-sq="${esc(t)}">${ico("trend",14)} ${esc(t)}</button></span>`).join("")}</div>
  ${diario.length?`<div class="sec-h"><h2>Jump back in</h2></div><div class="carrossel" data-keep>${diario.map(([k])=>cardMeta(k)).join("")}</div>`:""}`;
}
function sqChips(){
  const c=window.__sqCnt;
  document.querySelectorAll("#app .sp-chips [data-fl]").forEach(b=>{const k=b.dataset.fl,n=c&&k!=="tudo"?c[k]:null;b.innerHTML=esc(SQ_LBL[k])+(n!=null?` <span class="cn">${n}</span>`:"")});
}
function sqSyncUI(){
  const bar=document.getElementById("spbar");if(bar)bar.classList.toggle("has",!!(busca.q||"").length);
  document.querySelectorAll("#app [data-fl]").forEach(c=>c.classList.toggle("on",c.dataset.fl===busca.f));
  const hi=document.getElementById("hq3");if(hi&&document.activeElement!==hi)hi.value=busca.q||"";
}
function redesenharBusca(){
  const res=document.getElementById("res");
  if(res&&window.__sq){res.innerHTML=montarBusca(window.__sq.q,window.__sq.coleta,busca.f);sqChips();sqSyncUI()}
}
runSearch=async function(){
  const q=(busca.q||"").trim(),res=document.getElementById("res");
  if(!res)return;
  const qi=document.getElementById("q");if(qi&&qi.value!==busca.q)qi.value=busca.q;
  window.__sq=null;window.__sqCnt=null;sqSyncUI();
  if(q.length<2){buscaTok++;res.innerHTML=sqEmpty();sqChips();if(qi&&matchMedia("(hover:hover)").matches)qi.focus();return}
  const tok=++buscaTok,f=busca.f,e=encodeURIComponent(q),coleta={alb:[],mus:[],art:[]};
  const desenhar=()=>{if(tok===buscaTok){res.innerHTML=montarBusca(q,coleta,busca.f);window.__sq.done=true;sqChips();sqSyncUI()}};
  res.innerHTML=`<div class="load"></div><div class="load"></div><div class="load"></div>`;
  const rapido=await Promise.allSettled([fontes.albunsDZ(e),fontes.albunsIT(e),fontes.musicasDZ(e),fontes.musicasIT(e),fontes.artistasDZ(e),fontes.artistasIT(e),fontes.albunsSP(e),fontes.musicasSP(e),fontes.artistasSP(e)]);
  if(tok!==buscaTok)return;
  const ok=i=>rapido[i].status==="fulfilled"?rapido[i].value:[];
  coleta.alb.push(...ok(0),...ok(1),...ok(6));
  coleta.mus.push(...ok(2),...ok(3),...ok(7));
  coleta.mus.forEach(m=>coleta.alb.push(m.album));
  coleta.art.push(...ok(4),...ok(5),...ok(8));
  desenhar();
  Promise.allSettled([fontes.albunsMB(e),fontes.artistasMB(e)]).then(r=>{
    if(tok!==buscaTok)return;
    if(r[0].status==="fulfilled")coleta.alb.push(...r[0].value);
    if(r[1].status==="fulfilled")coleta.art.push(...r[1].value);
    desenhar();
  });
};
/* filtros instantâneos (sem buscar de novo) */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-fl]");
  if(b&&window.__sq&&window.__sq.done&&window.__sq.q===(busca.q||"").trim()){
    e.stopPropagation();busca.f=b.dataset.fl;redesenharBusca();return;
  }
},true);
document.addEventListener("click",e=>{
  const t=e.target;
  const go=t.closest("[data-sqgo]");if(go){busca.f=go.dataset.sqgo;redesenharBusca();window.scrollTo({top:0,behavior:"smooth"});return}
  if(t.closest("[data-sqx]")){busca.q="";const qi=document.getElementById("q");if(qi){qi.value="";qi.focus()}runSearch();return}
  const sq=t.closest("[data-sq]");if(sq){busca.q=sq.dataset.sq;saveRecent(busca.q);runSearch();return}
  const rm=t.closest("[data-sqrm]");if(rm){(S.recent=S.recent||[]).splice(+rm.dataset.sqrm,1);salvar();const r=document.getElementById("res");if(r)r.innerHTML=sqEmpty();return}
  if(t.closest("[data-sqclr]")){S.recent=[];salvar();const r=document.getElementById("res");if(r)r.innerHTML=sqEmpty();return}
  const pl=t.closest("[data-sqplay]");
  if(pl){const m=(window.__sqSongs||[])[+pl.dataset.sqplay];if(m){const k=albumKey(m.album.t,m.album.a);abrirFaixa(m.titulo,m.artista,m.album.t,coverDe(k)||m.album.cover||"")}return}
  if(t.closest("#res a[href]"))saveRecent(busca.q);
});
document.addEventListener("input",e=>{if(e.target.id==="q")sqSyncUI()});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="q"){clearTimeout(hqT);saveRecent(e.target.value);busca.q=e.target.value;runSearch();e.target.blur()}});
document.addEventListener("xselchange",e=>{
  const id=e.target.id;
  if(id==="sqsort"){SQ_SORT=e.detail;redesenharBusca()}
  if(id==="sqtype"){SQ_TYPE=e.detail;redesenharBusca()}
});
</script>

<script>
/* ===== v5: topo do PC (busca com sugestões, atalhos, menu da conta) ===== */
function goPerfil(t){aba=t;const h="#@"+encodeURIComponent(P().handle);if(location.hash===h)rota();else location.hash=h}
async function surprise(){
  const ch=window.__chart||[];
  if(ch.length){const x=ch[Math.floor(Math.random()*ch.length)],key=albumKey(x.title,(x.artist||{}).name||"");if(S.meta[key]){location.hash="album-"+key;return}}
  const q=queueKeys();if(q.length){location.hash="album-"+q[Math.floor(Math.random()*q.length)];return}
  try{const r=await tendencias(),l=r.lista.filter(temCapa);if(l.length){const u=l[Math.floor(Math.random()*l.length)];guardarAlbum(u);salvar();location.hash="album-"+u.key;return}}catch(e){}
  flash("Couldn't find anything right now");
}
function hdrSync(){
  const p=P(),av=document.getElementById("hbAv");
  if(av){const [c1,c2]=cores(p.handle||"acetato");av.style.background=p.avatar?"#222":`linear-gradient(145deg,${c1},${c2})`;av.innerHTML=p.avatar?`<img src="${esc(p.avatar)}" alt="">`:esc(ini(p.nome))}
  const n=queueKeys().length,b=document.getElementById("hbN");
  if(b){b.hidden=!n;b.textContent=n>99?"99+":n}
  sqSyncUI();
}
(function(){
  const hdr=document.querySelector("header");
  const old=document.querySelector(".hsearch");if(old)old.remove();
  const r=document.createElement("div");r.className="hright";
  r.innerHTML=`<div class="hs" id="hs"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg><input id="hq3" type="text" placeholder="Search" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="Search"><kbd class="hs-k">/</kbd><div class="sg" id="sg" hidden></div></div>
  <button class="hb" id="hbRnd" title="Surprise me" aria-label="Surprise me">${ico("shuffle",18)}</button>
  <button class="hb" id="hbQ" title="Queue" aria-label="Queue">${ico("queue",18)}<i class="hb-n" id="hbN" hidden>0</i></button>
  <div class="hmw"><button class="hav" id="hbAv" aria-label="Account menu"></button><div class="hm" id="hm" hidden></div></div>`;
  hdr.appendChild(r);
  const hs=document.getElementById("hs"),inp=document.getElementById("hq3"),sg=document.getElementById("sg"),hm=document.getElementById("hm");
  const cache=new Map();let tm=null,tok=0;
  const sgClose=()=>{sg.hidden=true;hs.classList.remove("open")};
  const hmClose=()=>{hm.hidden=true};
  const items=()=>[...sg.querySelectorAll(".sg-i")];
  const setAct=i=>{const l=items();l.forEach(x=>x.classList.remove("act"));if(i>=0&&l[i]){l[i].classList.add("act");l[i].scrollIntoView({block:"nearest"})}};
  const curAct=()=>items().findIndex(x=>x.classList.contains("act"));
  const sgEmptyHTML=()=>{
    const rec=(S.recent||[]).slice(0,5),tr=trendList(5);
    return `${rec.length?`<div class="sg-lb">Recent</div>${rec.map(t=>`<button class="sg-i" data-sgq="${esc(t)}">${ico("clock",16)}<span class="sg-t"><b>${esc(t)}</b></span></button>`).join("")}`:""}<div class="sg-lb">Trending</div>${tr.map(t=>`<button class="sg-i" data-sgq="${esc(t)}">${ico("trend",16)}<span class="sg-t"><b>${esc(t)}</b></span></button>`).join("")}`;
  };
  const show=html=>{sg.innerHTML=html;sg.hidden=false;hs.classList.add("open")};
  const render=(q,D)=>{
    const it=(href,img,t,s,k)=>`<a class="sg-i" href="${href}">${img}<span class="sg-t"><b>${hl(t,q)}</b><small>${esc(s)}</small></span><i class="sg-k">${k}</i></a>`;
    let h="";
    if(D.art.length)h+=`<div class="sg-lb">Artists</div>`+D.art.map(a=>it("#artist-"+a.key,capaFoto(a.foto,a.n,38,true),a.n,a.genre||(a.fas?fmtFas(a.fas)+" fans":"Artist"),"Artist")).join("");
    if(D.alb.length)h+=`<div class="sg-lb">Albums</div>`+D.alb.map(u=>it("#album-"+u.key,capaAlbum(u.key,u.t,38),u.t,u.a+(u.y?" · "+u.y:""),tipoLabel(u.tipo))).join("");
    if(D.mus.length)h+=`<div class="sg-lb">Songs</div>`+D.mus.map(m=>{const k=albumKey(m.album.t,m.album.a);return it("#album-"+k,capaAlbum(k,m.album.t,38),m.titulo,m.artista+" · "+m.album.t,"Song")}).join("");
    if(!h)h=`<div class="sg-lb">No quick matches</div>`;
    h+=`<button class="sg-all" data-sgall>${ico("search",15)} See all results for “${esc(q)}”<kbd>↵</kbd></button>`;
    show(h);
  };
  const run=async q=>{
    const key=q.toLowerCase();
    if(cache.has(key)){render(q,cache.get(key));return}
    const my=++tok;show(`<div class="load"></div><div class="load"></div>`);
    const e=encodeURIComponent(q);
    const r=await Promise.allSettled([fontes.artistasDZ(e),fontes.albunsDZ(e),fontes.musicasDZ(e)]);
    if(my!==tok||document.activeElement!==inp&&sg.hidden)return;
    const ok=i=>r[i].status==="fulfilled"?r[i].value:[];
    const D={art:unirArtistas(ok(0)).slice(0,3),alb:unirAlbuns(ok(1)).slice(0,4),mus:dedupMusicas(ok(2)).slice(0,3)};
    D.art.forEach(guardarArtista);D.alb.forEach(guardarAlbum);D.mus.forEach(m=>{const u=unirAlbuns([m.album])[0];if(u)guardarAlbum(u)});
    cache.set(key,D);
    if(inp.value.trim().toLowerCase()===key)render(q,D);
  };
  const go=q=>{
    q=q.trim();saveRecent(q);busca.q=q;sgClose();inp.blur();
    if(location.hash==="#search")runSearch();else location.hash="search";
  };
  inp.addEventListener("focus",()=>{hmClose();const q=inp.value.trim();if(q.length>=2)run(q);else show(sgEmptyHTML())});
  inp.addEventListener("input",()=>{
    clearTimeout(tm);const q=inp.value.trim();
    if(q.length<2){tok++;show(sgEmptyHTML());return}
    tm=setTimeout(()=>run(q),220);
  });
  inp.addEventListener("keydown",e=>{
    if(e.key==="ArrowDown"){e.preventDefault();const l=items();if(l.length)setAct((curAct()+1)%l.length)}
    else if(e.key==="ArrowUp"){e.preventDefault();const l=items();if(l.length)setAct((curAct()-1+l.length)%l.length)}
    else if(e.key==="Enter"){
      e.preventDefault();const a=items()[curAct()];
      if(a){saveRecent(inp.value);if(a.tagName==="A")location.hash=a.getAttribute("href").slice(1);else if(a.dataset.sgq){inp.value=a.dataset.sgq;go(a.dataset.sgq);return}sgClose();inp.blur()}
      else go(inp.value);
    }
    else if(e.key==="Escape"){sgClose();inp.blur()}
  });
  sg.addEventListener("click",e=>{
    const q=e.target.closest("[data-sgq]");
    if(q){inp.value=q.dataset.sgq;go(q.dataset.sgq);return}
    if(e.target.closest("[data-sgall]")){go(inp.value);return}
    if(e.target.closest("a.sg-i")){saveRecent(inp.value);sgClose()}
  });
  document.getElementById("hbRnd").onclick=surprise;
  document.getElementById("hbQ").onclick=()=>goPerfil("fila");
  const menu=()=>{
    const p=P(),fo=SOC.following().length,fr=SOC.followers().length,nq=queueKeys().length,[c1,c2]=cores(p.handle||"acetato");
    const av=p.avatar?`<img src="${esc(p.avatar)}" alt="">`:esc(ini(p.nome));
    const i=(a,ic,l,em)=>`<button class="hm-i" data-hm="${a}">${ico(ic,17)}${l}${em!=null?`<em>${em}</em>`:""}</button>`;
    return `<div class="hm-h"><div class="pf-av" style="background:${p.avatar?"#222":`linear-gradient(145deg,${c1},${c2})`}">${av}</div><div style="min-width:0"><b>${esc(p.nome)}</b><small>@${esc(p.handle)}</small>${isCreator(p.handle)?cbadge():""}</div></div>
    ${i("perfil","user","Profile")}${i("diario","diary","Diary")}${i("fila","queue","Queue",nq)}${i("listas","list","Lists",S.listas.length)}${i("pessoas","people","People",fo+" · "+fr)}<hr>${i("feed","home","Feed")}${i("share","share","Share profile")}${i("story","share","Share to Story")}${i("backup","external","Export backup")}${i("criador","info","Creator badge",p.criador!==false?"On":"Off")}`;
  };
  document.getElementById("hbAv").onclick=e=>{e.stopPropagation();sgClose();if(hm.hidden){hm.innerHTML=menu();hm.hidden=false}else hmClose()};
  hm.addEventListener("click",e=>{
    const b=e.target.closest("[data-hm]");if(!b)return;
    const a=b.dataset.hm;hmClose();
    if(a==="feed")location.hash="feed";
    else if(a==="share")compartilhar();
    else if(a==="story")gerarStoryPerfil();
    else if(a==="backup")exportar();else if(a==="criador"){const pp=P();pp.criador=pp.criador===false;salvar();flash(pp.criador===false?"Creator badge off":"Creator badge on");rota()}
    else{if(a==="pessoas")window.__pp="seguindo";goPerfil(a==="perfil"?"perfil":a)}
  });
  document.addEventListener("click",e=>{
    if(!e.target.closest("#hs"))sgClose();
    if(!e.target.closest(".hmw"))hmClose();
  });
  window.addEventListener("hashchange",()=>{sgClose();hmClose();hdrSync()});
  document.addEventListener("keydown",e=>{
    const tag=(document.activeElement||{}).tagName||"";
    if(e.key==="Escape"){hmClose()}
    const typing=/INPUT|TEXTAREA|SELECT/.test(tag)||(document.activeElement||{}).isContentEditable;
    const busy=document.getElementById("ed")||document.getElementById("stv")||document.getElementById("trk");
    if(busy)return;
    if((e.key==="/"&&!typing)||((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k")){
      e.preventDefault();
      if(hs.offsetParent!==null)inp.focus();
      else{const qi=document.getElementById("q");if(qi)qi.focus();else location.hash="search"}
    }
  });
  let raf=0;
  new MutationObserver(()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(hdrSync)}).observe(document.getElementById("app"),{childList:true});
  hdrSync();
})();
</script>

<script>
/* ===== v6: selo de criador =====
   Para dar o selo a outro perfil, coloque o @username dele em CREATORS. No seu próprio perfil
   o selo fica ligado por padrão (dá para desligar no menu da conta, no canto superior direito). */
const CREATORS=[];
const SEAL='<svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M12 1.8l2.4 1.6 2.9-.2 1.2 2.6 2.6 1.2-.2 2.9L22.5 12l-1.6 2.4.2 2.9-2.6 1.2-1.2 2.6-2.9-.2L12 22.2l-2.4-1.6-2.9.2-1.2-2.6-2.6-1.2.2-2.9L1.5 12l1.6-2.4-.2-2.9 2.6-1.2 1.2-2.6 2.9.2z"/><path d="M8.2 12.3l2.6 2.6 5-5.3" fill="none" stroke="#000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const isCreator=h=>{const p=P();return (h===p.handle&&p.criador!==false)||CREATORS.includes(h)};
const cbadge=lg=>`<span class="cbadge${lg?" lg":""}" title="Creator of Acetato">${SEAL}<b>Creator</b></span>`;
(function(){
  const pv=perfilView;
  perfilView=function(){
    let h=pv();const p=P();
    if(isCreator(p.handle))h=h.replace(`<h1>${esc(p.nome)}</h1>`,`<div class="pf-nm"><h1>${esc(p.nome)}</h1>${cbadge(1)}</div>`);
    return h;
  };
  const wrap=fn=>rv=>{let h=fn(rv);return isCreator(rv.u)?h.replace('</b><span class="mut sm">@','</b>'+cbadge()+'<span class="mut sm">@'):h};
  const a=rvCard,b=feedCard;
  rvCard=wrap(a);feedCard=wrap(b);
})();

/* ===== v6: várias reviews por álbum (publicar, editar, escrever outra) ===== */
SOC.mineAll=function(k){const h=this.me().h;return this.s().rev.filter(x=>x.k===k&&x.u===h)};
SOC.post=function(k,r,txt,d,id){
  const me=this.me(),s=this.s();
  id=id||"m"+hash(k+me.h+Date.now()+Math.random());
  const i=s.rev.findIndex(x=>x.id===id),rv={id,k,u:me.h,n:me.n,av:me.av,r:r||0,txt,d};
  if(i>=0)s.rev[i]=rv;else s.rev.push(rv);
  salvar();
};
/* nota da comunidade conta só a avaliação mais recente de cada pessoa */
socStats=function(k){
  const me=SOC.me().h,by=new Map();
  SOC.list(k).filter(x=>x.r).sort((a,b)=>String(a.d).localeCompare(String(b.d))).forEach(x=>by.set(x.u,x));
  const lista=[...by.values()],rs=lista.map(x=>x.r),myr=(S.u[k]||{}).r;
  if(myr&&!by.has(me))rs.push(myr);
  const n=rs.length,avg=n?rs.reduce((a,b)=>a+b,0)/n:0;
  const hist=[.5,1,1.5,2,2.5,3,3.5,4,4.5,5].map(v=>rs.filter(r=>r===v).length);
  const fr=lista.filter(x=>SOC.isFriend(x.u)),fa=fr.length?fr.reduce((a,b)=>a+b.r,0)/fr.length:0;
  return {n,avg,pct:Math.round(avg/5*100),hist,fn:fr.length,fpct:Math.round(fa/5*100)};
};
function postedCard(rv,m){
  const lk=SOC.liked(rv);
  return `<div class="rvpost"><div class="rvp-h">${capaAlbum(rv.k,m.t,64)}<div class="rvp-i"><div class="rvp-ok">${ico("check",12)} Posted</div><div class="lbx-t">${esc(m.t)}</div><div class="lbx-s">${esc(m.a)}${m.y?" · "+m.y:""}</div></div></div>
  <div class="rvp-m">${rv.r?estrelas(rv.r):""}<span class="mut sm">Listened ${esc(fmtData(rv.d))}</span><span class="mut sm">${ico("heart",13,lk)} ${SOC.likes(rv)}</span></div>
  ${rv.txt?`<p class="rv-t">${esc(rv.txt)}</p>`:`<p class="rv-t mut">Rating only, no written review.</p>`}
  <div class="rvp-b"><button class="btn" data-rv="edit" data-id="${rv.id}">Edit</button><button class="btn" data-story="album">${ico("share",14)} Share to Story</button><button class="btn" data-soc="unpub" data-id="${rv.id}">Remove</button></div></div>`;
}
function revSection(k){
  const m=S.meta[k],x=dd(k);
  const mine=SOC.mineAll(k).sort((a,b)=>String(b.d).localeCompare(String(a.d)));
  const ed=(window.__revEdit&&mine.find(r=>r.id===window.__revEdit))||null;
  const nw=window.__revNew===k,box=!mine.length||!!ed||nw;
  const cards=mine.filter(r=>!ed||r.id!==ed.id);
  let h=`<div id="revsec">`;
  if(cards.length)h+=`<h2>Your review${cards.length>1?"s":""}</h2>`+cards.map(r=>postedCard(r,m)).join("");
  if(mine.length&&!box)h+=`<div style="margin-top:4px"><button class="btn" data-rv="new">${ico("plus",14)} Write another review</button></div>`;
  if(box){
    const val=ed?ed.txt:(nw?"":(x.rev||"")),dt=ed?ed.d:(nw?hoje():(x.d||hoje()));
    h+=`<h2>${ed?"Edit review":(mine.length?"New review":"Review")}</h2>
    <div class="lbx">
      <div class="lbx-h">${capaAlbum(k,m.t,64)}<div style="min-width:0"><div class="lbx-t">${esc(m.t)}</div><div class="lbx-s">${esc(m.a)}${m.y?` · ${m.y}`:""}</div></div></div>
      <label class="lbx-d"><span>Listened on</span><input type="date" id="revd" value="${esc(dt)}" max="${hoje()}"></label>
      <textarea class="field" id="rev" placeholder="Add a review…">${esc(val)}</textarea>
      <div class="lbx-f">
        <div class="lbx-r"><span class="mut sm">Rating</span><div style="display:flex" id="rate2">${rateHTML(x.r)}</div></div>
        <button class="ab ${x.l?"on":""}" data-act="revlike">${likeInner(!!x.l)}</button>
      </div>
      <div class="lbx-b">${ed?"":`<button class="btn" data-act="rev">Save draft</button>`}<button class="fab" data-soc="pub">${ed?"Update review":"Publish review"}</button><button class="btn" data-story="album">${ico("share",14)} Share to Story</button>${mine.length?`<button class="btn" data-rv="cancel">Cancel</button>`:""}</div>
    </div>`;
  }
  return h+`</div>`;
}
(function(){
  const av=albumView;
  albumView=async function(k){
    let html=await av(k);
    if(!S.meta[k])return html;
    const a=html.indexOf("<h2>Review</h2>"),b=html.indexOf("<h2>Reviews</h2>");
    if(a<0||b<a)return html;
    return html.slice(0,a)+revSection(k)+html.slice(b);
  };
})();
const goRev=()=>whenEl("#revsec",el=>el.scrollIntoView({behavior:"smooth",block:"start"}));
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-rv]");if(!b)return;
  const a=b.dataset.rv,k=location.hash.slice(7);
  if(a==="new"){window.__revNew=k;window.__revEdit=null}
  else if(a==="edit"){window.__revEdit=b.dataset.id;window.__revNew=null}
  else{window.__revNew=null;window.__revEdit=null}
  rota();goRev();
});
/* publicar: captura antes do handler antigo (que só sabia de uma review por álbum) */
document.addEventListener("click",e=>{
  const b=e.target.closest('[data-soc="pub"]');if(!b)return;
  e.stopPropagation();
  const k=location.hash.slice(7),d=dd(k);
  const txt=((document.getElementById("rev")||{}).value||"").trim(),dv=(document.getElementById("revd")||{}).value;
  if(!d.r&&!txt){flash("Add a rating or write a review first");return}
  const id=window.__revEdit||null;
  d.rev=txt;d.d=dv||d.d||hoje();
  SOC.post(k,d.r||0,txt,dv||d.d,id);
  window.__revEdit=null;window.__revNew=null;
  flash(id?"Review updated":"Review published");rota();goRev();
},true);
document.addEventListener("click",e=>{
  if(!e.target.closest("[data-gofriends]"))return;
  e.stopPropagation();aba="pessoas";window.__pp="seguindo";
},true);

/* ===== v6: Feed estilo Letterboxd (You · Friends · Following · Incoming) ===== */
const FT_LBL={you:"You",friends:"Friends",following:"Following",incoming:"Incoming"};
function feedItens2(tab){
  const me=SOC.me().h,out=[];
  Object.keys(S.meta).forEach(k=>SOC.list(k).forEach(rv=>{
    const u=rv.u;
    const ok=tab==="you"?u===me:tab==="friends"?(u!==me&&SOC.isFriend(u)&&SOC.followsMe(u)):tab==="following"?(u!==me&&SOC.isFriend(u)):false;
    if(ok)out.push(rv);
  }));
  return out.sort((a,b)=>String(b.d).localeCompare(String(a.d))).slice(0,60);
}
function feedIncoming(){
  const me=SOC.me().h,s=SOC.s(),fol=SOC.followers(),likes=[];
  s.rev.filter(x=>x.u===me).forEach(rv=>{
    const who=(s.likes[rv.id]||[]).filter(h=>h!==me).map(h=>({h,n:(DEMOF.find(d=>d[0]===h)||[h,h])[1]}));
    if(s.demo)fol.forEach(a=>{if(parseInt(hash(rv.id+a.h),36)%3===0&&!who.some(w=>w.h===a.h))who.push(a)});
    who.forEach(a=>likes.push({a,rv}));
  });
  likes.sort((x,y)=>String(y.rv.d).localeCompare(String(x.rv.d)));
  return {fol,likes};
}
function feedBody(tab){
  const me=SOC.me().h;
  if(tab==="incoming"){
    const D=feedIncoming();
    if(!D.fol.length&&!D.likes.length)return `<div class="empty">Nothing yet. New followers and likes on your reviews will show up here.</div>`;
    const av=a=>{const [c1,c2]=cores(a.h);return `<div class="pf-av" style="background:linear-gradient(145deg,${c1},${c2})">${esc(ini(a.n))}</div>`};
    return (D.fol.length?`<h3 class="sec" style="margin:6px 4px 10px">New followers</h3><div class="mlist">${D.fol.map(a=>`<div class="row">${av(a)}<div class="grow"><div class="ttl">${esc(a.n)}</div><div class="sm mut">@${esc(a.h)} started following you</div></div>${fbtnHTML(a.h,a.n)}</div>`).join("")}</div>`:"")
      +(D.likes.length?`<h3 class="sec" style="margin:26px 4px 10px">Likes on your reviews</h3><div class="mlist">${D.likes.map(({a,rv})=>{const m=S.meta[rv.k]||{t:"Album"};return `<a class="row" href="#album-${rv.k}">${av(a)}<div class="grow"><div class="ttl">${esc(a.n)} liked your review</div><div class="sm mut">${esc(m.t)} · ${esc(fmtData(rv.d))}</div></div>${capaAlbum(rv.k,m.t,40)}</a>`}).join("")}</div>`:"");
  }
  const itens=feedItens2(tab);
  if(itens.length)return itens.map(feedCard).join("");
  const msg={
    you:`You haven't posted any reviews yet. Open an album and publish one.`,
    friends:`No friends yet. When you follow someone and they follow you back, they show up here.`,
    following:`You're not following anyone yet. <a href="#@${encodeURIComponent(me)}" data-gofriends>Find people</a> in Search (type @username) or on your Profile.`
  }[tab];
  return `<div class="empty">${msg}</div>`;
}
feedHTML=function(){
  const tab=window.__ft||"friends",inc=feedIncoming(),
    cnt={you:feedItens2("you").length,friends:feedItens2("friends").length,following:feedItens2("following").length,incoming:inc.fol.length+inc.likes.length};
  return `<h1>Feed</h1>
  <div class="rvtabs">${Object.keys(FT_LBL).map(t=>`<button class="${tab===t?"on":""}" data-ft="${t}">${FT_LBL[t]}${cnt[t]?` · ${cnt[t]}`:""}</button>`).join("")}</div>
  <div id="feedlist">${feedBody(tab)}</div>
  <p class="rvnote">Reviews are stored only in this browser for now. When the database is connected, this feed will show real activity from the people you follow.</p>`;
};
renderFeed=function(){const el=document.getElementById("feedlist");if(el)el.innerHTML=feedBody(window.__ft||"friends")};
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-ft]");if(!b)return;
  window.__ft=b.dataset.ft;rota();
});
</script>

<script>
/* ===== v7: ícones extras ===== */
Object.assign(ICP,{
  link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
  left:'<path d="M15 5l-7 7 7 7"/>',up:'<path d="M5 15l7-7 7 7"/>',down:'<path d="M5 9l7 7 7-7"/>',
  lk_ig:'<rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><path d="M17.3 6.8h.01"/>',
  lk_x:'<path d="M4.5 4.5l15 15M19.5 4.5l-15 15"/>',
  lk_tt:'<path d="M14 4v10.5a3.5 3.5 0 1 1-3.5-3.5M14 4c.4 2.4 1.9 3.9 4.5 4.2"/>',
  lk_sp:'<circle cx="12" cy="12" r="9"/><path d="M7 9.5c3.3-1 7-.7 10 1M7.8 13c2.7-.8 5.4-.5 7.8.9M8.6 16.2c2-.5 4-.3 5.7.7"/>',
  lk_yt:'<rect x="3" y="6" width="18" height="12" rx="4"/><path d="M10.5 9.6v4.8l4.1-2.4z"/>',
  lk_lb:'<circle cx="7.3" cy="12" r="3.3"/><circle cx="12" cy="12" r="3.3"/><circle cx="16.7" cy="12" r="3.3"/>',
  lk_fm:'<circle cx="12" cy="12" r="9"/><path d="M8 8v8M8 12c0-1.6 1.2-2.6 2.5-2.6s2.2.9 2.6 2.6.9 2.6 2.4 2.6"/>'
});

/* ===== v7: links (como no Letterboxd) ===== */
const LKS=[
  ["site","Website","globe","yourwebsite.com"],
  ["instagram","Instagram","lk_ig","username"],
  ["x","X / Twitter","lk_x","username"],
  ["tiktok","TikTok","lk_tt","username"],
  ["youtube","YouTube","lk_yt","@channel or link"],
  ["spotify","Spotify","lk_sp","profile link"],
  ["letterboxd","Letterboxd","lk_lb","username"],
  ["lastfm","Last.fm","lk_fm","username"]
];
const LKBASE={instagram:"https://instagram.com/",x:"https://x.com/",tiktok:"https://tiktok.com/@",youtube:"https://youtube.com/@",spotify:"https://open.spotify.com/user/",letterboxd:"https://letterboxd.com/",lastfm:"https://last.fm/user/"};
function linkURL(k,v){
  v=String(v||"").trim();if(!v||/\s/.test(v)&&!/^https?:\/\//i.test(v))return"";
  let u="";
  if(/^https?:\/\//i.test(v))u=v;
  else if(/\./.test(v)&&(k==="site"||/\//.test(v)))u="https://"+v;
  else if(k==="site")return"";
  else u=LKBASE[k]+encodeURIComponent(v.replace(/^@/,""));
  try{const x=new URL(u);return (/^https?:$/.test(x.protocol)&&x.hostname.includes("."))?x.href:""}catch(e){return""}
}
const hostOf=u=>{try{return new URL(u).hostname.replace(/^www\./,"")}catch(e){return u}};
function linksOf(p){
  const L=p.links||{},out=[];
  LKS.forEach(([k,n,ic])=>{const u=linkURL(k,L[k]);if(u)out.push({ic,t:k==="site"?hostOf(u):n,u,web:k==="site"})});
  (p.custom||[]).forEach(c=>{const u=linkURL("site",c.u),l=String(c.l||"").trim();if(u)out.push({ic:"link",t:l||hostOf(u),u,web:true})});
  return out;
}
const linkChips=p=>{const l=linksOf(p);return l.length?`<div class="pf-links">${l.map(x=>`<a class="pf-lk" href="${esc(x.u)}" target="_blank" rel="noopener noreferrer me">${ico(x.ic,15)}<span>${esc(x.t)}</span></a>`).join("")}</div>`:""};
(function(){
  const pv=perfilView;
  perfilView=function(){
    let h=pv();const p=P();
    const old=`<div class="phandle">@${esc(p.handle)}${p.local?" · "+esc(p.local):""}</div>`;
    h=h.replace(old,`<div class="phandle">@${esc(p.handle)}${p.local?" · "+esc(p.local):""}${p.pron?`<span class="pf-pron">${esc(p.pron)}</span>`:""}</div>`);
    return h.replace('<div class="pf-stats">',linkChips(p)+'<div class="pf-stats">');
  };
})();

/* ===== v7: página de configurações ===== */
const STABS=[["profile","Profile","user"],["favorites","Favorites","star"],["links","Links","link"],["account","Account","info"]];
let SETD=null,SETO="",STAB="profile",SFQ="",SFM="albuns",SFRES=[],sfTok=0,sfT=null;
const dirty=()=>!!SETD&&JSON.stringify(SETD)!==SETO;
const stHash=t=>t==="profile"?"settings":"settings-"+t;
function stGo(t){const h=stHash(t);if(location.hash==="#"+h)renderSettings();else location.hash=h}

(function(){
  const _rota=rota;
  window.removeEventListener("hashchange",_rota);
  rota=function(){
    const h=decodeURIComponent(location.hash.slice(1)),on=h==="settings"||h.startsWith("settings-");
    document.body.classList.toggle("settings",on);
    const g=document.querySelector(".gear");if(g)g.classList.toggle("on",on);
    if(!on){SETD=null;return _rota()}
    rotaTok++;resetAmb();
    document.documentElement.style.removeProperty("--bg");
    document.body.classList.remove("perfil");
    document.querySelectorAll(".nav a").forEach(a=>a.classList.remove("on"));
    const t=h.split("-")[1];STAB=STABS.some(x=>x[0]===t)?t:"profile";
    renderSettings(true);
  };
  window.addEventListener("hashchange",()=>rota());
})();

function renderSettings(top){
  const y=window.scrollY;
  $("#app").innerHTML=settingsView();
  window.scrollTo(0,top?0:y);
  stSync();
}
function stInit(){
  if(SETD)return;
  const p=P();
  SETD=JSON.parse(JSON.stringify(p));
  SETD.fav=SETD.fav||[];SETD.musicas=SETD.musicas||[];SETD.links=SETD.links||{};SETD.custom=SETD.custom||[];
  SETD.pron=SETD.pron||"";SETD.bio=SETD.bio||"";SETD.local=SETD.local||"";SETD.criador=p.criador!==false;
  SETO=JSON.stringify(SETD);
}
function settingsView(){
  stInit();
  const body={profile:stProfile,favorites:stFav,links:stLinks,account:stAccount}[STAB]();
  return `<div class="stg"><div class="stg-head"><h1>Settings</h1><span>@${esc(P().handle)}</span></div>
  <div class="stg-grid">
    <nav class="stg-nav">${STABS.map(([k,l,ic])=>`<a class="stg-n ${STAB===k?"on":""}" href="#${stHash(k)}">${ico(ic,18)}${l}</a>`).join("")}</nav>
    <div class="stg-main">${body}</div>
    <aside class="stg-prev"><div class="stg-lbl">Preview</div><div id="stpvin"></div></aside>
  </div>
  <div class="stg-bar" id="stbar"><span>Unsaved changes</span><button class="btn" data-s="discard">Discard</button><button class="fab" data-s="save">Save changes</button></div></div>`;
}
function stProfile(){
  const e=SETD,[c1,c2]=cores(e.handle||"acetato");
  return `<section><h2>Profile</h2><p class="stg-sub">This is how people see you on Acetato.</p>
  <div class="sx-cov"><div class="sx-ban" style="${e.banner?`background-image:url('${esc(e.banner)}')`:`background:linear-gradient(135deg,${c1},${c2})`}"></div>
    <div class="sx-bacts"><label class="sx-chip">${ico("plus",13)} Banner<input id="sbanner" type="file" accept="image/*" hidden></label>${e.banner?`<button class="sx-chip" data-s="banner-rm">Remove</button>`:""}</div>
    <div class="sx-avrow"><div class="sx-av" style="background:${e.avatar?"#222":`linear-gradient(145deg,${c1},${c2})`}">${e.avatar?`<img src="${esc(e.avatar)}" alt="">`:esc(ini(e.nome))}</div>
      <div class="sx-aacts"><label class="sx-chip">Change photo<input id="sfoto" type="file" accept="image/*" hidden></label>${e.avatar?`<button class="sx-chip" data-s="foto-rm">Remove</button>`:""}</div></div></div></section>
  <section><div class="gr">
    <div class="gr-row"><span class="gr-lbl">Name</span><input class="gr-in" data-sf="nome" maxlength="40" value="${esc(e.nome)}" placeholder="Your name"></div>
    <div class="gr-row"><span class="gr-lbl">Username</span><span class="sx-at">@</span><input class="gr-in" data-sf="handle" maxlength="30" value="${esc(e.handle)}" placeholder="username" autocapitalize="none" autocorrect="off" spellcheck="false"></div>
    <div class="gr-row"><span class="gr-lbl">Pronouns</span><input class="gr-in" data-sf="pron" maxlength="24" value="${esc(e.pron)}" placeholder="Optional"></div>
    <div class="gr-row"><span class="gr-lbl">Location</span><input class="gr-in" data-sf="local" maxlength="40" value="${esc(e.local)}" placeholder="City, country"></div>
    <div class="gr-row gr-alto"><span class="gr-lbl">Bio</span><textarea class="gr-in" data-sf="bio" maxlength="240" rows="3" placeholder="Tell people what you listen to">${esc(e.bio)}</textarea></div>
  </div>
  <p class="sx-hint" id="shandle"></p>
  <div class="sx-sug">${["she/her","he/him","they/them"].map(v=>`<button data-s="pron" data-v="${v}">${v}</button>`).join("")}</div>
  <p class="sx-hint" id="sbioc"></p></section>`;
}
function favAlbHTML(){
  const f=SETD.fav;
  if(!f.length)return `<div class="sx-empty">No favorite albums yet. Search below and tap Add.</div>`;
  return `<div class="sx-fgrid">${f.map((k,i)=>{const m=S.meta[k]||{};return `<div class="sx-fi"><span class="sx-n">${i+1}</span>${capaAlbum(k,m.t,null)}<div class="sx-fcap">${esc(m.t||"")}</div><div class="sx-fa"><button class="ib" data-s="fav-l" data-i="${i}" aria-label="Move earlier" ${i?"":"disabled style='opacity:.3'"}>${ico("left",13)}</button><button class="ib" data-s="fav-r" data-i="${i}" aria-label="Move later" ${i<f.length-1?"":"disabled style='opacity:.3'"}>${ico("chev",13)}</button><button class="ib" data-s="fav-x" data-i="${i}" aria-label="Remove">${ico("x",12)}</button></div></div>`}).join("")}</div>`;
}
function favMusHTML(){
  const m=SETD.musicas;
  if(!m.length)return `<div class="sx-empty">No favorite songs yet.</div>`;
  return `<div class="mlist">${m.map((t,i)=>`<div class="row"><span class="num">${String(i+1).padStart(2,"0")}</span><div class="ttl grow">${esc(t)}</div><button class="ib" data-s="mus-u" data-i="${i}" aria-label="Move up" ${i?"":"disabled style='opacity:.3'"}>${ico("up",13)}</button><button class="ib" data-s="mus-d" data-i="${i}" aria-label="Move down" ${i<m.length-1?"":"disabled style='opacity:.3'"}>${ico("down",13)}</button><button class="ib" data-s="mus-x" data-i="${i}" aria-label="Remove">${ico("x",12)}</button></div>`).join("")}</div>`;
}
function stFav(){
  return `<section><h2>Favorites</h2><p class="stg-sub">Pick up to 10 albums and 10 songs. The first four albums are the ones shown first on your profile.</p>
  <div class="gr-tit">Favorite albums <span>${SETD.fav.length}/10</span></div><div id="sffa" style="margin-top:10px">${favAlbHTML()}</div></section>
  <section><div class="gr-tit">Favorite songs <span>${SETD.musicas.length}/10</span></div><div id="sffm" style="margin-top:10px">${favMusHTML()}</div></section>
  <section><div class="gr-tit">Add</div>
  <div class="sp-bar sm" style="margin-top:10px">${SQ_ICON}<input class="sp-in" id="sfq" type="text" placeholder="Search an album or a song" autocomplete="off" autocapitalize="none" spellcheck="false" value="${esc(SFQ)}"></div>
  <div class="chips">${[["albuns","Albums"],["musicas","Songs"]].map(([k,l])=>`<button class="chip ${SFM===k?"on":""}" data-sfm="${k}">${l}</button>`).join("")}</div>
  <div id="sfres" style="margin-top:12px"></div></section>`;
}
function stLinks(){
  const L=SETD.links;
  const row=([k,n,ic,ph])=>{const u=linkURL(k,L[k]),bad=!!(L[k]||"").trim()&&!u;
    return `<div class="gr-row${bad?" bad":""}" data-lrow="${k}"><span class="gr-lbl lk">${ico(ic,17)}${n}</span><input class="gr-in" data-sl="${k}" value="${esc(L[k]||"")}" placeholder="${ph}" autocapitalize="none" autocorrect="off" spellcheck="false" inputmode="${k==="site"?"url":"text"}"><span class="sx-lp" data-lp="${k}">${u?esc(hostOf(u)+new URL(u).pathname.replace(/\/$/,"")):""}</span></div>`};
  return `<section><h2>Links</h2><p class="stg-sub">Show your website and social profiles on your profile. Type a username or paste the full link.</p>
  <div class="gr">${LKS.map(row).join("")}</div></section>
  <section><div class="gr-tit">Custom links <span>${SETD.custom.length}/4</span></div><div style="margin-top:10px">
  ${SETD.custom.length?`<div class="gr">${SETD.custom.map((c,i)=>{const bad=!!(c.u||"").trim()&&!linkURL("site",c.u);return `<div class="gr-row${bad?" bad":""}"><span class="gr-lbl lk">${ico("link",17)}</span><input class="gr-in" style="flex:.8" data-sc="l" data-i="${i}" value="${esc(c.l)}" placeholder="Label (optional)" maxlength="24"><input class="gr-in" data-sc="u" data-i="${i}" value="${esc(c.u)}" placeholder="https://" autocapitalize="none" spellcheck="false" inputmode="url"><button class="ib" data-s="cus-x" data-i="${i}" aria-label="Remove">${ico("x",12)}</button></div>`}).join("")}</div>`:""}
  ${SETD.custom.length<4?`<button class="btn" style="margin-top:12px" data-s="cus-add">${ico("plus",14)} Add link</button>`:""}</div></section>`;
}
function stAccount(){
  const on=!!SETD.criador;
  return `<section><h2>Account</h2><p class="stg-sub">Preferences and your data.</p>
  <div class="gr"><div class="sx-row"><div class="t"><b>Creator badge</b><small>Show the Creator seal next to your name on your profile, reviews and feed.</small></div><button class="sx-sw ${on?"on":""}" data-s="criador" role="switch" aria-checked="${on}" aria-label="Creator badge"></button></div></div></section>
  <section><div class="gr-tit">Your data</div><p class="stg-sub" style="margin-top:8px">Everything is saved only in this browser. Back up from time to time.</p>
  <div class="gr"><div class="sx-btns"><button class="btn" data-bk="exp">Export backup</button><label class="btn" style="cursor:pointer">Import backup<input id="impf" type="file" accept="application/json,.json" hidden></label><button class="btn" data-s="clr-recent">Clear search history</button></div></div></section>`;
}
function stPreview(){
  const e=SETD,[c1,c2]=cores(e.handle||"acetato"),favs=(e.fav||[]).slice(0,4),links=linksOf(e);
  const badge=e.criador||CREATORS.includes(e.handle);
  return `<div class="sx-pv"><div class="sx-pvb" style="${e.banner?`background-image:url('${esc(e.banner)}')`:`background:linear-gradient(135deg,${c1},${c2})`}"></div>
  <div class="sx-pva" style="background:${e.avatar?"#222":`linear-gradient(145deg,${c1},${c2})`}">${e.avatar?`<img src="${esc(e.avatar)}" alt="">`:esc(ini(e.nome))}</div>
  <div class="sx-pvt"><div class="sx-pvn">${esc(e.nome||"Your name")}${badge?cbadge():""}</div>
  <div class="sx-pvh">@${esc(e.handle||"username")}${e.local?" · "+esc(e.local):""}${e.pron?" · "+esc(e.pron):""}</div>
  ${e.bio?`<div class="sx-pvbio">${esc(e.bio)}</div>`:""}
  ${links.length?`<div class="sx-pvl">${links.map(x=>`<span class="pf-lk">${ico(x.ic,13)}<span>${esc(x.t)}</span></span>`).join("")}</div>`:""}</div>
  <div class="sx-pvf">${[0,1,2,3].map(i=>favs[i]?capaAlbum(favs[i],(S.meta[favs[i]]||{}).t,null):"<i></i>").join("")}</div></div>`;
}
function stHandleErr(){
  const h=(SETD.handle||"").trim(),old=P().handle;
  if(!h)return"Choose a username.";
  if(!/^[a-z0-9._]{3,30}$/.test(h))return"Use 3 to 30 letters, numbers, dots or underscores.";
  if(h!==old&&DEMOF.some(d=>d[0]===h))return"That username is taken.";
  return"";
}
function stSync(){
  if(!SETD)return;
  const bar=document.getElementById("stbar");if(bar)bar.classList.toggle("show",dirty());
  const pv=document.getElementById("stpvin");if(pv)pv.innerHTML=stPreview();
  const hh=document.getElementById("shandle");
  if(hh){const er=stHandleErr();hh.className="sx-hint "+(er?"err":"ok");hh.textContent=er||`Your profile: @${SETD.handle}`}
  const bc=document.getElementById("sbioc");if(bc)bc.textContent=`${(SETD.bio||"").length}/240`;
}
function stSave(){
  const e=SETD,old=P();
  const nome=(e.nome||"").trim(),h=(e.handle||"").trim();
  if(!nome){flash("Add a display name");stGo("profile");return}
  const er=stHandleErr();if(er){flash(er);stGo("profile");return}
  const links={};let badLink=false;
  LKS.forEach(([k])=>{const v=(e.links[k]||"").trim();if(v){if(!linkURL(k,v))badLink=true;links[k]=v}});
  const custom=(e.custom||[]).map(c=>({l:(c.l||"").trim(),u:(c.u||"").trim()})).filter(c=>c.l||c.u);
  custom.forEach(c=>{if(!linkURL("site",c.u))badLink=true});
  if(badLink){flash("Check your links: some are not valid");stGo("links");return}
  const next={...old,...e,nome,handle:h,bio:(e.bio||"").trim(),local:(e.local||"").trim(),pron:(e.pron||"").trim(),links,custom,criador:!!e.criador,musicas:(e.musicas||[]).slice(0,10),fav:(e.fav||[]).slice(0,10)};
  const s=SOC.s();
  if(h!==old.handle){
    s.rev.forEach(r=>{if(r.u===old.handle)r.u=h});
    Object.keys(s.likes).forEach(id=>{s.likes[id]=s.likes[id].map(x=>x===old.handle?h:x)});
  }
  s.rev.forEach(r=>{if(r.u===h){r.n=nome;r.av=next.avatar||""}});
  S.perfil=next;salvar();SETD=null;aba="perfil";
  flash("Profile saved");
  location.hash="profile";
}

/* busca para favoritos */
async function runSf(){
  const q=SFQ.trim(),res=document.getElementById("sfres");if(!res)return;
  if(q.length<2){res.innerHTML="";return}
  const e=encodeURIComponent(q),tok=++sfTok;res.innerHTML=`<div class="load"></div>`;
  if(SFM==="albuns"){

  const sub=["@"+esc(p.handle),p.local?esc(p.local):"",p.pron?esc(p.pron):""].filter(Boolean).join(" · ");
  const lk=linksOf(p),webs=lk.filter(x=>x.web).map(x=>`<a href="${esc(x.u)}" target="_blank" rel="noopener noreferrer me" title="${esc(x.u)}">${ico("ptr",14)}<span>${esc(x.t)}</span></a>`).join(""),lks=lk.filter(x=>!x.web).map(x=>`<a class="pw-lk" href="${esc(x.u)}" target="_blank" rel="noopener noreferrer me" aria-label="${esc(x.t)}" title="${esc(x.t)}">${ico(x.ic,19)}</a>`).join("");
  return `<div class="pf">${banner}<div class="pw">
    <div class="pw-av">${avatar}</div>
    <div class="pw-id"><div class="pw-ns"><div class="pw-nm"><h1>${esc(p.nome)}</h1>${isCreator(p.handle)?cbadge(1):""}</div><div class="pw-sub">${sub}</div></div>
      ${p.bio?`<p class="pw-bio">${esc(p.bio)}</p>`:""}
      ${webs?`<div class="pw-web">${webs}</div>`:""}
      <div class="pw-row"><button class="btn p" data-pact="editar">Edit profile</button><button class="pf-ib" data-pact="compartilhar" aria-label="Share profile" title="Share profile">${ico("share",17)}</button><button class="pf-ib" data-pact="cartao" aria-label="Share to Story" title="Share to Story">${ico("story",17)}</button>${lks?`<span class="pw-sep"></span>${lks}`:""}</div></div>
    <div class="pw-st">${stats}</div></div>
  <nav class="ptabs">${tabs.map(([k,l])=>`<button class="${aba===k?"on":""}" data-aba="${k}">${l}</button>`).join("")}</nav>
  <div class="pf-body">${corpo}</div></div>`;
};
</script>

<script>
const faList=()=>(S.seguindo||[]).map(s=>({k:s.k,n:s.n,foto:(S.artists[s.k]||{}).foto||""})).sort((a,b)=>String(a.n).localeCompare(String(b.n)));
function faGrid(q){
  const nq=norm(q||""),l=faList().filter(a=>!nq||norm(a.n).includes(nq));
  if(!l.length)return `<div class="empty" style="margin-top:22px">${(S.seguindo||[]).length?`No artists match “${esc(q)}”.`:"You aren't following any artists yet. Open an artist page and tap Follow."}</div>`;
  return `<div class="fa-grid">${l.map(a=>`<a class="fa-i" href="#artist-${a.k}">${capaFoto(a.foto,a.n,104,true)}<b>${hl(a.n,q)}</b></a>`).join("")}</div>`;
}
function faView(){
  const n=(S.seguindo||[]).length;
  return `<a class="fa-back" href="#profile">${ico("left",15)} ${esc(P().nome)}</a>
  <div class="fa-top"><h1>Artists you follow</h1><span>${n}</span></div>
  <div class="sp-bar sm">${SQ_ICON}<input class="sp-in" id="faq" type="text" placeholder="Search your artists" autocomplete="off" autocapitalize="none" spellcheck="false"></div>
  <div id="falist">${faGrid("")}</div>`;
}
(function(){
  const prev=rota;
  rota=function(){
    const h=decodeURIComponent(location.hash.slice(1));
    if(h!=="following-artists")return prev();
    rotaTok++;resetAmb();
    document.documentElement.style.removeProperty("--bg");
    document.body.classList.remove("perfil","settings");
    document.querySelectorAll(".nav a").forEach(a=>a.classList.toggle("on",a.dataset.tab==="profile"));
    $("#app").innerHTML=faView();window.scrollTo(0,0);
  };
})();
document.addEventListener("input",e=>{if(e.target.id==="faq"){const l=document.getElementById("falist");if(l)l.innerHTML=faGrid(e.target.value)}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&e.target.id==="faq"){e.target.value="";document.getElementById("falist").innerHTML=faGrid("")}});

/* Overview: prateleira curta + "See all" */
(function(){
  const po=pfOverview;
  pfOverview=function(){
    let h=po();const segA=faList();
    h=h.replace(/<h2>Artists you follow<\/h2><div class="pf-arl">[\s\S]*<\/div>\s*$/,"");
    if(!segA.length)return h;
    const rec=[...(S.seguindo||[])].reverse().slice(0,12).map(s=>({k:s.k,n:s.n,foto:(S.artists[s.k]||{}).foto||""}));
    return h+`<div class="pf-sh"><h2>Artists you follow</h2><em>${segA.length}</em><a class="lnk" href="#following-artists">See all</a></div><div class="pf-arl">${rec.map(a=>`<a class="pf-a" href="#artist-${a.k}">${capaFoto(a.foto,a.n,64,true)}<span>${esc(a.n)}</span></a>`).join("")}</div>`;
  };
})();
</script>
