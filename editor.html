<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>editor neon</title>

  <style>
    :root {
      --bg: #07070b;
      --panel: rgba(18, 18, 26, .78);
      --panel-2: rgba(28, 28, 42, .88);
      --text: #f5f7ff;
      --muted: #9a9bad;
      --line: rgba(255, 255, 255, .10);
      --soft: rgba(255, 255, 255, .07);
      --accent: #00e5ff;
      --accent-2: #8b5cf6;
      --accent-3: #22c55e;
      --danger: #ff4d6d;
      --shadow: 0 24px 80px rgba(0, 0, 0, .48);
      --radius: 24px;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", Inter, system-ui, sans-serif;
      --mono: "SF Mono", "Cascadia Code", "Consolas", monospace;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      color: var(--text);
      font-family: var(--font);
      background:
        radial-gradient(circle at 15% 10%, rgba(0, 229, 255, .20), transparent 32%),
        radial-gradient(circle at 84% 4%, rgba(139, 92, 246, .22), transparent 30%),
        radial-gradient(circle at 72% 92%, rgba(34, 197, 94, .13), transparent 34%),
        linear-gradient(135deg, #050509, #090914 42%, #050509);
      overflow: hidden;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
      background: transparent;
      color: inherit;
      cursor: pointer;
      transition: .18s ease;
    }

    button:active {
      transform: scale(.97);
    }

    .app {
      width: min(1760px, calc(100vw - 18px));
      height: calc(100vh - 18px);
      margin: 9px auto;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 9px;
    }

    .glass {
      border: 1px solid var(--line);
      background: var(--panel);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      box-shadow: var(--shadow);
    }

    .topbar {
      min-height: 58px;
      padding: 9px 10px;
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
    }

    .logo {
      width: 38px;
      height: 38px;
      border-radius: 15px;
      display: grid;
      place-items: center;
      color: #001018;
      font-weight: 900;
      letter-spacing: -.08em;
      background:
        linear-gradient(135deg, var(--accent), #ffffff 48%, var(--accent-2));
      box-shadow:
        0 0 28px rgba(0, 229, 255, .42),
        inset 0 1px 1px rgba(255, 255, 255, .75);
      flex: 0 0 auto;
    }

    .brand h1 {
      margin: 0;
      font-size: 15px;
      line-height: 1.05;
      letter-spacing: -.02em;
    }

    .brand p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 7px;
      flex-wrap: wrap;
    }

    .pill {
      height: 36px;
      padding: 0 13px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background:
        linear-gradient(180deg, rgba(255,255,255,.09), rgba(255,255,255,.04));
      color: var(--text);
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      white-space: nowrap;
    }

    .pill:hover {
      border-color: rgba(0, 229, 255, .45);
      background: rgba(0, 229, 255, .10);
      color: var(--accent);
      box-shadow: 0 0 24px rgba(0, 229, 255, .16);
    }

    .pill.primary {
      border-color: transparent;
      color: #001018;
      font-weight: 750;
      background: linear-gradient(135deg, var(--accent), #b9f7ff);
      box-shadow: 0 0 30px rgba(0, 229, 255, .26);
    }

    .pill.primary:hover {
      color: #001018;
      filter: brightness(1.05);
    }

    .workspace {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(320px, .72fr) 8px minmax(560px, 1.28fr);
      gap: 0;
    }

    .workspace.editor-big {
      grid-template-columns: minmax(560px, 1.16fr) 8px minmax(340px, .84fr);
    }

    .workspace.preview-only {
      grid-template-columns: 0 0 1fr;
    }

    .workspace.preview-only .left,
    .workspace.preview-only .resizer {
      display: none;
    }

    .panel {
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .panel.left {
      border-radius: var(--radius) 10px 10px var(--radius);
    }

    .panel.right {
      border-radius: 10px var(--radius) var(--radius) 10px;
    }

    .resizer {
      cursor: col-resize;
      display: grid;
      place-items: center;
    }

    .resizer::before {
      content: "";
      width: 4px;
      height: 58px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .14);
      transition: .18s ease;
    }

    .resizer:hover::before {
      height: 80px;
      background: var(--accent);
      box-shadow: 0 0 20px rgba(0, 229, 255, .55);
    }

    .panel-head {
      min-height: 52px;
      padding: 8px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .tabs {
      display: flex;
      gap: 5px;
      min-width: 0;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .tabs::-webkit-scrollbar {
      display: none;
    }

    .tab {
      height: 34px;
      padding: 0 12px;
      border-radius: 999px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 650;
      flex: 0 0 auto;
    }

    .tab.active {
      color: #001018;
      background: linear-gradient(135deg, var(--accent), #d7fbff);
      box-shadow: 0 0 24px rgba(0, 229, 255, .22);
    }

    .status {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 240px;
    }

    .editor-wrap {
      position: relative;
      min-height: 0;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,.015)),
        rgba(0, 0, 0, .18);
    }

    .editor {
      width: 100%;
      height: 100%;
      resize: none;
      border: 0;
      outline: 0;
      padding: 20px 22px 48px;
      color: #eff6ff;
      background: transparent;
      font-family: var(--mono);
      font-size: 14px;
      line-height: 1.65;
      tab-size: 2;
      caret-color: var(--accent);
      white-space: pre;
      overflow: auto;
      scrollbar-gutter: stable;
    }

    .editor::selection {
      background: rgba(0, 229, 255, .30);
      color: white;
    }

    .editor-tools {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 10px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      pointer-events: none;
    }

    .mini-info {
      height: 26px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(10, 10, 18, .70);
      color: var(--muted);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      display: inline-flex;
      align-items: center;
      font-size: 12px;
    }

    .preview-tools {
      display: flex;
      gap: 7px;
      align-items: center;
    }

    .preview-frame-wrap {
      position: relative;
      min-height: 0;
      background: white;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: white;
    }

    .preview-error {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 14px;
      display: none;
      padding: 12px 14px;
      border-radius: 18px;
      background: rgba(255, 77, 109, .12);
      border: 1px solid rgba(255, 77, 109, .26);
      color: #ff8fa3;
      font: 12px/1.45 var(--mono);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      max-height: 140px;
      overflow: auto;
    }

    .preview-error.show {
      display: block;
    }

    .bottombar {
      min-height: 38px;
      border-radius: 999px;
      padding: 5px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 12px;
    }

    .bottom-group {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 99px;
      background: var(--accent-3);
      box-shadow: 0 0 14px rgba(34, 197, 94, .8);
      flex: 0 0 auto;
    }

    .dot.dirty {
      background: #ffcc00;
      box-shadow: 0 0 14px rgba(255, 204, 0, .8);
    }

    .searchbar {
      position: fixed;
      left: 50%;
      top: 78px;
      transform: translateX(-50%) translateY(-10px);
      width: min(820px, calc(100vw - 30px));
      padding: 8px;
      border-radius: 23px;
      display: none;
      grid-template-columns: minmax(170px, 1fr) minmax(145px, .75fr) auto auto auto;
      gap: 7px;
      z-index: 20;
      opacity: 0;
      transition: .18s ease;
    }

    .searchbar.show {
      display: grid;
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .field {
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 0 13px;
      color: var(--text);
      background: rgba(255, 255, 255, .07);
      outline: 0;
      min-width: 0;
    }

    .field:focus {
      border-color: rgba(0, 229, 255, .52);
      box-shadow: 0 0 0 4px rgba(0, 229, 255, .12);
      background: rgba(255, 255, 255, .10);
    }

    .search-nav {
      height: 38px;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255,255,255,.06);
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .round {
      width: 30px;
      height: 30px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 15px;
    }

    .round:hover {
      background: rgba(0, 229, 255, .12);
      color: var(--accent);
    }

    .search-count {
      height: 38px;
      min-width: 72px;
      padding: 0 10px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      color: var(--muted);
      background: rgba(255,255,255,.06);
      border: 1px solid var(--line);
      font-size: 12px;
      white-space: nowrap;
    }

    .menu {
      position: fixed;
      right: 16px;
      top: 76px;
      width: 230px;
      padding: 8px;
      border-radius: 22px;
      z-index: 21;
      display: none;
    }

    .menu.show {
      display: block;
    }

    .menu button {
      width: 100%;
      height: 39px;
      border-radius: 14px;
      padding: 0 10px;
      text-align: left;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--text);
    }

    .menu button:hover {
      background: rgba(0, 229, 255, .10);
      color: var(--accent);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%) translateY(18px);
      opacity: 0;
      pointer-events: none;
      padding: 11px 15px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--panel);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      box-shadow: var(--shadow);
      color: var(--text);
      font-size: 13px;
      transition: .2s ease;
      z-index: 30;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .hidden {
      display: none;
    }

    @media (max-width: 960px) {
      body {
        overflow: auto;
      }

      .app {
        height: auto;
        min-height: calc(100vh - 18px);
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .actions {
        width: 100%;
        justify-content: flex-start;
        overflow-x: auto;
        flex-wrap: nowrap;
        scrollbar-width: none;
      }

      .actions::-webkit-scrollbar {
        display: none;
      }

      .workspace,
      .workspace.editor-big,
      .workspace.preview-only {
        min-height: 1040px;
        grid-template-columns: 1fr;
        grid-template-rows: 460px 1fr;
        gap: 9px;
      }

      .workspace.preview-only {
        grid-template-rows: 1fr;
      }

      .resizer {
        display: none;
      }

      .panel.left,
      .panel.right {
        border-radius: var(--radius);
      }

      .searchbar {
        top: 92px;
        grid-template-columns: 1fr;
      }

      .search-nav,
      .search-count,
      .searchbar .pill {
        width: 100%;
      }

      .bottombar {
        border-radius: 20px;
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <header class="topbar glass">
      <div class="brand">
        <div class="logo">&lt;/&gt;</div>
        <div>
          <h1>editor neon</h1>
          <p>html, css, js e preview local</p>
        </div>
      </div>

      <div class="actions">
        <button class="pill" id="openSearch">buscar</button>
        <button class="pill" id="importBtn">importar</button>
        <button class="pill" id="saveBtn">salvar</button>
        <button class="pill primary" id="runBtn">visualizar</button>
        <button class="pill" id="menuBtn">mais</button>
      </div>
    </header>

    <main class="workspace" id="workspace">
      <section class="panel left glass">
        <div class="panel-head">
          <div class="tabs">
            <button class="tab active" data-tab="html">html</button>
            <button class="tab" data-tab="css">css</button>
            <button class="tab" data-tab="js">js</button>
            <button class="tab" data-tab="final">final</button>
          </div>
          <div class="status" id="tabStatus">html</div>
        </div>

        <div class="editor-wrap">
          <textarea class="editor" id="editor" spellcheck="false"></textarea>
          <div class="editor-tools">
            <span class="mini-info" id="cursorInfo">linha 1, col 1</span>
            <span class="mini-info" id="sizeInfo">0 caracteres</span>
          </div>
        </div>
      </section>

      <div class="resizer" id="resizer"></div>

      <section class="panel right glass">
        <div class="panel-head">
          <div class="status" id="previewStatus">preview pronto</div>
          <div class="preview-tools">
            <button class="pill" id="openPreviewBtn">abrir</button>
            <button class="pill" id="refreshBtn">atualizar</button>
          </div>
        </div>

        <div class="preview-frame-wrap">
          <iframe id="preview" sandbox="allow-scripts allow-forms allow-modals allow-popups allow-downloads"></iframe>
          <div class="preview-error" id="previewError"></div>
        </div>
      </section>
    </main>

    <footer class="bottombar glass">
      <div class="bottom-group">
        <span class="dot" id="saveDot"></span>
        <span id="saveState">salvo localmente</span>
      </div>
      <div class="bottom-group">
        <span>ctrl+s salvar · ctrl+f buscar · ctrl+enter visualizar</span>
      </div>
    </footer>
  </div>

  <div class="searchbar glass" id="searchbar">
    <input class="field" id="findInput" placeholder="buscar no código atual" />
    <input class="field" id="replaceInput" placeholder="substituir por" />
    <div class="search-nav">
      <button class="round" id="prevMatch">↑</button>
      <button class="round" id="nextMatch">↓</button>
    </div>
    <div class="search-count" id="searchCount">0/0</div>
    <button class="pill primary" id="replaceBtn">trocar tudo</button>
  </div>

  <div class="menu glass" id="menu">
    <button id="exportBtn"><span>exportar html</span><span>⌘</span></button>
    <button id="layoutBtn"><span>layout</span><span id="layoutLabel">preview maior</span></button>
    <button id="previewOnlyBtn"><span>modo preview</span><span>⌁</span></button>
    <button id="copyBtn"><span>copiar final</span><span>⧉</span></button>
    <button id="resetBtn"><span>limpar projeto</span><span>↺</span></button>
  </div>

  <input class="hidden" type="file" id="fileInput" accept=".html,.htm,.css,.js,.txt" />
  <div class="toast" id="toast">ok</div>

  <script>
    const $ = (q) => document.querySelector(q);
    const $$ = (q) => [...document.querySelectorAll(q)];

    const STORAGE = "editor-neon-final-v1";

    const starter = {
      name: "meu-site",
      html:
`<main class="card">
  <p class="eyebrow">teste local</p>
  <h1>seu site aqui</h1>
  <p>edite html, css e js. o preview atualiza sozinho.</p>
  <button onclick="sayHi()">clicar</button>
</main>`,
      css:
`body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  background: #09090f;
  color: #f5f7ff;
}

.card {
  width: min(440px, calc(100vw - 40px));
  padding: 34px;
  border-radius: 30px;
  background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.14);
  box-shadow: 0 24px 80px rgba(0,0,0,.35);
  backdrop-filter: blur(22px);
}

.eyebrow {
  color: #00e5ff;
  font-size: 13px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: .08em;
}

h1 {
  margin: 0;
  font-size: 42px;
  letter-spacing: -.05em;
}

p {
  color: #b8bad0;
  line-height: 1.5;
}

button {
  height: 44px;
  padding: 0 18px;
  border: 0;
  border-radius: 999px;
  background: linear-gradient(135deg, #00e5ff, #8b5cf6);
  color: white;
  font-weight: 750;
  cursor: pointer;
  box-shadow: 0 0 28px rgba(0,229,255,.28);
}`,
      js:
`function sayHi() {
  alert("funcionando");
}`
    };

    let state = loadState();
    let currentTab = "html";
    let dirty = false;
    let matches = [];
    let currentMatch = -1;
    let previewBlobUrl = "";

    const editor = $("#editor");
    const preview = $("#preview");
    const workspace = $("#workspace");

    function defaultState() {
      return {
        ...starter,
        layout: "preview",
        previewOnly: false,
        finalDraft: "",
        lastSaved: Date.now()
      };
    }

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE));
        if (saved && typeof saved === "object") {
          return { ...defaultState(), ...saved };
        }
      } catch {}
      return defaultState();
    }

    function saveState(silent = false) {
      state.lastSaved = Date.now();
      localStorage.setItem(STORAGE, JSON.stringify(state));
      dirty = false;
      updateSavedUI();
      if (!silent) toast("salvo no navegador");
    }

    function setDirty(value = true) {
      dirty = value;
      updateSavedUI();
    }

    function updateSavedUI() {
      $("#saveDot").classList.toggle("dirty", dirty);
      $("#saveState").textContent = dirty ? "alterações não salvas" : "salvo localmente";
    }

    function toast(text) {
      const el = $("#toast");
      el.textContent = text;
      el.classList.add("show");
      clearTimeout(toast.t);
      toast.t = setTimeout(() => el.classList.remove("show"), 1600);
    }

    function safeTitle(text) {
      return String(text || "site exportado").replace(/[<>&"]/g, "");
    }

    function templateFinal() {
      const title = safeTitle(state.name || "site exportado");

      return `<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>${title}</title>
  <style>
${state.css || ""}
  </style>
</head>
<body>
${state.html || ""}

  <script>
${state.js || ""}
  <\/script>
</body>
</html>`;
    }

    function finalCode() {
      return state.finalDraft || templateFinal();
    }

    function rebuildFinalDraft() {
      state.finalDraft = templateFinal();
    }

    function parseHTML(text) {
      const source = String(text || "");

      const styles = [...source.matchAll(/<style[^>]*>([\s\S]*?)<\/style>/gi)]
        .map(m => m[1].trim())
        .join("\\n\\n");

      const scripts = [...source.matchAll(/<script(?![^>]*src=)[^>]*>([\s\S]*?)<\/script>/gi)]
        .map(m => m[1].trim())
        .join("\\n\\n");

      let bodyText = source
        .replace(/<!DOCTYPE[\s\S]*?>/i, "")
        .replace(/<html[^>]*>/gi, "")
        .replace(/<\/html>/gi, "")
        .replace(/<head[\s\S]*?<\/head>/gi, "")
        .replace(/<script[^>]*>[\s\S]*?<\/script>/gi, "")
        .replace(/<style[^>]*>[\s\S]*?<\/style>/gi, "");

      const body = bodyText.match(/<body[^>]*>([\s\S]*?)<\/body>/i);
      if (body) bodyText = body[1];

      const title = source.match(/<title[^>]*>([\s\S]*?)<\/title>/i);

      return {
        html: bodyText.trim(),
        css: styles,
        js: scripts,
        title: title ? title[1].trim() : ""
      };
    }

    function applyLayout() {
      workspace.classList.toggle("editor-big", state.layout === "editor");
      workspace.classList.toggle("preview-only", Boolean(state.previewOnly));
      $("#layoutLabel").textContent = state.layout === "editor" ? "editor maior" : "preview maior";
    }

    function syncEditor() {
      editor.value = currentTab === "final" ? finalCode() : (state[currentTab] || "");
      $("#tabStatus").textContent = currentTab;
      updateEditorMeta();
      updateSearch(true, false);
    }

    function switchTab(tab) {
      if (currentTab !== "final" && tab === "final") rebuildFinalDraft();

      currentTab = tab;

      $$(".tab").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.tab === tab);
      });

      syncEditor();
      editor.focus();
    }

    function applyEditorValue(value) {
      if (currentTab === "final") {
        state.finalDraft = value;

        const parsed = parseHTML(value);
        state.html = parsed.html;
        state.css = parsed.css;
        state.js = parsed.js;

        if (parsed.title) state.name = parsed.title;
      } else {
        state[currentTab] = value;
        rebuildFinalDraft();
      }
    }

    function handleEditorInput() {
      applyEditorValue(editor.value);
      setDirty(true);
      updateEditorMeta();
      updateSearch(false, false);

      clearTimeout(handleEditorInput.previewT);
      handleEditorInput.previewT = setTimeout(updatePreview, 360);

      clearTimeout(handleEditorInput.saveT);
      handleEditorInput.saveT = setTimeout(() => saveState(true), 1000);
    }

    function updateEditorMeta() {
      const pos = editor.selectionStart || 0;
      const before = editor.value.slice(0, pos);
      const line = before.split("\\n").length;
      const col = before.length - before.lastIndexOf("\\n");

      $("#cursorInfo").textContent = `linha ${line}, col ${col}`;
      $("#sizeInfo").textContent = `${editor.value.length.toLocaleString("pt-BR")} caracteres`;
    }

    function updatePreview() {
      $("#previewError").classList.remove("show");
      $("#previewError").textContent = "";

      const errorHook = `
<script>
window.addEventListener("error", function(e) {
  parent.postMessage({
    type: "preview-error",
    message: e.message,
    line: e.lineno,
    col: e.colno
  }, "*");
});

window.addEventListener("unhandledrejection", function(e) {
  parent.postMessage({
    type: "preview-error",
    message: String(e.reason || "erro em promise")
  }, "*");
});
<\/script>`;

      const code = finalCode().includes("</body>")
        ? finalCode().replace("</body>", errorHook + "\\n</body>")
        : finalCode() + errorHook;

      preview.srcdoc = code;

      $("#previewStatus").textContent = "preview atualizado";
      clearTimeout(updatePreview.t);
      updatePreview.t = setTimeout(() => {
        $("#previewStatus").textContent = "preview pronto";
      }, 1100);
    }

    window.addEventListener("message", (event) => {
      if (!event.data || event.data.type !== "preview-error") return;

      const msg = event.data.line
        ? `${event.data.message} — linha ${event.data.line}:${event.data.col || 0}`
        : event.data.message;

      $("#previewError").textContent = msg;
      $("#previewError").classList.add("show");
      $("#previewStatus").textContent = "erro no preview";
    });

    function openSearch() {
      $("#searchbar").classList.add("show");
      $("#findInput").focus();
      $("#findInput").select();
      updateSearch(true, false);
    }

    function closeSearch() {
      $("#searchbar").classList.remove("show");
      $("#findInput").value = "";
      $("#replaceInput").value = "";
      currentMatch = -1;
      updateSearch(true, false);
      editor.focus();
    }

    function getTerm() {
      return $("#findInput").value || "";
    }

    function collectMatches(text, term) {
      if (!term) return [];

      const found = [];
      const lower = text.toLowerCase();
      const needle = term.toLowerCase();

      let index = 0;

      while (true) {
        index = lower.indexOf(needle, index);
        if (index === -1) break;

        found.push({
          start: index,
          end: index + term.length
        });

        index += Math.max(term.length, 1);
      }

      return found;
    }

    function updateSearch(reset = false, select = true) {
      const term = getTerm();
      matches = collectMatches(editor.value, term);

      if (!matches.length) currentMatch = -1;
      else if (reset || currentMatch < 0) currentMatch = 0;
      else if (currentMatch >= matches.length) currentMatch = matches.length - 1;

      $("#searchCount").textContent = matches.length
        ? `${currentMatch + 1}/${matches.length}`
        : "0/0";

      $("#prevMatch").disabled = !matches.length;
      $("#nextMatch").disabled = !matches.length;

      if (select && matches.length) selectMatch(currentMatch, false);
    }

    function selectMatch(index, center = true) {
      if (!matches[index]) return;

      const match = matches[index];

      editor.focus({ preventScroll: true });
      editor.setSelectionRange(match.start, match.end);

      if (center) {
        const before = editor.value.slice(0, match.start);
        const line = before.split("\\n").length - 1;
        const lineHeight = parseFloat(getComputedStyle(editor).lineHeight) || 23;

        editor.scrollTop = Math.max(0, line * lineHeight - editor.clientHeight * .42);
      }

      $("#searchCount").textContent = `${index + 1}/${matches.length}`;
      updateEditorMeta();
    }

    function goToMatch(step) {
      updateSearch(false, false);
      if (!matches.length) return;

      currentMatch = (currentMatch + step + matches.length) % matches.length;
      selectMatch(currentMatch);
    }

    function replaceAllMatches() {
      const find = getTerm();
      if (!find) return;

      const before = editor.value;
      const escaped = find.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      const next = before.replace(new RegExp(escaped, "gi"), $("#replaceInput").value);

      if (before === next) {
        toast("nada encontrado");
        return;
      }

      editor.value = next;
      applyEditorValue(next);
      setDirty(true);
      updateEditorMeta();
      updatePreview();
      updateSearch(true, false);
      saveState(true);
      toast("substituído");
    }

    function downloadFile() {
      const blob = new Blob([finalCode()], { type: "text/html;charset=utf-8" });
      const a = document.createElement("a");

      const safeName = (state.name || "meu-site")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\\u0300-\\u036f]/g, "")
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-|-$/g, "") || "meu-site";

      a.href = URL.createObjectURL(blob);
      a.download = `${safeName}.html`;
      a.click();

      URL.revokeObjectURL(a.href);
      toast("arquivo exportado");
    }

    async function copyFinal() {
      try {
        await navigator.clipboard.writeText(finalCode());
        toast("código final copiado");
      } catch {
        toast("não deu para copiar");
      }
    }

    function openPreview() {
      if (previewBlobUrl) URL.revokeObjectURL(previewBlobUrl);

      previewBlobUrl = URL.createObjectURL(
        new Blob([finalCode()], { type: "text/html" })
      );

      window.open(previewBlobUrl, "_blank");
    }

    async function importFile(file) {
      const text = await file.text();
      const name = file.name.toLowerCase();

      if (name.endsWith(".css")) {
        state.css = text;
        rebuildFinalDraft();
        switchTab("css");
      } else if (name.endsWith(".js")) {
        state.js = text;
        rebuildFinalDraft();
        switchTab("js");
      } else {
        const parsed = parseHTML(text);

        state.html = parsed.html || text;
        state.css = parsed.css || state.css || "";
        state.js = parsed.js || state.js || "";
        state.finalDraft = text;

        if (parsed.title) state.name = parsed.title;

        switchTab("html");
      }

      setDirty(true);
      syncEditor();
      updatePreview();
      saveState(true);
      toast("arquivo importado");
    }

    function resetProject() {
      state = defaultState();
      currentTab = "html";

      $$(".tab").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.tab === "html");
      });

      applyLayout();
      syncEditor();
      updatePreview();
      saveState(true);
      toast("projeto limpo");
    }

    editor.addEventListener("input", handleEditorInput);
    editor.addEventListener("keyup", updateEditorMeta);
    editor.addEventListener("click", updateEditorMeta);
    editor.addEventListener("scroll", updateEditorMeta);

    editor.addEventListener("keydown", (e) => {
      if (e.key === "Tab") {
        e.preventDefault();

        const start = editor.selectionStart;
        const end = editor.selectionEnd;
        const insert = "  ";

        editor.value = editor.value.slice(0, start) + insert + editor.value.slice(end);
        editor.selectionStart = editor.selectionEnd = start + insert.length;

        handleEditorInput();
      }
    });

    $$(".tab").forEach(btn => {
      btn.addEventListener("click", () => switchTab(btn.dataset.tab));
    });

    $("#runBtn").addEventListener("click", updatePreview);
    $("#refreshBtn").addEventListener("click", updatePreview);
    $("#saveBtn").addEventListener("click", () => saveState());
    $("#importBtn").addEventListener("click", () => $("#fileInput").click());
    $("#openPreviewBtn").addEventListener("click", openPreview);
    $("#openSearch").addEventListener("click", openSearch);
    $("#prevMatch").addEventListener("click", () => goToMatch(-1));
    $("#nextMatch").addEventListener("click", () => goToMatch(1));
    $("#replaceBtn").addEventListener("click", replaceAllMatches);

    $("#findInput").addEventListener("input", () => updateSearch(true, true));

    $("#findInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        goToMatch(e.shiftKey ? -1 : 1);
      }

      if (e.key === "Escape") closeSearch();
    });

    $("#replaceInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        replaceAllMatches();
      }

      if (e.key === "Escape") closeSearch();
    });

    $("#fileInput").addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (file) await importFile(file);
      e.target.value = "";
    });

    $("#menuBtn").addEventListener("click", () => {
      $("#menu").classList.toggle("show");
    });

    document.addEventListener("click", (e) => {
      if (!$("#menu").contains(e.target) && !$("#menuBtn").contains(e.target)) {
        $("#menu").classList.remove("show");
      }
    });

    $("#exportBtn").addEventListener("click", downloadFile);
    $("#copyBtn").addEventListener("click", copyFinal);
    $("#resetBtn").addEventListener("click", resetProject);

    $("#layoutBtn").addEventListener("click", () => {
      state.previewOnly = false;
      state.layout = state.layout === "preview" ? "editor" : "preview";
      workspace.style.gridTemplateColumns = "";
      applyLayout();
      saveState(true);
    });

    $("#previewOnlyBtn").addEventListener("click", () => {
      state.previewOnly = !state.previewOnly;
      workspace.style.gridTemplateColumns = "";
      applyLayout();
      saveState(true);
    });

    window.addEventListener("keydown", (e) => {
      const key = e.key.toLowerCase();

      if ((e.ctrlKey || e.metaKey) && key === "s") {
        e.preventDefault();
        saveState();
      }

      if ((e.ctrlKey || e.metaKey) && key === "enter") {
        e.preventDefault();
        updatePreview();
      }

      if ((e.ctrlKey || e.metaKey) && key === "f") {
        e.preventDefault();
        openSearch();
      }

      if (e.key === "Escape") {
        if ($("#searchbar").classList.contains("show")) closeSearch();
        $("#menu").classList.remove("show");
      }
    });

    const resizer = $("#resizer");
    let resizing = false;

    resizer.addEventListener("mousedown", () => {
      resizing = true;
      state.previewOnly = false;
      workspace.classList.remove("preview-only");
      document.body.style.userSelect = "none";
    });

    window.addEventListener("mousemove", (e) => {
      if (!resizing || window.innerWidth < 960) return;

      const rect = workspace.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const pct = Math.max(22, Math.min(78, (x / rect.width) * 100));

      workspace.style.gridTemplateColumns = `${pct}% 8px ${100 - pct}%`;
    });

    window.addEventListener("mouseup", () => {
      if (resizing) saveState(true);
      resizing = false;
      document.body.style.userSelect = "";
    });

    window.addEventListener("beforeunload", (e) => {
      if (!dirty) return;
      e.preventDefault();
      e.returnValue = "";
    });

    applyLayout();
    syncEditor();
    updateSavedUI();
    updatePreview();
  </script>
</body>
</html>
