<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#000;--card:rgba(20,20,20,.8);--card-solid:#111;--fill:rgba(120,120,128,.22);
  --text:#fff;--muted:#8e8e93;--sep:rgba(84,84,88,.5);--blue:#0a84ff;--green:#30d158;--gold:#ffd60a;--red:#ff453a;
  --shadow:0 10px 30px rgba(0,0,0,.5);--r:26px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100vh;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom,0px);
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.97)}
:focus-visible{outline:3px solid rgba(0,122,255,.45);outline-offset:2px}

/* nav translúcida */
.nav{position:sticky;top:0;z-index:10;padding-top:env(safe-area-inset-top,0px);backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);background:color-mix(in srgb,var(--bg) 70%,transparent);border-bottom:.5px solid var(--sep)}
.nav-in{max-width:860px;margin:auto;height:52px;padding:0 20px;display:flex;align-items:center;justify-content:space-between}
.nav-title{font-weight:600;font-size:17px;opacity:0;transition:opacity .25s}
.nav.scrolled .nav-title{opacity:1}
.nav-actions{display:flex;gap:10px;margin-left:auto}
.circle{width:36px;height:36px;border-radius:50%;border:0;background:var(--fill);display:grid;place-items:center;font-size:16px;color:var(--text);transition:transform .2s}
.circle svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.wrap{max-width:860px;margin:auto;padding:12px 18px 60px}
.large{font-size:34px;font-weight:700;letter-spacing:-.4px;margin:10px 4px 2px}
.sub{margin:0 4px 22px;color:var(--muted);font-size:15px}

.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);border:.5px solid var(--sep);overflow:hidden}

/* próximo capítulo */
.next{padding:20px 20px 20px;display:flex;align-items:center;gap:16px;margin-bottom:16px;animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.next-icon{flex:0 0 56px;height:56px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,#ff453a,#ff9f0a);color:#fff;font-size:26px;font-weight:700;box-shadow:0 6px 16px rgba(255,69,58,.35)}
.next-copy{flex:1;min-width:0}
.label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.next-title{font-size:19px;font-weight:650;margin:3px 0 2px;letter-spacing:-.2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.next-meta{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{flex:0 0 auto;border:0;border-radius:999px;background:var(--blue);color:#fff;padding:10px 16px;font-weight:600;font-size:15px}

/* progresso */
.progress{padding:18px 20px;margin-bottom:16px}
.progress-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.progress-top strong{font-size:22px;font-weight:700;letter-spacing:-.3px}
.progress-top span{font-size:13px;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--fill);overflow:hidden}
.bar-fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--blue),#5ac8fa);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:16px;text-align:center}
.stat-v{font-size:22px;font-weight:700;letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.stat-l{font-size:12px;color:var(--muted);margin-top:2px}

/* busca e segmentos */
.search{position:relative;margin:4px 0 12px}
.search input{width:100%;border:0;border-radius:12px;background:var(--fill);padding:11px 14px 11px 38px;font-size:17px;outline:none}
.search input::placeholder{color:var(--muted)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;stroke:var(--muted);fill:none;stroke-width:2.2;stroke-linecap:round}
.segmented{display:flex;background:var(--fill);border-radius:10px;padding:2px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.segmented::-webkit-scrollbar{display:none}
.segmented button{flex:1 0 auto;border:0;background:transparent;padding:7px 10px;border-radius:8px;font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;transition:background .2s,box-shadow .2s}
.segmented button.on{background:var(--card-solid);box-shadow:0 2px 8px rgba(0,0,0,.12)}
.tools{display:flex;gap:8px;margin-bottom:22px}
.select{flex:1;border:0;border-radius:12px;background:var(--fill);padding:10px 12px;font-size:15px;outline:none;-webkit-appearance:none;appearance:none}
.dd{position:relative;flex:1;min-width:0}
.dd-btn{width:100%;border:0;border-radius:12px;background:var(--fill);padding:11px 14px;font-size:15px;text-align:left;display:flex;justify-content:space-between;align-items:center;color:var(--text)}
.dd-btn::after{content:"";width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg) translateY(-2px);margin-left:8px;flex:0 0 auto}
.dd-menu{position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:15;background:var(--card-solid);border:.5px solid var(--sep);border-radius:14px;padding:6px;box-shadow:0 14px 40px rgba(0,0,0,.7);opacity:0;transform:translateY(-6px) scale(.98);pointer-events:none;transition:opacity .18s,transform .22s cubic-bezier(.2,.8,.2,1)}
.dd.open .dd-menu{opacity:1;transform:none;pointer-events:auto}
.dd-menu button{display:block;width:100%;border:0;background:transparent;text-align:left;padding:10px 12px;border-radius:9px;font-size:15px;color:var(--text)}
.dd-menu button:hover{background:var(--fill)}
.dd-menu button.on{color:var(--blue);font-weight:600}
.ghost{border:0;border-radius:12px;background:var(--fill);padding:10px 14px;font-size:15px;font-weight:600;color:var(--blue);white-space:nowrap}

/* listas agrupadas */
.group{margin-bottom:26px;animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.group-head{padding:0 6px 8px;cursor:pointer;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;user-select:none}
.group-head h2{margin:0;font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.02em}
.group-head p{margin:3px 0 0;font-size:12px;color:var(--muted)}
.chev{flex:0 0 auto;width:14px;height:14px;stroke:var(--muted);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.group.collapsed .chev{transform:rotate(-90deg)}
.group.collapsed .rows{display:none}
.rows{background:var(--card-solid);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);border:.5px solid var(--sep)}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px 12px 12px;position:relative;transition:background .25s}
.row+.row::before{content:"";position:absolute;left:58px;right:0;top:0;height:.5px;background:var(--sep)}
.row.hit{background:rgba(0,122,255,.12)}
.num{flex:0 0 32px;height:32px;border-radius:50%;background:var(--fill);display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.row.watched .num{background:var(--green);color:#fff}
.row-body{flex:1;min-width:0}
.row-title{font-size:16px;font-weight:500;line-height:1.3;transition:color .25s}
.row.watched .row-title{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--sep)}
.row-meta{font-size:13px;color:var(--muted);margin-top:2px;line-height:1.3}
.fav{flex:0 0 auto;width:34px;height:34px;border:0;background:transparent;display:grid;place-items:center;color:var(--muted);border-radius:50%}
.fav svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}
.fav.on{color:var(--gold)}
.fav.on svg{fill:currentColor}
/* switch estilo iOS */
.switch{position:relative;flex:0 0 51px;width:51px;height:31px}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch span{position:absolute;inset:0;border-radius:99px;background:var(--fill);transition:background .3s cubic-bezier(.2,.8,.2,1);cursor:pointer}
.switch span::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.1);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.switch input:checked+span{background:var(--green)}
.switch input:checked+span::after{transform:translateX(20px)}
.switch input:focus-visible+span{outline:3px solid rgba(0,122,255,.45);outline-offset:2px}

.lvl{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;margin-left:8px;vertical-align:2px;letter-spacing:0}
.lvl-3{background:rgba(255,69,58,.18);color:#ff453a}
.lvl-2{background:rgba(255,214,10,.15);color:#ffd60a}
.lvl-1{background:var(--fill);color:var(--muted)}
.empty{padding:40px 20px;text-align:center;color:var(--muted);background:var(--card-solid);border-radius:var(--r);font-size:15px}
.loading{padding:40px;text-align:center;color:var(--muted)}
.footer{color:var(--muted);text-align:center;font-size:12px;line-height:1.6;margin-top:30px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;padding:12px 18px;border-radius:999px;background:rgba(40,40,44,.9);color:#fff;font-size:14px;backdrop-filter:blur(20px);transition:opacity .25s,transform .35s cubic-bezier(.2,.8,.2,1);z-index:20;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.confetti{position:fixed;z-index:19;width:8px;height:14px;top:-20px;border-radius:2px;animation:fall 1.4s linear forwards;pointer-events:none}

@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:0}}
@media(max-width:600px){
  .large{font-size:30px}
  .next{flex-wrap:wrap}
  .pill{width:100%;text-align:center}
  .next-icon{flex-basis:48px;height:48px;font-size:22px}
  .row+.row::before{left:58px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

/* ===== ESTADO ===== */
const $ = id => document.getElementById(id);
const $$ = sel => Array.from(document.querySelectorAll(sel));
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const allItems = () => sections.flatMap((s, si) => s.items.map((x, ii) => ({ id: si + '-' + ii, si, ii, title: x[0], meta: x[1] })));

let progress = {};            // { 'id': { watched, favorite } }
let filter = 'all';
let typeVal = 'all';
let loaded = false;
let ui = JSON.parse(localStorage.getItem('marvel-ui') || '{}'); // só preferências visuais
const saveUI = () => localStorage.setItem('marvel-ui', JSON.stringify(ui));

const isWatched = id => !!progress[id]?.watched;
const isFav = id => !!progress[id]?.favorite;

function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._tt);
  window._tt = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ===== SUPABASE ===== */
async function loadProgress() {
  const { data, error } = await sb.from(TABLE).select('item_id, watched, favorite');
  if (error) {
    console.error(error);
    $('list').innerHTML = `<div class="empty"><strong>Não foi possível carregar.</strong><br>Verifique a URL e a chave do Supabase no código.</div>`;
    return;
  }
  progress = {};
  data.forEach(r => progress[r.item_id] = { watched: r.watched, favorite: r.favorite });
  loaded = true;
  render();
}

async function setField(id, field, value) {
  // atualização otimista: a tela muda na hora e o banco sincroniza depois
  const prev = progress[id] ? { ...progress[id] } : null;
  progress[id] = { watched: false, favorite: false, ...progress[id], [field]: value };
  render();
  const p = progress[id];
  const { error } = await sb.from(TABLE).upsert({
    item_id: id, watched: p.watched, favorite: p.favorite, updated_at: new Date().toISOString()
  });
  if (error) {
    console.error(error);
    if (prev) progress[id] = prev; else delete progress[id];
    render();
    toast('Erro ao salvar. Tente de novo.');
  }
}

async function resetAll() {
  const { error } = await sb.from(TABLE).delete().neq('item_id', '');
  if (error) { toast('Erro ao resetar.'); return; }
  progress = {};
  ui.celebrated = false; saveUI();
  render();
  toast('Progresso resetado.');
}

/* ===== FILTROS ===== */
function matches(x) {
  const q = $('search').value.trim().toLowerCase();
  const type = typeVal;
  const textOk = !q || (x.title + ' ' + x.meta).toLowerCase().includes(q);
  const typeOk = type === 'all' || x.meta.includes(type);
  const segOk =
    filter === 'all' ||
    (filter === 'watched' && isWatched(x.id)) ||
    (filter === 'unwatched' && !isWatched(x.id)) ||
    (filter === 'favorites' && isFav(x.id));
  return textOk && typeOk && segOk;
}

/* ===== RENDER ===== */
function render() {
  if (!loaded) return;
  const root = $('list');
  let shown = 0;
  const html = sections.map((sec, si) => {
    const rows = sec.items
      .map((x, ii) => ({ title: x[0], meta: x[1], id: si + '-' + ii, ii }))
      .filter(matches);
    if (!rows.length) return '';
    shown += rows.length;
    const collapsed = ui.collapsed?.[si] ? ' collapsed' : '';
    return `
    <section class="group${collapsed}" style="animation-delay:${Math.min(si * 30, 360)}ms">
      <div class="group-head" data-section="${si}">
        <div>
          <h2>${esc(sec.title)}</h2>
        </div>
        <svg class="chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
      </div>
      <div class="rows">
        ${rows.map(x => `
          <div class="row${isWatched(x.id) ? ' watched' : ''}" data-row="${x.id}">
            <div class="num">${x.ii + 1}</div>
            <div class="row-body">
              <div class="row-title">${esc(x.title)}${lvlBadge(x.title)}</div>
              <div class="row-meta">${esc(x.meta)}</div>
            </div>
            <button class="fav${isFav(x.id) ? ' on' : ''}" data-fav="${x.id}" aria-label="${isFav(x.id) ? 'Remover dos favoritos' : 'Favoritar'}">
              <svg viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3 6.4 20.2l1.1-6.2L3 9.6l6.2-.9L12 3Z"/></svg>
            </button>
            <label class="switch" aria-label="Marcar ${esc(x.title)} como visto">
              <input type="checkbox" data-watch="${x.id}" ${isWatched(x.id) ? 'checked' : ''}>
              <span></span>
            </label>
          </div>`).join('')}
      </div>
    </section>`;
  }).join('');

  root.innerHTML = shown ? html : `<div class="empty"><strong>Nenhum capítulo encontrado.</strong><br>Tente outro termo ou limpe os filtros.</div>`;
  updateProgress();
}

function updateProgress() {
  const all = allItems();
  const watched = all.filter(x => isWatched(x.id)).length;
  const favs = all.filter(x => isFav(x.id)).length;
  const pct = all.length ? Math.round(watched / all.length * 100) : 0;

  $('progressText').textContent = `${pct}%`;
  $('barFill').style.width = pct + '%';
  $('watchedStat').textContent = watched;
  $('remainingStat').textContent = all.length - watched;
  $('favoriteStat').textContent = favs;

  const next = all.find(x => !isWatched(x.id));
  $('nextTitle').textContent = next ? next.title : 'Maratona concluída!';
  $('nextBtn').textContent = next ? 'Continuar' : 'Recomeçar';

  if (pct === 100 && !ui.celebrated) { ui.celebrated = true; saveUI(); celebrate(); }
}

/* ===== AÇÕES ===== */
function revealRow(id) {
  // limpa filtros para garantir que a linha exista na lista
  $('search').value = ''; typeVal = 'all'; $('typeBtn').textContent = 'Todos os tipos'; filter = 'all';
  $$('#seg button').forEach(b => b.classList.toggle('on', b.dataset.filter === 'all'));
  render();
  const el = document.querySelector(`[data-row="${id}"]`);
  if (!el) return;
  const group = el.closest('.group');
  if (group?.classList.contains('collapsed')) { delete ui.collapsed[group.querySelector('.group-head').dataset.section]; saveUI(); render(); }
  const target = document.querySelector(`[data-row="${id}"]`);
  target.scrollIntoView({ behavior: 'smooth', block: 'center' });
  target.classList.add('hit');
  setTimeout(() => target.classList.remove('hit'), 1600);
}

function celebrate() {
  const colors = ['#ff453a', '#ffd60a', '#0a84ff', '#30d158'];
  for (let i = 0; i < 36; i++) {
    const c = document.createElement('i');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = colors[i % 4];
    c.style.animationDelay = Math.random() * .6 + 's';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 2000);
  }
  toast('Parabéns! Você completou a maratona.');
}

/* ===== EVENTOS ===== */
$('list').addEventListener('change', e => {
  const id = e.target.dataset.watch;
  if (id !== undefined) {
    setField(id, 'watched', e.target.checked);
    toast(e.target.checked ? 'Marcado como visto' : 'Voltou para a lista');
  }
});
$('list').addEventListener('click', e => {
  const fav = e.target.closest('[data-fav]');
  if (fav) {
    const id = fav.dataset.fav;
    setField(id, 'favorite', !isFav(id));
    return;
  }
  const head = e.target.closest('.group-head');
  if (head) {
    const si = head.dataset.section;
    ui.collapsed = ui.collapsed || {};
    ui.collapsed[si] = !ui.collapsed[si];
    saveUI();
    head.closest('.group').classList.toggle('collapsed', !!ui.collapsed[si]);
  }
});

$('search').addEventListener('input', render);
$('typeBtn').addEventListener('click', e => { e.stopPropagation(); $('typeDD').classList.toggle('open'); });
$$('#typeDD .dd-menu button').forEach(b => b.addEventListener('click', () => {
  typeVal = b.dataset.v;
  $('typeBtn').textContent = b.textContent;
  $$('#typeDD .dd-menu button').forEach(x => x.classList.toggle('on', x === b));
  $('typeDD').classList.remove('open');
  render();
}));
document.addEventListener('click', () => $('typeDD').classList.remove('open'));
$$('#seg button').forEach(b => b.addEventListener('click', () => {
  filter = b.dataset.filter;
  $$('#seg button').forEach(x => x.classList.toggle('on', x === b));
  render();
}));

$('nextBtn').addEventListener('click', () => {
  const next = allItems().find(x => !isWatched(x.id));
  if (next) revealRow(next.id);
  else if (confirm('Recomeçar a maratona do zero?')) resetAll();
});

$('randomBtn').addEventListener('click', () => {
  const pool = allItems().filter(x => !isWatched(x.id));
  const pick = pool[Math.floor(Math.random() * pool.length)] || allItems()[0];
  revealRow(pick.id);
  toast('Que tal este?');
});

$('resetBtn').addEventListener('click', () => {
  if (confirm('Apagar todo o seu progresso e favoritos?')) resetAll();
});


document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement.tagName !== 'INPUT') { e.preventDefault(); $('search').focus(); }
  if (e.key === 'Escape') { $('search').value = ''; render(); }
});
window.addEventListener('scroll', () => $('nav').classList.toggle('scrolled', scrollY > 60));

/* ===== INÍCIO ===== */
if (SUPABASE_URL.includes('SEU-PROJETO')) {
  $('list').innerHTML = `<div class="empty"><strong>Supabase não configurado.</strong><br>Cole a URL e a anon key no topo do script.</div>`;
} else {
  loadProgress();
}
</script>
