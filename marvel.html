const KEY='marvel-marathon-v2';
let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
let state={watched:saved.watched||{},favorites:saved.favorites||{},collapsed:saved.collapsed||{},theme:saved.theme||'light'};let filter='all';
const $=id=>document.getElementById(id), allItems=()=>sections.flatMap((s,si)=>s.items.map((x,ii)=>({si,ii,title:x[0],meta:x[1],id:`${si}-${ii}`})));
function persist(){localStorage.setItem(KEY,JSON.stringify(state))}function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('toast').classList.remove('show'),2200)}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function updateProgress(){let all=allItems(),watched=all.filter(x=>state.watched[x.id]).length,pct=all.length?Math.round(watched/all.length*100):0;$('progressText').textContent=`${pct}% concluído`;$('count').textContent=`${watched} de ${all.length} vistos`;$('barFill').style.width=pct+'%';$('watchedStat').textContent=watched;$('remainingStat').textContent=all.length-watched;$('favoriteStat').textContent=all.filter(x=>state.favorites[x.id]).length;let next=all.find(x=>!state.watched[x.id]);$('nextTitle').textContent=next?next.title:'Maratona concluída!';$('nextMeta').textContent=next?next.meta:'Você desbloqueou todos os capítulos.';$('nextBtn').textContent=next?'Continuar maratona →':'Recomeçar jornada';if(pct===100&&!state.celebrated){state.celebrated=true;persist();celebrate()}}
function matches(x){let q=$('search').value.trim().toLowerCase(),type=$('typeFilter').value;return(!q||(x.title+' '+x.meta).toLowerCase().includes(q))&&(!type||type==='all'||x.meta.includes(type))&&(filter==='all'||(filter==='watched'&&state.watched[x.id])||(filter==='unwatched'&&!state.watched[x.id])||(filter==='favorites'&&state.favorites[x.id]))}
function render(){let root=$('list');root.innerHTML='';let global=0,shown=0;sections.forEach((sec,si)=>{let visible=sec.items.map((x,ii)=>({title:x[0],meta:x[1],id:`${si}-${ii}`,ii})).filter(matches);sec.items.forEach(()=>global++);if(!visible.length)return;shown+=visible.length;let el=document.createElement('section');el.className='section'+(state.collapsed[si]?' collapsed':'');el.style.animationDelay=Math.min(si*35,400)+'ms';el.innerHTML=`<div class="section-head" data-section="${si}"><div><h2>${sec.title}</h2><p>${sec.desc} · ${visible.length} resultado${visible.length===1?'':'s'}</p></div><button class="section-toggle" aria-label="Recolher seção"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button></div><div class="items"></div>`;let items=el.querySelector('.items');visible.forEach(x=>{let watched=!!state.watched[x.id],fav=!!state.favorites[x.id],item=document.createElement('div');item.className='item'+(watched?' watched':'');item.innerHTML=`<div class="num">${x.ii+1}</div><div><div class="title">${escapeHtml(x.title)}</div><div class="meta">${escapeHtml(x.meta)}</div></div><div class="item-controls"><button class="fav ${fav?'active':''}" data-fav="${x.id}" aria-label="${fav?'Remover dos favoritos':'Adicionar aos favoritos'}">${fav?'<svg viewBox="0 0 24 24" aria-hidden="true" class="star-icon filled"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9L12 3Z"/></svg>':'<svg viewBox="0 0 24 24" aria-hidden="true" class="star-icon"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9L12 3Z"/></svg>'}</button><select class="status" data-id="${x.id}" aria-label="Status de ${escapeHtml(x.title)}"><option value="unwatched" ${!watched?'selected':''}>Não vi</option><option value="watched" ${watched?'selected':''}>✓ Já vi</option></select></div>`;items.appendChild(item)});root.appendChild(el)});if(!shown)root.innerHTML='<div class="empty"><strong>Nenhum capítulo encontrado.</strong><br>Tente outro termo ou limpe os filtros.</div>';bind();updateProgress()}
function bind(){$$('.status').forEach(s=>s.onchange=e=>{let id=e.target.dataset.id;state.watched[id]=e.target.value==='watched';persist();render();toast(state.watched[id]?'Capítulo marcado como visto.':'Capítulo voltou para a lista.')});$$('.fav').forEach(b=>b.onclick=e=>{let id=e.currentTarget.dataset.fav;state.favorites[id]=!state.favorites[id];if(!state.favorites[id])delete state.favorites[id];persist();render();toast(state.favorites[id]?'Adicionado aos favoritos.':'Removido dos favoritos.')});$$('.section-head').forEach(h=>h.onclick=e=>{if(e.target.closest('button')||e.currentTarget){let i=h.dataset.section;state.collapsed[i]=!state.collapsed[i];persist();render()}})}
function $$(sel){return Array.from(document.querySelectorAll(sel))}function celebrate(){for(let i=0;i<34;i++){let c=document.createElement('i');c.className='confetti';c.style.left=Math.random()*100+'vw';c.style.background=['#f0445d','#ffcc66','#6ea8fe','#44d483'][i%4];c.style.animationDelay=Math.random()*.6+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),1900)}toast('Parabéns! Você completou a maratona.')}
function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='marvel-progresso.json';a.click();URL.revokeObjectURL(a.href);toast('Progresso exportado.')}
$('search').oninput=render;$('typeFilter').onchange=render;$$('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;$$('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));render()});$('resetBtn').onclick=()=>{if(confirm('Apagar todo o seu progresso e favoritos?')){state.watched={};state.favorites={};state.celebrated=false;persist();render();toast('Progresso resetado.')}};$('randomBtn').onclick=()=>{let options=allItems().filter(x=>!state.watched[x.id]),pick=options[Math.floor(Math.random()*options.length)]||allItems()[0];$('search').value=pick.title;filter='all';$$('[data-filter]').forEach(x=>x.classList.toggle('active',x.dataset.filter==='all'));render();setTimeout(()=>document.querySelector('.item')?.scrollIntoView({behavior:'smooth',block:'center'}),80);toast('Que tal este capítulo?')};$('nextBtn').onclick=()=>{let next=allItems().find(x=>!state.watched[x.id]);if(next){$('search').value=next.title;filter='all';render();setTimeout(()=>document.querySelector('.item')?.scrollIntoView({behavior:'smooth',block:'center'}),80)}else{state.watched={};state.celebrated=false;persist();render()}};$('themeBtn').onclick=()=>{state.theme=state.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=state.theme;$('themeBtn').textContent=state.theme==='dark'?'☀':'☾';persist()};$('exportBtn').onclick=exportData;$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);state={...state,...d};persist();render();toast('Progresso importado.')}catch(err){toast('Arquivo inválido.')}};r.readAsText(f)};document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement.tagName!=='INPUT'){e.preventDefault();$('search').focus()}if(e.key==='Escape'){$('search').value='';render()}});window.addEventListener('scroll',()=>$('backtop').classList.toggle('show',scrollY>500));$('backtop').onclick=()=>scrollTo({top:0,behavior:'smooth'});document.documentElement.dataset.theme=state.theme;$('themeBtn').textContent=state.theme==='dark'?'☀':'☾';render();
</script></body></html>
