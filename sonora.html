/* ============================================================
   PLAYER — engine
   ============================================================ */
function buildShuffleOrder(){
  shuffleOrder = queue.map((_,i)=>i);
  for(let i=shuffleOrder.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [shuffleOrder[i],shuffleOrder[j]] = [shuffleOrder[j],shuffleOrder[i]];
  }
}

function playFromList(list, startIndex, context){
  queue = list.slice();
  queueIndex = startIndex;
  queueContext = context;
  buildShuffleOrder();
  loadAndPlayCurrent();
}

/* ============================================================
   DESBLOQUEIO DE ÁUDIO NO MOBILE (iOS/Android)
   Navegadores mobile só permitem play() dentro de um gesto do
   usuário. Para que a troca automática de faixa (evento "ended",
   que NÃO é um gesto do usuário) e o buffer duplo funcionem sem
   bloqueios, "destravamos" os DOIS elementos <audio> assim que o
   usuário tocar na tela pela primeira vez: tocamos e pausamos
   ambos silenciosamente, o que os marca como liberados para
   reprodução programática pelo restante da sessão.
   ============================================================ */
function unlockAudio(){
  if(audioUnlocked) return;
  audioUnlocked = true;
  [audio, nextAudio].forEach(el=>{
    try{
      const wasMuted = el.muted;
      el.muted = true;
      const p = el.play();
      const finish = ()=>{ try{ el.pause(); el.currentTime = 0; }catch(e){} el.muted = wasMuted; };
      if(p && typeof p.then === 'function'){ p.then(finish).catch(finish); }
      else { finish(); }
    }catch(e){ /* melhor esforço — ignora falhas de destravamento */ }
  });
}
document.addEventListener('touchstart', unlockAudio, { once:true, passive:true });
document.addEventListener('pointerdown', unlockAudio, { once:true });

/* ============================================================
   BUFFER DUPLO — a próxima faixa da fila é pré-carregada no
   elemento <audio> ocioso (`nextAudio`). Quando a troca de faixa
   acontece, se a URL já estiver bufferizada nesse elemento, as
   REFERÊNCIAS `audio`/`nextAudio` são trocadas entre si (swap) em
   vez de reatribuir `.src`, tornando a transição instantânea —
   inclusive em conexões mobile mais lentas.
   ============================================================ */
function prefetchNextTrack(){
  try{
    const idx = nextIndex();
    const song = idx>=0 ? queue[idx] : null;
    if(!song || !song.audio_url) return;
    // Só recarrega se for uma URL diferente da que já está em buffer
    if(nextAudio.src !== song.audio_url){
      nextAudio.src = song.audio_url;
      nextAudio.preload = 'auto';
      nextAudio.load();
    }
  }catch(e){ /* pré-carregamento é best-effort, ignora falhas */ }
}

function loadAndPlayCurrent(){
  const song = queue[queueIndex];
  if(!song) return;
  const myToken = ++playToken;
  isLoadingTrack = true;
  isPlaying = false;
  updatePlayButtonState();
  updateNowPlayingUI(song);
  applyDominantColor(song.cover_url);
  resetBufferedUI();
  renderView();
  if(document.getElementById('now-playing').classList.contains('open')) renderQueueList();

  const previousActive = audio;

  if(nextAudio.src === song.audio_url && nextAudio.readyState >= 2){
    // A próxima faixa já está bufferizada: troca instantânea de referências.
    const tmp = audio;
    audio = nextAudio;
    nextAudio = tmp;
    try{ if(nextAudio !== previousActive) nextAudio.pause(); }catch(e){}
    if(audio.currentTime > 0.05){ try{ audio.currentTime = 0; }catch(e){} }
  } else {
    try{ nextAudio.pause(); }catch(e){}
    try{ audio.pause(); }catch(e){}
    audio.src = song.audio_url;
    audio.currentTime = 0;
  }
  audio.dataset.loadToken = String(myToken);

  const attemptPlay = ()=>{
    const p = audio.play();
    // Já dispara o pré-carregamento da faixa seguinte imediatamente,
    // sem esperar a confirmação de play(), para maximizar o tempo de buffer.
    prefetchNextTrack();
    if(p && typeof p.then === 'function'){
      p.then(()=>{
        if(myToken!==playToken) return;
        isPlaying = true;
        isLoadingTrack = false;
        updatePlayButtonState();
      }).catch(err=>{
        if(myToken!==playToken) return;
        isLoadingTrack = false;
        isPlaying = false;
        updatePlayButtonState();
        if(err && err.name !== 'AbortError'){
          showToast('Não foi possível reproduzir "'+song.title+'". Verifique o link do áudio.', 'error');
        }
      });
    }
  };
  attemptPlay();
}

/* Os dois elementos <audio> compartilham o mesmo conjunto de listeners.
   Como as referências `audio`/`nextAudio` são trocadas dinamicamente
   (buffer duplo), cada handler verifica se o elemento que disparou o
   evento é o elemento ATIVO no momento antes de agir — isso evita que
   eventos de um elemento em segundo plano (pré-carregando) afetem a UI. */
function onAudioError(el){
  if(el!==audio) return;
  if(String(playToken) !== el.dataset.loadToken) return; // evento de um carregamento antigo/cancelado
  const song = queue[queueIndex];
  if(!song) return;
  isLoadingTrack = false;
  isPlaying = false;
  updatePlayButtonState();
  const code = el.error ? el.error.code : 0;
  let msg = 'Não foi possível carregar "'+song.title+'".';
  if(code === 4) msg = 'O link do áudio de "'+song.title+'" é inválido ou o formato não é suportado.';
  else if(code === 2) msg = 'Falha de rede ao carregar "'+song.title+'". Verifique o link.';
  showToast(msg, 'error');
}
function onAudioEnded(el){
  if(el!==audio) return;
  if(repeatMode==='one'){ el.currentTime=0; el.play().catch(()=>{}); return; }
  playNext();
}
function attachAudioListeners(el){
  el.addEventListener('error', ()=> onAudioError(el));
  el.addEventListener('ended', ()=> onAudioEnded(el));
  el.addEventListener('timeupdate', ()=>{ if(el!==audio) return; updateProgressUI(); updateBufferedUI(); });
  el.addEventListener('progress', ()=>{ if(el!==audio) return; updateBufferedUI(); });
  el.addEventListener('loadedmetadata', ()=>{ if(el!==audio) return; updateProgressUI(); });
  el.addEventListener('waiting', ()=>{ if(el!==audio) return; isLoadingTrack=true; updatePlayButtonState(); });
  el.addEventListener('playing', ()=>{ if(el!==audio) return; isLoadingTrack=false; isPlaying=true; updatePlayButtonState(); });
  el.addEventListener('canplay', ()=>{ if(el!==audio) return; if(isPlaying){ isLoadingTrack=false; updatePlayButtonState(); } });
  el.addEventListener('pause', ()=>{ if(el!==audio) return; if(!isLoadingTrack){ isPlaying=false; updatePlayButtonState(); } });
}
attachAudioListeners(audio);
attachAudioListeners(nextAudio);

function togglePlay(){
  if(!queue[queueIndex]){ return; }
  if(isLoadingTrack) return;
  unlockAudio();
  if(isPlaying){
    audio.pause();
    isPlaying = false;
    updatePlayButtonState();
  } else {
    const p = audio.play();
    if(p && typeof p.then === 'function'){
      p.then(()=>{ isPlaying = true; updatePlayButtonState(); }).catch(()=>{});
    } else {
      isPlaying = true; updatePlayButtonState();
    }
  }
}

function stopPlayback(){
  playToken++;
  try{ audio.pause(); audio.removeAttribute('src'); }catch(e){}
  isPlaying = false;
  isLoadingTrack = false;
  queueIndex = -1;
  document.documentElement.style.setProperty('--dynamic','142,142,147');
  if('mediaSession' in navigator){
    navigator.mediaSession.metadata = null;
    navigator.mediaSession.playbackState = 'none';
  }
  updatePlayButtonState();
}

function nextIndex(){
  if(!queue.length) return -1;
  if(shuffleOn){
    const pos = shuffleOrder.indexOf(queueIndex);
    if(pos < shuffleOrder.length-1) return shuffleOrder[pos+1];
    return repeatMode==='all' ? shuffleOrder[0] : -1;
  }
  if(queueIndex < queue.length-1) return queueIndex+1;
  return repeatMode==='all' ? 0 : -1;
}
function prevIndex(){
  if(!queue.length) return -1;
  if(shuffleOn){
    const pos = shuffleOrder.indexOf(queueIndex);
    if(pos > 0) return shuffleOrder[pos-1];
    return repeatMode==='all' ? shuffleOrder[shuffleOrder.length-1] : queueIndex;
  }
  if(queueIndex > 0) return queueIndex-1;
  return repeatMode==='all' ? queue.length-1 : queueIndex;
}

function playNext(){
  const idx = nextIndex();
  if(idx === -1){ isPlaying=false; updatePlayButtonState(); return; }
  queueIndex = idx;
  loadAndPlayCurrent();
}
function playPrev(){
  if(audio.currentTime > 3){ audio.currentTime = 0; return; }
  const idx = prevIndex();
  if(idx === -1) return;
  queueIndex = idx;
  loadAndPlayCurrent();
}

let seeking = false;
function updateProgressUI(){
  if(seeking) return;
  const dur = audio.duration || 0;
  const cur = audio.currentTime || 0;
  const pct = dur ? (cur/dur*100) : 0;
  $('#seek-fill').style.width = pct+'%';
  $('#np-seek-fill').style.width = pct+'%';
  $('#seek-thumb').style.left = pct+'%';
  $('#np-seek-thumb').style.left = pct+'%';
  $('#seek-input').value = Math.round(pct*10);
  $('#np-seek-input').value = Math.round(pct*10);
  $('#time-current').textContent = formatTime(cur);
  $('#time-duration').textContent = formatTime(dur);
  $('#np-time-current').textContent = formatTime(cur);
  $('#np-time-duration').textContent = formatTime(dur);
  const barPct = document.getElementById('player-bar-progress');
  if(barPct) barPct.style.width = pct+'%';
  updateMediaSessionPosition();
}

/* Indicador de quanto já foi baixado (buffer) na barra de progresso,
   estilo Apple Music/Spotify — ajuda a perceber que a música está
   carregando mesmo antes de tocar. */
function resetBufferedUI(){
  const a = $('#seek-buffered'); if(a) a.style.width='0%';
  const b = $('#np-seek-buffered'); if(b) b.style.width='0%';
}
function updateBufferedUI(){
  try{
    const dur = audio.duration;
    if(!dur || !isFinite(dur) || !audio.buffered || !audio.buffered.length) return;
    let end = 0;
    for(let i=0;i<audio.buffered.length;i++){
      if(audio.buffered.start(i) <= audio.currentTime + 0.25){
        end = Math.max(end, audio.buffered.end(i));
      }
    }
    const pct = Math.min(100, (end/dur)*100);
    const a = $('#seek-buffered'); if(a) a.style.width = pct+'%';
    const b = $('#np-seek-buffered'); if(b) b.style.width = pct+'%';
  }catch(e){}
}

function updatePlayButtonState(){
  const loading = isLoadingTrack;
  $('#icon-play').classList.toggle('hidden', isPlaying || loading);
  $('#icon-pause').classList.toggle('hidden', !isPlaying || loading);
  $('#icon-loading').classList.toggle('hidden', !loading);
  $('#np-icon-play').classList.toggle('hidden', isPlaying);
  $('#np-icon-pause').classList.toggle('hidden', !isPlaying);
  $('#icon-play-m')?.classList.toggle('hidden', isPlaying || loading);
  $('#icon-pause-m')?.classList.toggle('hidden', !isPlaying || loading);
  $('#icon-loading-m')?.classList.toggle('hidden', !loading);
  $('#btn-shuffle').classList.toggle('toggle-on', shuffleOn);
  $('#np-btn-shuffle').classList.toggle('toggle-on', shuffleOn);
  $('#btn-repeat').classList.toggle('toggle-on', repeatMode!=='off');
  $('#np-btn-repeat').classList.toggle('toggle-on', repeatMode!=='off');
  // refletir estado "tocando" nos cards/linhas visíveis
  $$('.song-card').forEach(card=>{
    const playing = queue[queueIndex]?.id === card.dataset.songId;
    card.classList.toggle('is-playing', !!playing);
    const icon = $('.song-card-play svg', card);
    if(icon) icon.innerHTML = (playing && isPlaying) ? '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>' : '<path d="M8 5v14l11-7z"/>';
  });
  updateMediaSessionPlaybackState();
}

function updateNowPlayingUI(song){
  const cover = song.cover_url || '';
  $('#player-title').textContent = song.title;
  $('#player-artist').textContent = song.artist || 'Artista desconhecido';
  $('#player-cover-img').src = cover;
  $('#np-title').textContent = song.title;
  $('#np-artist').textContent = song.artist || 'Artista desconhecido';
  $('#np-art-img').src = cover;
  $('#np-bg-img').src = cover;
  document.title = `${song.title} — Sonora`;
  updateMediaSessionMetadata(song);
}

/* ============================================================
   MEDIA SESSION — mostra capa, título e controles na tela de
   bloqueio / central de controle do iOS e nas notificações de
   mídia do Android/desktop, mesmo com o site em segundo plano.
   ============================================================ */
function setupMediaSession(){
  if(!('mediaSession' in navigator)) return;
  try{
    navigator.mediaSession.setActionHandler('play', ()=>{ if(!isPlaying) togglePlay(); });
    navigator.mediaSession.setActionHandler('pause', ()=>{ if(isPlaying) togglePlay(); });
    navigator.mediaSession.setActionHandler('previoustrack', playPrev);
    navigator.mediaSession.setActionHandler('nexttrack', playNext);
    navigator.mediaSession.setActionHandler('stop', stopPlayback);
    navigator.mediaSession.setActionHandler('seekto', (details)=>{
      if(details.fastSeek && 'fastSeek' in audio){ audio.fastSeek(details.seekTime); return; }
      if(isFinite(details.seekTime)) audio.currentTime = details.seekTime;
    });
  }catch(e){ /* alguns navegadores não suportam todos os handlers */ }
}
function updateMediaSessionMetadata(song){
  if(!('mediaSession' in navigator) || !song) return;
  const artwork = song.cover_url ? [96,128,192,256,384,512].map(size=>({
    src: song.cover_url, sizes: `${size}x${size}`, type: 'image/png'
  })) : [];
  try{
    navigator.mediaSession.metadata = new MediaMetadata({
      title: song.title || 'Música',
      artist: song.artist || 'Artista desconhecido',
      album: 'Sonora',
      artwork
    });
  }catch(e){}
}
function updateMediaSessionPlaybackState(){
  if(!('mediaSession' in navigator)) return;
  navigator.mediaSession.playbackState = isPlaying ? 'playing' : 'paused';
}
function updateMediaSessionPosition(){
  if(!('mediaSession' in navigator) || !('setPositionState' in navigator.mediaSession)) return;
  if(!isFinite(audio.duration) || audio.duration<=0) return;
  try{
    navigator.mediaSession.setPositionState({
      duration: audio.duration,
      playbackRate: audio.playbackRate || 1,
      position: Math.min(audio.currentTime, audio.duration)
    });
  }catch(e){}
}

/* Controles — barra inferior */
$('#btn-play').addEventListener('click', togglePlay);
$('#btn-play-mobile')?.addEventListener('click', togglePlay);
$('#btn-next').addEventListener('click', playNext);
$('#btn-prev').addEventListener('click', playPrev);
$('#btn-shuffle').addEventListener('click', ()=>{ shuffleOn = !shuffleOn; buildShuffleOrder(); prefetchNextTrack(); updatePlayButtonState(); });
$('#btn-repeat').addEventListener('click', ()=>{
  repeatMode = repeatMode==='off' ? 'all' : repeatMode==='all' ? 'one' : 'off';
  prefetchNextTrack();
  updatePlayButtonState();
  showToast(repeatMode==='off' ? 'Repetir desativado' : repeatMode==='all' ? 'Repetindo playlist' : 'Repetindo música');
});
function bindSeek(inputId, fillId, thumbId){
  const input = document.getElementById(inputId);
  const wrap = input.closest('.seek-wrap');
  const thumb = thumbId ? document.getElementById(thumbId) : null;
  const setDragging = (v)=>{ if(wrap) wrap.classList.toggle('seeking', v); };
  input.addEventListener('pointerdown', ()=> setDragging(true));
  input.addEventListener('input', ()=>{
    seeking = true;
    setDragging(true);
    const pct = input.value/1000;
    document.getElementById(fillId).style.width = (pct*100)+'%';
    if(thumb) thumb.style.left = (pct*100)+'%';
  });
  input.addEventListener('change', ()=>{
    const pct = input.value/1000;
    if(audio.duration) audio.currentTime = pct*audio.duration;
    seeking = false;
    setDragging(false);
  });
  input.addEventListener('pointerup', ()=> setDragging(false));
  input.addEventListener('pointercancel', ()=> setDragging(false));
}
bindSeek('seek-input','seek-fill','seek-thumb');
bindSeek('np-seek-input','np-seek-fill','np-seek-thumb');

function bindVolume(inputId, fillId){
  const input = document.getElementById(inputId);
  input.addEventListener('input', ()=>{
    const v = input.value/100;
    audio.volume = v;
    nextAudio.volume = v;
    document.getElementById(fillId).style.width = (v*100)+'%';
    syncVolumeUI(inputId, v);
  });
}
function syncVolumeUI(sourceId, v){
  ['volume-input','np-volume-input'].forEach(id=>{
    if(id!==sourceId) document.getElementById(id).value = Math.round(v*100);
  });
  ['volume-fill','np-volume-fill'].forEach(id=> document.getElementById(id).style.width=(v*100)+'%');
}
bindVolume('volume-input','volume-fill');
bindVolume('np-volume-input','np-volume-fill');
audio.volume = 0.8;
nextAudio.volume = 0.8;

/* Controles — tela cheia */
$('#np-btn-play').addEventListener('click', togglePlay);
$('#np-btn-next').addEventListener('click', playNext);
$('#np-btn-prev').addEventListener('click', playPrev);
$('#np-btn-shuffle').addEventListener('click', ()=>{ shuffleOn=!shuffleOn; buildShuffleOrder(); prefetchNextTrack(); updatePlayButtonState(); });
$('#np-btn-repeat').addEventListener('click', ()=> $('#btn-repeat').click());

/* Abrir/fechar tela cheia */
const npEl = document.getElementById('now-playing');
$('#btn-expand').addEventListener('click', ()=>{
  if(!queue[queueIndex]) return;
  npEl.classList.add('open');
  renderQueueList();
});
$('#player-track-open').addEventListener('click', ()=>{
  if(!queue[queueIndex]) return;
  npEl.classList.add('open');
  renderQueueList();
});
$('#btn-collapse').addEventListener('click', ()=> npEl.classList.remove('open'));

/* ============================================================
   ARRASTAR PARA BAIXO PARA FECHAR — "Tocando agora" (mobile)
   No celular, o único jeito de voltar da tela cheia é arrastando
   para baixo (como nas folhas/sheets do iOS): o gesto funciona em
   qualquer ponto da tela (não só no topo), acompanha o dedo com a
   folha "encolhendo" levemente e ganhando cantos arredondados
   enquanto é arrastada, e fecha se passar de um limite de distância
   OU se o "flick" for rápido o suficiente — exatamente como no
   Apple Music/Central de Controle. Se o usuário estiver rolando a
   fila de "A seguir" (conteúdo já scrollado), o gesto não interfere.
   ============================================================ */
(function enableNpSwipeClose(){
  const npBody = $('.np-body', npEl);
  const CLOSE_DISTANCE = 130;   // px arrastados para fechar
  const CLOSE_VELOCITY = 0.55;  // px/ms — "flick" rápido também fecha
  let sy=0, cy=0, lastY=0, lastT=0, velocity=0, dragging=false;

  function isInteractive(target){
    return !!target.closest('button, input, .np-queue .song-row, .seek-input, a');
  }

  npEl.addEventListener('touchstart', (e)=>{
    if(!isMobileView() || !npEl.classList.contains('open')) return;
    if(isInteractive(e.target)) return;
    if(npBody.scrollTop > 0) return; // só inicia quando o conteúdo já está no topo
    const t = e.touches[0];
    sy = t.clientY; cy = sy; lastY = sy; lastT = e.timeStamp; velocity = 0;
    dragging = true;
    npEl.classList.add('dragging');
  }, { passive:true });

  npEl.addEventListener('touchmove', (e)=>{
    if(!dragging) return;
    const t = e.touches[0];
    cy = t.clientY;
    const dy = cy - sy;
    if(dy <= 0){ npEl.style.transform=''; npEl.style.borderRadius=''; return; }
    if(e.cancelable) e.preventDefault(); // evita bounce do scroll interno enquanto arrasta a folha
    const dt = e.timeStamp - lastT;
    if(dt > 0) velocity = (cy-lastY)/dt;
    lastY = cy; lastT = e.timeStamp;
    const damped = dy * (dy < 260 ? 1 : 0.4 + 260/dy*0.6); // leve resistência no fim do curso
    const scale = Math.max(0.9, 1 - dy/1800);
    npEl.style.transform = `translateY(${damped}px) scale(${scale})`;
    npEl.style.borderRadius = Math.min(30, dy/4) + 'px';
  }, { passive:false });

  function finishDrag(){
    if(!dragging) return;
    dragging = false;
    npEl.classList.remove('dragging');
    const dy = Math.max(0, cy - sy);
    const shouldClose = dy > CLOSE_DISTANCE || velocity > CLOSE_VELOCITY;
    npEl.style.transform = '';
    npEl.style.borderRadius = '';
    if(shouldClose) npEl.classList.remove('open');
  }
  npEl.addEventListener('touchend', finishDrag);
  npEl.addEventListener('touchcancel', finishDrag);
})();

function renderQueueList(){
  const box = document.getElementById('np-queue-list');
  const upcoming = queue.map((s,i)=>({s,i})).filter(o=>o.i!==queueIndex);
  document.getElementById('np-queue-count').textContent = queue.length + ' música' + (queue.length===1?'':'s');
  if(!upcoming.length){ box.innerHTML = `<div class="playlist-empty-hint" style="color:rgba(255,255,255,0.4)">Fim da fila.</div>`; return; }
  box.innerHTML = upcoming.map(({s,i})=>`
    <div class="song-row" data-qidx="${i}">
      <div class="row-index" style="color:rgba(255,255,255,0.4)">${i+1}</div>
      <div class="row-cover">${s.cover_url?`<img src="${esc(s.cover_url)}" alt="" draggable="false">`:svgNote()}</div>
      <div class="row-main">
        <div class="row-title" style="color:#fff">${esc(s.title)}</div>
        <div class="row-artist" style="color:rgba(255,255,255,0.55)">${esc(s.artist||'Artista desconhecido')}</div>
      </div>
    </div>
  `).join('');
  $$('.song-row', box).forEach(row=>{
    row.addEventListener('click', ()=>{
      queueIndex = parseInt(row.dataset.qidx,10);
      loadAndPlayCurrent();
    });
  });
}

/* ============================================================
   COR DOMINANTE DA CAPA (ambiente dinâmico)
   ============================================================ */
function applyDominantColor(url){
  if(!url){ document.documentElement.style.setProperty('--dynamic','142,142,147'); return; }
  if(dominantColorCache[url]){
    document.documentElement.style.setProperty('--dynamic', dominantColorCache[url]);
    return;
  }
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = ()=>{
    try{
      const canvas = document.createElement('canvas');
      const size = 24;
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img,0,0,size,size);
      const data = ctx.getImageData(0,0,size,size).data;
      let r=0,g=0,b=0,count=0;
      for(let i=0;i<data.length;i+=4){
        const alpha = data[i+3];
        if(alpha<10) continue;
        r+=data[i]; g+=data[i+1]; b+=data[i+2]; count++;
      }
      if(!count) throw new Error('empty');
      r=Math.round(r/count); g=Math.round(g/count); b=Math.round(b/count);
      const value = `${r},${g},${b}`;
      dominantColorCache[url] = value;
      document.documentElement.style.setProperty('--dynamic', value);
    }catch(e){
      document.documentElement.style.setProperty('--dynamic','142,142,147');
    }
  };
  img.onerror = ()=>{ document.documentElement.style.setProperty('--dynamic','142,142,147'); };
  img.src = url;
}
