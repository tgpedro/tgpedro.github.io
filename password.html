<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>pedro hub | central privada</title>
    <style>
        :root {
            --bg-color: #000000;
            --accent-color: #007aff;
            --text-color: #ffffff;
            --glass-bg: rgba(28, 28, 30, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --error-color: #ff453a;
            --ios-radius: 22px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Background iOS 18 Style */
        .wallpaper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #000000 0%, #1a1a1a 100%);
            z-index: -2;
        }

        .blur-blob {
            position: absolute;
            width: 60vw;
            height: 60vw;
            background: radial-gradient(circle, var(--accent-color) 0%, transparent 70%);
            filter: blur(80px);
            opacity: 0.2;
            animation: float 15s infinite alternate ease-in-out;
            z-index: -1;
        }

        @keyframes float {
            0% { transform: translate(-20%, -20%) scale(1); }
            100% { transform: translate(20%, 20%) scale(1.2); }
        }

        .container {
            width: 100%;
            max-width: 360px;
            padding: 24px;
            text-align: center;
            animation: ios-intro 1s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        @keyframes ios-intro {
            from { opacity: 0; transform: scale(1.1); filter: blur(10px); }
            to { opacity: 1; transform: scale(1); filter: blur(0); }
        }

        .app-icon-preview {
            width: 80px;
            height: 80px;
            background: linear-gradient(180deg, #2c2c2e 0%, #000 100%);
            border-radius: 18px;
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            border: 0.5px solid rgba(255,255,255,0.1);
        }

        .app-icon-preview svg {
            width: 40px;
            height: 40px;
            fill: var(--accent-color);
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }

        p {
            color: #8e8e93;
            font-size: 1rem;
            margin-bottom: 48px;
        }

        .login-card {
            background: var(--glass-bg);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            border: 0.5px solid var(--glass-border);
            border-radius: 32px;
            padding: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .input-group {
            position: relative;
            margin-bottom: 16px;
        }

        input {
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            border: none;
            border-radius: 14px;
            padding: 18px 16px;
            color: #fff;
            font-size: 1.1rem;
            outline: none;
            text-align: center;
            transition: all 0.3s ease;
        }

        input:focus {
            background: rgba(255, 255, 255, 0.12);
        }

        button#login-btn {
            width: 100%;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 14px;
            padding: 16px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button#login-btn:active {
            transform: scale(0.96);
            opacity: 0.8;
        }

        .error-msg {
            color: var(--error-color);
            font-size: 0.85rem;
            margin-top: 16px;
            display: none;
            font-weight: 500;
        }

        .shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        .footer-hint {
            position: fixed;
            bottom: 40px;
            color: #48484a;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="wallpaper"></div>
    <div class="blur-blob"></div>

    <div class="container">
        <div class="app-icon-preview">
            <svg viewBox="0 0 24 24">
                <path d="M12 2L4.5 20.29L5.21 21L12 18L18.79 21L19.5 20.29L12 2Z" />
            </svg>
        </div>
        <h1>pedro hub</h1>
        <p>central privada</p>

        <div class="login-card" id="card">
            <div class="input-group">
                <input type="password" id="password" placeholder="senha" autofocus>
            </div>
            <button id="login-btn">entrar</button>
            <div class="error-msg" id="error-msg">senha incorreta</div>
        </div>
    </div>

    <div class="footer-hint">encriptado de ponta a ponta</div>

    <script>
        const ACCESS_PASSWORD = "pedro";
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('login-btn');
        const errorMsg = document.getElementById('error-msg');
        const card = document.getElementById('card');

        if (localStorage.getItem('pedro_hub_auth') === 'true') {
            window.location.href = '../';
        }

        function handleLogin() {
            if (passwordInput.value === ACCESS_PASSWORD) {
                localStorage.setItem('pedro_hub_auth', 'true');
                window.location.href = '../';
            } else {
                errorMsg.style.display = 'block';
                card.classList.add('shake');
                setTimeout(() => card.classList.remove('shake'), 500);
                passwordInput.value = '';
                passwordInput.focus();
            }
        }

        loginBtn.addEventListener('click', handleLogin);
        passwordInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleLogin(); });
        passwordInput.addEventListener('input', () => { errorMsg.style.display = 'none'; });
    </script>
</body>
</html>
